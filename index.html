    +'<button type="button" class="tab'+(zakSub==='forms'?' active':'')+'" data-zsub="forms"><span class="wh-name">🧩 Конструктор</span></button>'
    +'<button type="button" class="tab'+(zakSub==='orders'?' active':'')+'" data-zsub="orders"><span class="wh-name">📥 Заказы</span></button>'
    +'<button type="button" class="tab'+(zakSub==='clients'?' active':'')+'" data-zsub="clients"><span class="wh-name">👥 Клиенты</span></button>'
    +'</div>';
   h+='<div>'+(zakSub==='orders'?zakHtmlOrders():(zakSub==='clients'?zakHtmlClients():zakHtmlForms()))+'</div>';
  h+='</div>';
  pane.innerHTML=h;
  pane.querySelectorAll('[data-zsub]').forEach(t=>{
    t.addEventListener('click',()=>{ zakSub=t.getAttribute('data-zsub'); renderZak(); });
  });
  const zn=pane.querySelector('[data-znew]');
  if(zn)zn.onclick=()=>zakEditForm(null);
  const zp=pane.querySelector('[data-zpush]');
  if(zp)zp.onclick=async()=>{
    try{
      const rows=zakForms().filter(f=>f.status!=='del').map(f=>({id:f.id,code:f.code,name:f.name,payload:f,status:'ok'}));
      if(!rows.length){ alert('Нет форм для отправки.'); return; }
      await supaUpsert('zak_forms','id',rows);
      alert('☁ Формы отправлены: '+rows.length+'. Ссылки у покупателей работают.');
    }catch(e){ alert('Не удалось отправить формы: '+e.message); }
  };
  pane.querySelectorAll('[data-zlink]').forEach(b=>{ b.onclick=()=>zakCopyLink(b.getAttribute('data-zlink')); });
  pane.querySelectorAll('[data-zeditf]').forEach(b=>{ b.onclick=()=>zakEditForm(b.getAttribute('data-zeditf')); });
  pane.querySelectorAll('[data-zdelf]').forEach(b=>{
    b.onclick=()=>{
      const f=zakForms().find(x=>x.id===b.getAttribute('data-zdelf'));
      if(!f)return;
      if(!confirm('Удалить форму «'+f.name+'»? Ссылка у покупателей перестанет работать после следующего «Отправить формы».'))return;
      f.status='del';
      try{ saveStore(); }catch(e){}
      try{ supaUpsert('zak_forms','id',[{id:f.id,code:f.code,name:f.name,payload:f,status:'del'}]); }catch(e){}
      renderZak();
    };
  });
  const zpl=pane.querySelector('[data-zpull]');
  if(zpl)zpl.onclick=async()=>{
    try{
      const rows=await supaGet('zak_orders?select=*');
      const loc=zakOrders();
      rows.forEach(r=>{ const i=loc.findIndex(x=>x.id===r.id); const o={id:r.id,fid:r.fid,fname:r.fname,cust:r.cust,phone:r.phone,addr:r.addr,note:r.note,items:r.items,total:r.total,status:r.status,created:r.created}; if(i>=0)loc[i]=o; else loc.push(o); });
      try{ saveStore(); }catch(e){}
      renderZak();
      alert('⬇ Заказы загружены: '+rows.filter(r=>r.status!=='del').length+'.');
    }catch(e){ alert('Не удалось загрузить заказы: '+e.message); }
  };
  pane.querySelectorAll('[data-zok]').forEach(b=>{
    b.onclick=async()=>{
      const o=zakOrders().find(x=>x.id===b.getAttribute('data-zok'));
      if(!o)return;
      o.status='done';
      try{ saveStore(); }catch(e){}
      try{ await supaUpsert('zak_orders','id',[o]); }catch(e){ alert('Отметка не ушла в облако: '+e.message); }
      renderZak();
    };
  });
  pane.querySelectorAll('[data-zdelo]').forEach(b=>{
    b.onclick=async()=>{
      const o=zakOrders().find(x=>x.id===b.getAttribute('data-zdelo'));
      if(!o)return;
      if(!confirm('Удалить заказ от «'+(o.cust||'без имени')+'»?'))return;
      o.status='del';
      try{ saveStore(); }catch(e){}
      try{ await supaUpsert('zak_orders','id',[o]); }catch(e){}
      renderZak();
    };
  });
}

function zakBindPage(root,form,isPrev){
  const blocks=zakFormBlocks(form);
  const bName=zakFBlk(blocks,'name'),bPhone=zakFBlk(blocks,'phone'),bAddr=zakFBlk(blocks,'addr'),bNote=zakFBlk(blocks,'note');
  const askName=!!bName, askPhone=!!bPhone, askAddr=!!bAddr, askNote=!!bNote;
  const lblPhone=(bPhone&&bPhone.lbl)||'Телефон';
  const lblAddr=(bAddr&&bAddr.lbl)||('Адрес доста'+'вки');
  const reqPhone=!!(bPhone&&bPhone.req), reqAddr=!!(bAddr&&bAddr.req);
  const qtys=Array.prototype.slice.call(root.querySelectorAll('[data-zqty]'));
  const totalEl=root.querySelector('#zTotal');
  const hintEl=root.querySelector('#zHint');
  const qMin=parseFloat(form.qMin)||0, qMax=parseFloat(form.qMax)||0;
  const dlvFee=parseFloat(form.dlvFee)||0;
  const radios=Array.prototype.slice.call(root.querySelectorAll('input[name="zdlv"]'));
  const dlvVal=()=>{ const r=radios.find(x=>x.checked); return r?r.value:'pick'; };
  const schedOpen=()=>{
    if(!form.schedOn)return true;
    const days=String(form.schedDays||'').split(',').map(s=>+s.trim()).filter(n=>!isNaN(n));
    const d=new Date();
    if(days.length&&days.indexOf(d.getDay())<0)return false;
    const now=d.getHours()*60+d.getMinutes();
    const p=t=>{ const m=String(t||'').match(/^(\d{1,2}):(\d{2})$/); return m?(+m[1]*60+ +m[2]):null; };
    const a=p(form.schedFrom), b2=p(form.schedTo);
    if(a!=null&&now<a)return false;
    if(b2!=null&&now>=b2)return false;
    return true;
  };
  const setHint=txt=>{ if(hintEl)hintEl.textContent=txt||''; };
  let itemsTotal=0;
  const calc=()=>{
    let s=0;
    qtys.forEach(el=>{ const g=form.prods[+el.getAttribute('data-zqty')]; let q=parseFloat(el.value)||0;
      if(qMax>0&&q>qMax)q=qMax;
      if(q<0)q=0;
      s+=q*(g.price||0); });
    itemsTotal=s;
    if(totalEl)totalEl.textContent=Math.round((s+(radios.length&&dlvVal()==='dlv'?dlvFee:0))*100)/100;
    updateSend();
  };
  const updateSend=()=>{
    const send=root.querySelector('#zSend'); if(!send)return;
    let ok=true,msg='';
    if(!schedOpen()){ ok=false; msg='Сейчас заказы не принимаются. Часы работы формы: '+String(form.schedDays||'').split(',').filter(x=>x!=='').map(x=>['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][+x]).join(',')+' '+(form.schedFrom||'00:00')+'–'+(form.schedTo||'23:59')+'.'; }
    else{ const ms=parseFloat(form.minSum)||0; if(ms>0&&itemsTotal<ms){ ok=false; msg='Минимальная сумма заказа — '+ms+' ₽. Добавьте ещё на '+(Math.round((ms-itemsTotal)*100)/100)+' ₽.'; } }
    send.disabled=!ok;
    setHint(ok?'':msg);
  };
  qtys.forEach(el=>el.addEventListener('input',calc));
  radios.forEach(r=>r.addEventListener('change',calc));
  const phEl=root.querySelector('#zPhone');
  if(phEl&&!isPrev){
    phEl.addEventListener('blur',async()=>{
      const v=(phEl.value||'').trim(); if(v.length<3)return;
      try{
        const rows=await supaGet('zak_orders?phone=eq.'+encodeURIComponent(v)+'&order=created.desc&limit=1&select=items,created');
        const it=(rows&&rows[0]&&rows[0].items)||null;
        if(!it||!it.length)return;
        let ch=false;
        it.forEach(x=>{ const i=form.prods.findIndex(g=>g.name===x.name);

function whFmtDT(mv){ if(!mv||!mv.date)return''; const p=String(mv.date).split('-'); let r=(p[2]||'')+'.'+(p[1]||'')+'.'+(p[0]||''); if(mv.t)r+=' '+mv.t; return r; }
function whToday(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function whPackKg(name){
  const m=String(name||'').match(/(\d+(?:[.,]\d+)?)\s*(г|гр|кг)\b/i);
  if(!m)return 0;
  const v=parseFloat(String(m[1]).replace(',','.'));
  if(!isFinite(v)||v<=0)return 0;
  return (m[2].toLowerCase()==='кг')?v:v/1000;
}
function whPacksTxt(nm,kg){
  const p=whPackKg(nm);
  if(!p||!(kg>0))return'';
  return ' (≈'+Math.floor(kg/p+1e-9)+' пач.)';
}
function whBalances(wi){
  const m={};
  whMoves().forEach(mv=>{
    let r=null,d=0;
    if(mv.type==='in'&&mv.to===wi){
      r=m[mv.name]||(m[mv.name]={in:0,out:0,costIn:0,costOut:0,unit:mv.unit||''});
      d=+mv.qty||0;
      if(!r.unit&&mv.unit)r.unit=mv.unit;
      const p=+mv.price||0;
      if(p>0)r.costIn+=d*p;
      r.in+=d;
      return;
    }
    if(mv.type==='adjust'&&(mv.from===wi||mv.to===wi)){
      r=m[mv.name]||(m[mv.name]={in:0,out:0,costIn:0,costOut:0,unit:mv.unit||''});
      if(!r.unit&&mv.unit)r.unit=mv.unit;
      const q=+mv.qty||0;
      if(q>=0){ r.in+=q; const avg=(r.in>0)?(r.costIn/r.in):0; if(avg>0)r.costIn+=q*avg; }
      else { r.out+=-q; const avg2=(r.in>0)?(r.costIn/r.in):0; r.costOut+=(-q)*avg2; }
      return;
    }
    if(mv.type==='out'&&mv.from===wi){ r=m[mv.name]||(m[mv.name]={in:0,out:0,costIn:0,costOut:0,unit:mv.unit||''}); d=-(+mv.qty||0); }
    else if(mv.type==='move'){
      if(mv.from===wi){ r=m[mv.name]||(m[mv.name]={in:0,out:0,costIn:0,costOut:0,unit:mv.unit||''}); d=-(+mv.qty||0); }
      else if(mv.to===wi){
        r=m[mv.name]||(m[mv.name]={in:0,out:0,costIn:0,costOut:0,unit:mv.unit||''});
        d=+mv.qty||0;
        if(!r.unit&&mv.unit)r.unit=mv.unit;
        const p=+mv.price||0;
        if(p>0)r.costIn+=d*p;
        r.in+=d;
        return;
      }
      else return;
    } else return;
    if(!r.unit&&mv.unit)r.unit=mv.unit;
    const avg=(r.in>0)?(r.costIn/r.in):0;
    if(d>=0){ r.in+=d; if(+mv.price>0)r.costIn+=d*(+mv.price); else if(avg>0)r.costIn+=d*avg; }
    else { r.out+=-d; r.costOut+=(-d)*avg; }
  });
  Object.keys(m).forEach(k=>{ m[k].cost=m[k].costIn-m[k].costOut; });
  return m;
}

      +'<th style="text-align:center;padding:8px;border-bottom:2px solid var(--line);background:var(--panel2)">Ед.</th>'
      +'<th style="text-align:right;padding:8px;border-bottom:2px solid var(--line);background:var(--panel2);user-select:none;cursor:pointer" data-whsort="in" title="Сортировать по приходу">Приход'+(whW1.sort.key==='in'?(whW1.sort.dir>0?' ▲':' ▼'):'')+'</th>'
      +'<th style="text-align:right;padding:8px;border-bottom:2px solid var(--line);background:var(--panel2);user-select:none;cursor:pointer" data-whsort="out" title="Сортировать по расходу">Расход'+(whW1.sort.key==='out'?(whW1.sort.dir>0?' ▲':' ▼'):'')+'</th>'
      +'<th style="text-align:right;padding:8px;border-bottom:2px solid var(--line);background:var(--panel2);border-radius:0 6px 0 0;user-select:none;cursor:pointer" data-whsort="rest" title="Сортировать по остатку">Остаток'+(whW1.sort.key==='rest'?(whW1.sort.dir>0?' ▲':' ▼'):'')+'</th>'

      +'</tr></thead><tbody>'+rows+'</tbody></table></div>'

  }
  const mine=whMoves().filter(mv=>mv.from===wi||mv.to===wi).slice(-12).reverse();
  if(mine.length){

    mine.forEach(mv=>{
      const dir=mv.type==='in'?'➕ приход':(mv.type==='out'?'➖ списание':(mv.type==='adjust'?'📋 корректировка (инвентаризация)':('⇄ '+esc(names[mv.from]||'?')+' → '+esc(names[mv.to]||'?'))));

        +'<span style="flex:1">'+esc(whFmtDT(mv))+' — '+dir+' — <b>'+esc(mv.name)+'</b> '+(+((+mv.qty||0).toFixed(3)))+' '+esc(mv.unit||'')+(mv.note?' <span style="color:var(--muted)">('+esc(mv.note)+')</span>':'')+'</span>'
        +'<button class="btn ghost sm" data-whed="'+esc(mv.id)+'" title="Изменить" style="padding:1px 7px;font-size:12px;min-height:0">✏️</button>'

function whRead(back,id){ const e=back.querySelector('#'+id); return e?String(e.value).trim():''; }
function whAct(wi,act){
  const names=whNames();
  if(act==='inv'){ whInventory(wi); return; }
  if(act==='prod'){ whProd(wi); return; }
  if(act==='load'){ whLoad(wi); return; }
  if(act==='sell'){ whSell(wi); return; }
  if(act==='invblank'){ whInvPrintBlank(wi); return; }
  if(act==='invact'){
    const a=(store.whInvLastAct||{})[wi];
    if(!a){ alert('Инвентаризация ещё не проводилась.'); return; }
    let h='<h2>Акт инвентаризации — '+esc(names[wi])+'</h2><h3>Дата: '+esc(a.date)+'</h3><table><tr><th>Товар</th><th>Ед.</th><th class="n">По программе</th><th class="n">По факту</th><th class="n">Расхождение</th><th class="n">Стоимость расх., ₽</th></tr>';
    h+=a.rows||'';
    h+='</table><div class="sig"><div>Пересчитал: ____________</div><div>Проверил: ____________</div></div>';
    whPrintHtml('Акт инвентаризации',h);
    return;
  }
  let title='',rows='',preset={};
  if(act==='in'){
    title='➕ Приход на «'+esc(names[wi])+'»';
    let opts='<option value="">— выбери сырьё —</option>'+(store.raw||[]).map(r=>'<option>'+esc(r.name)+'</option>').join('');
    rows+=whField('Товар','<select id="whFName">'+opts+'</select>');
    rows+=whField('Свободное название (если нет в списке)','<input id="whFNew" placeholder="например, уголь">');
    preset.unit=true;
    rows+=whField('Количество','<input id="whFQty" type="number" step="any" min="0" placeholder="0">');
    rows+=whField('Ед. изм.','<input id="whFUnit" placeholder="кг, шт, л…">');
    rows+=whField('Цена за ед., ₽ (по чеку; можно пусто)','<input id="whFPrice" type="number" step="any" min="0" placeholder="напр. 65">');
    rows+=whField('Примечание','<input id="whFNote" placeholder="можно пусто">');
  } else if(act==='out'){
    title='➖ Списание с «'+esc(names[wi])+'»';
    const bl=whBalances(wi);
    const avail=Object.keys(bl).filter(nm=>bl[nm].in-bl[nm].out>0).sort();
    let opts=avail.map(nm=>'<option>'+esc(nm)+' (ост. '+(+((bl[nm].in-bl[nm].out).toFixed(3)))+' '+esc(bl[nm].unit||'')+')'+'</option>').join('');
    if(opts.length){
      rows+=whField('Товар','<select id="whFSel">'+opts+'<option value="__other">— другое (вписать) —</option></select><input id="whFName" placeholder="название" style="display:none;margin-top:6px">');
    } else {
      rows+=whField('Товар','<input id="whFName" placeholder="название">');
    }
    rows+=whField('Количество'+(wi>0?' (вес, кг)':''),'<input id="whFQty" type="number" step="any" min="0" placeholder="0">');
    rows+=whField('Причина (брак, порча, продажа…)','<input id="whFNote" placeholder="можно пусто">');
  } else if(act==='move'){
    if(wi>=WH_COUNT-1){ alert('Этот склад никуда не перемещает: он последний в цепочке.'); return; }
    title='⇄ «'+esc(names[wi])+'» → «'+esc(names[wi+1])+'»';
    const bl=whBalances(wi);
    const avail=Object.keys(bl).filter(nm=>bl[nm].in-bl[nm].out>0).sort();
    let opts=avail.map(nm=>{
      const r=(store.raw||[]).find(x=>x.name===nm);
      const u=(bl[nm].unit||(r?r.unit:'')||'');
      return '<option data-unit="'+esc(u)+'">'+esc(nm)+' (ост. '+(+((bl[nm].in-bl[nm].out).toFixed(3)))+' '+esc(u)+')</option>';
    }).join('');
    if(opts.length){
      rows+=whField('Что перемещаем','<select id="whFSel">'+opts+'<option value="__other">— другое (вписать) —</option></select><input id="whFName" placeholder="название" style="display:none;margin-top:6px">');
    } else {
      rows+=whField('Что перемещаем (на складе пусто)','<input id="whFName" placeholder="название">');
    }
    rows+=whField('Вес, кг','<input id="whFQty" type="number" step="any" min="0" placeholder="0">');
    rows+=whField('Ед. изм.','<input id="whFUnit" placeholder="кг" value="кг">');
  } else return;
  const back=whModalForm(title,rows,'Сохранить');
  const sel=back.querySelector('#whFSel');
  if(sel){
    const nameInp=back.querySelector('#whFName');
    const unitInp=back.querySelector('#whFUnit');
    const sync=()=>{
      const other=sel.value==='__other';
      nameInp.style.display=other?'':'none';
      if(!other){
        const opt=sel.options[sel.selectedIndex];
        if(unitInp&&opt&&opt.getAttribute('data-unit'))unitInp.value=opt.getAttribute('data-unit');
      }
    };
    sel.addEventListener('change',sync);
    if(sel.options.length&&sel.options[0].getAttribute&&sel.options[0].getAttribute('data-unit')!==null)sync();
  }
  back.querySelector('[data-wok]').onclick=()=>{
    let name;
    const sel2=back.querySelector('#whFSel');
    if(sel2){
      if(sel2.value==='__other'){ name=whRead(back,'whFName'); }
      else { const opt=sel2.options[sel2.selectedIndex]; name=opt.getAttribute('data-unit')!==null?opt.textContent.replace(/\s*\(ост\..*\)$/,'').trim():opt.value; }
    } else {
      name=whRead(back,'whFName');
      if(act==='in'){ const alt=whRead(back,'whFNew'); if(alt)name=alt; }
    }
    if(!name){ alert('Укажите товар.'); return; }
    const q=String(whRead(back,'whFQty')).replace(',','.');
    if(!(+q>0)){ alert('Количество — число больше нуля.'); return; }
    const unit=preset.unit?whRead(back,'whFUnit'):'';
    const note=whRead(back,'whFNote');
    const priceStr=String(whRead(back,'whFPrice')).replace(',','.');
    const price=(+priceStr>0)?+priceStr:0;
    const rec={id:'m'+Date.now().toString(36),type:act,name:name,qty:+q,unit:unit,date:whToday(),t:(new Date()).toTimeString().slice(0,5),note:note};
    if(act==='in'){ rec.to=wi; if(price>0)rec.price=price; }
    else if(act==='out')rec.from=wi;
    else { rec.from=wi; rec.to=wi+1; }
    whMoves().push(rec);
    try{ saveStore(); }catch(e){}
    back.remove();
    whShow();
    if(act==='in'&&price>0){
      const r=(store.raw||[]).find(x=>x.name===name);
      if(r&&isFinite(r.price)&&Math.abs((+r.price)-price)>0.001){
        if(confirm('Цена «'+name+'» в справочнике «Сырьё» сейчас '+r.price+' ₽.\nОбновить на закупочную '+price+' ₽?\n\n(«Да» — себестоимость блюд пересчитается по новой цене)')){
          r.price=price;
          try{ saveStore(); }catch(e){}
        }
      }
    }
    return;
  };
}

function whInvPrintBlank(wi){
  const names=whNames();
  const bal=whBalances(wi);
  const keys=Object.keys(bal).sort();
  if(wi===0){ keys.length=0; (store.raw||[]).forEach(r=>{ if(!keys.includes(r.name))keys.push(r.name); }); keys.sort(); }
  let h='<h2>Инвентаризация — '+esc(names[wi])+'</h2><h3>Дата: '+whToday()+'</h3>'
    +'<table><tr><th style="width:34px">№</th><th>Товар</th><th style="width:70px">Ед.</th><th class="n" style="width:110px">По программе</th><th style="width:130px">По факту</th><th style="width:110px">Подпись</th></tr>';
  keys.forEach((nm,i)=>{
    const b=bal[nm]||{in:0,out:0,unit:''};
    const rest=+((b.in-b.out).toFixed(3));
    h+='<tr><td>'+(i+1)+'</td><td>'+esc(nm)+'</td><td>'+esc(b.unit||'')+'</td><td class="n">'+rest+'</td><td></td><td></td></tr>';
  });
  h+='</table><div class="sig"><div>Пересчитал: ____________</div><div>Проверил: ____________</div></div>';
  whPrintHtml('Инвентаризация — '+names[wi],h);
}
function whInventory(wi){
  const names=whNames();
  const bal=whBalances(wi);
  const keys=Object.keys(bal).sort();
  if(!keys.length){ alert('На складе пока нет товаров — инвентаризировать нечего.'); return; }
  let rows='<div style="max-height:60vh;overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr>'
    +'<th style="text-align:left;padding:5px;border-bottom:2px solid var(--line)">Товар</th>'
    +'<th style="text-align:center;padding:5px;border-bottom:2px solid var(--line)">Ед.</th>'
    +'<th style="text-align:right;padding:5px;border-bottom:2px solid var(--line)">По программе</th>'
    +'<th style="text-align:center;padding:5px;border-bottom:2px solid var(--line)">По факту</th>'
    +'<th style="text-align:right;padding:5px;border-bottom:2px solid var(--line)">Расхождение</th>'
    +'</tr></thead><tbody>';
  keys.forEach((nm,i)=>{
    const b=bal[nm];
    const rest=+((b.in-b.out).toFixed(3));
    rows+='<tr><td style="padding:5px;border-bottom:1px solid var(--line)">'+esc(nm)+'</td>'
      +'<td style="padding:5px;border-bottom:1px solid var(--line);text-align:center">'+esc(b.unit||'—')+'</td>'
      +'<td style="padding:5px;border-bottom:1px solid var(--line);text-align:right">'+rest+'</td>'
      +'<td style="padding:5px;border-bottom:1px solid var(--line);text-align:center"><input type="number" step="any" min="0" data-whi="'+i+'" style="width:90px" placeholder="—"></td>'
      +'<td style="padding:5px;border-bottom:1px solid var(--line);text-align:right;font-weight:700" id="whDiff'+i+'">—</td></tr>';
  });
  rows+='</tbody></table></div>';
  const back=whModalForm('📋 Инвентаризация — «'+esc(names[wi])+'»',rows,'Сохранить');
  back.querySelector('[data-wok]').textContent='Проверить и записать';
  const inputs=[...back.querySelectorAll('input[data-whi]')];
  const calc=()=>{
    const diffs=[];
    inputs.forEach(inp=>{
      const i=+inp.getAttribute('data-whi');
      const nm=keys[i];
      const b=bal[nm];
      const rest=+((b.in-b.out).toFixed(3));
      const cell=back.querySelector('#whDiff'+i);
      if(inp.value===''){ cell.textContent='—'; diffs.push(null); return; }
      const v=+String(inp.value).replace(',','.');
      if(!isFinite(v)){ diffs.push(null); cell.textContent='?'; return; }
      const d=+(v-rest).toFixed(3);
      diffs.push(d);
      cell.textContent=(d>0?'+':'')+d;
      cell.style.color=d===0?'inherit':(d>0?'var(--ok)':'var(--danger)');
    });
    return diffs;
  };
  inputs.forEach(inp=>inp.addEventListener('input',calc));
  back.querySelector('[data-wcancel]').onclick=()=>back.remove();
  back.querySelector('[data-wok]').onclick=()=>{
    const diffs=calc();
    const list=[];
    diffs.forEach((d,i)=>{ if(d!==null&&d!==0)list.push({name:keys[i],d:d,b:bal[keys[i]]}); });
    if(!list.length){
      if(!confirm('Расхождений нет (или не введено ни одного факта).\nПометить склад проверенным (записать дату инвентаризации)?'))return;
      store.whInvLast=store.whInvLast||{}; store.whInvLast[wi]=whToday();
      try{ saveStore(); }catch(e){}
      back.remove(); whShow(); return;
    }
    let s='Найдены расхождения:\n\n';
    list.forEach(x=>{ s+=x.name+': '+(x.d>0?'+':'')+x.d+' '+(x.b.unit||'')+'\n'; });
    s+='\nПо каждой позиции запишется корректировка, остаток станет равен факту.\n\nЗаписать?';
    if(!confirm(s))return;
    list.forEach(x=>{
      const rec={id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),type:'adjust',name:x.name,qty:Math.abs(x.d),unit:x.b.unit||'',date:whToday(),t:(new Date()).toTimeString().slice(0,5),note:'инвентаризация'};
      if(x.d>=0)rec.to=wi; else rec.from=wi;
      whMoves().push(rec);
    });
    store.whInvLast=store.whInvLast||{}; store.whInvLast[wi]=whToday();
    let actRows='';let tot=0;
    list.forEach(x=>{
      const avg=(x.b.in>0)?(x.b.cost/x.b.in):0;
      const c=Math.abs(x.d)*avg; tot+=c;
      const fact=+((x.b.in-x.b.out+x.d).toFixed(3));
      actRows+='<tr><td>'+esc(x.name)+'</td><td>'+esc(x.b.unit||'')+'</td><td class="n">'+(+((x.b.in-x.b.out).toFixed(3)))+'</td><td class="n">'+fact+'</td><td class="n">'+(x.d>0?'+':'')+x.d+'</td><td class="n">'+(+c.toFixed(2))+'</td></tr>';
    });
    actRows+='<tr><th colspan="5" style="text-align:right">Итого стоимость расхождений</th><th class="n">Итого: '+(+tot.toFixed(2))+' ₽</th></tr>';
    store.whInvLastAct=store.whInvLastAct||{}; store.whInvLastAct[wi]={date:whToday(),rows:actRows};
    try{ saveStore(); }catch(e){}
    back.remove();
    whShow();
    alert('Инвентаризация записана: '+list.length+' поз. Корректировки в журнале, остатки приведены к факту.\n\nАкт можно распечатать кнопкой «🖨 Акт последней инвентаризации».');
  };
  back.insertAdjacentHTML('beforeend','<div style="margin-top:10px"><button class="btn" data-wblank style="width:100%">🖨 Печать бланка для пересчёта</button></div>');
  back.querySelector('[data-wblank]').onclick=()=>whInvPrintBlank(wi);
}
function whProd(wi){
  if(wi!==0){ alert('Производство запускается со склада сырья.'); return; }
  const prods=(store.products||[]).filter(p=>p.items&&p.items.length);
  if(!prods.length){ alert('В программе нет рецептов с составом.\nЗаведите рецепты во вкладке «Рецепты» (сырьё + сколько на 1 ед.), и производство посчитается само.'); return; }
  const names=whNames();
  const rows=whField('Продукт','<select id="whPProd">'+prods.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('')+'</select>')
    +whField('Сколько произвели (вес, кг)','<input id="whPQty" type="number" step="any" min="0" placeholder="напр. 85">')
    +whField('Примечание (смена, бригада…)','<input id="whPNote" placeholder="можно пусто">');
  const back=whModalForm('🏭 Производство: '+esc(names[0])+' → '+esc(names[1]),rows,'Рассчитать');
  back.querySelector('[data-wok]').onclick=()=>{
    const pid=whRead(back,'whPProd');
    const p=prods.find(x=>x.id===pid);
    if(!p){ alert('Выберите продукт.'); return; }
    const W=+String(whRead(back,'whPQty')).replace(',','.');
    if(!(W>0)){ alert('Вес готового — число больше нуля.'); return; }
    const note=whRead(back,'whPNote');
    const lines=[];
    let totalCost=0;
    p.items.forEach(c=>{
      const r=(store.raw||[]).find(x=>x.id===c.rid);
      if(!r)return;
      const need=(+c.qty||0)*W/(rawNetPct(c.rid)/100);
      const cost=need*rawNetPrice(c.rid);
      totalCost+=cost;
      lines.push({r:r,need:need,cost:cost});
    });
    if(!lines.length){ alert('В рецепте нет подходящего сырья.'); return; }
    let s='Продукт: '+p.name+' — '+W+' '+(p.unit||'кг')+'\n\nСо склада «'+names[0]+'» спишется (с учётом нетто-потерь):\n';
    let short=[];
    lines.forEach(l=>{
      const rest=(whBalances(0)[l.r.name]||{in:0,out:0});
      const have=rest.in-rest.out;
      s+='• '+l.r.name+': −'+(+l.need.toFixed(3))+' '+esc(l.r.unit||'')+' (на складе '+ +have.toFixed(3)+')\n';
      if(have<l.need)short.push(l.r.name);
    });
    s+='\nНа склад «'+names[1]+'» придёт: '+p.name+' — '+W+' '+(p.unit||'кг')+'\nСебестоимость партии: '+(+totalCost.toFixed(2))+' ₽ ('+(+((totalCost/W).toFixed(2)))+' ₽/кг)\n';
    if(short.length)s+='\n⚠ На складе сырья не хватает: '+short.join(', ')+' — остаток уйдёт в минус.\n';
    s+='\nЗаписать?';
    if(!confirm(s))return;
    const t=(new Date()).toTimeString().slice(0,5);
    lines.forEach(l=>{
      whMoves().push({id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),type:'out',from:0,name:l.r.name,qty:+l.need.toFixed(3),unit:l.r.unit||'',date:whToday(),t:t,note:'производство: '+p.name+(note?' ('+note+')':'')});
    });
    whMoves().push({id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),type:'in',to:1,name:p.name,qty:W,unit:p.unit||'кг',date:whToday(),t:t,price:+(totalCost/W).toFixed(4),note:'производство'+(note?' ('+note+')':'')});
    try{ saveStore(); }catch(e){}
    back.remove();
    whShow();
  };
}

function whNaklAggr(date){
  const rows=(typeof shipPlans!=='undefined'&&(shipPlans[date]||[]))||[];
  const m={};
  rows.forEach(r=>{
    const d=r.data||{};
    Object.keys(d).forEach(gid=>{
      const q=+d[gid]||0;
      if(!(q>0))return;
      const g=(store.shipGoods||[]).find(x=>x.id===gid);
      const nm=g?g.name:('товар '+gid);
      if(!m[nm])m[nm]={nm:nm,qty:0,grams:(g&&+g.grams>0)?+g.grams:((typeof shNaklGramsOf==='function')?(+shNaklGramsOf(gid)||0):0),shops:[]};
      m[nm].qty+=q;
      if(r.shop&&m[nm].shops.indexOf(r.shop)<0)m[nm].shops.push(r.shop);
    });
  });
  return Object.keys(m).map(k=>m[k]);
}

let whJ={from:'',to:'',type:'',wh:'',q:''};
let whW1={q:'',grp:'',sort:{key:'name',dir:1}};
function whW1SortEntries(arr){
  const s=whW1.sort||{key:'name',dir:1};
  const val=e=>{
    if(s.key==='name')return String(e.nm).toLowerCase();
    if(s.key==='grp')return String(e.grp||'').toLowerCase();
    const b=e.b;
    if(s.key==='in')return b.in;
    if(s.key==='out')return b.out;
    return b.in-b.out;
  };
  return arr.slice().sort((a,b2)=>{
    const va=val(a),vb=val(b2);
    if(typeof va==='string'||typeof vb==='string')return String(va).localeCompare(String(vb),'ru')*s.dir;
    return (va-vb)*s.dir;
  });
}
function whJDirName(mv){
  const names=whNames();
  if(mv.type==='in')return '➕ приход → '+esc(names[mv.to]||'?');
  if(mv.type==='out')return '➖ списание ← '+esc(names[mv.from]||'?');
  if(mv.type==='adjust')return '📋 корректировка: '+esc(names[(mv.to!==undefined&&mv.to!==null)?mv.to:mv.from]||'?');
  return '⇄ '+esc(names[mv.from]||'?')+' → '+esc(names[mv.to]||'?');
}
function whJFiltered(){
  return whMoves().slice().reverse().filter(mv=>{
    if(whJ.type&&mv.type!==whJ.type)return false;
    if(whJ.wh!==''&&mv.from!==+whJ.wh&&mv.to!==+whJ.wh)return false;
    if(whJ.from&&(!mv.date||mv.date<whJ.from))return false;
    if(whJ.to&&(!mv.date||mv.date>whJ.to))return false;
    if(whJ.q&&!(mv.name+' '+(mv.note||'')).toLowerCase().includes(whJ.q.toLowerCase()))return false;
    return true;
  });
}

})();
/* ==== ПОИСК В ЛЮБОМ СПИСКЕ: начинаешь печатать в поле — варианты фильтруются ==== */
(function(){
  try{ if(typeof document==="undefined"||!document||!document.createElement)return; }catch(e){ return; }
  function escTA(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function mk(sel){
    try{
      if(!sel||sel.__shTA)return;
      if(sel.multiple||(sel.size&&sel.size>1))return;
      if(sel.getAttribute&&sel.getAttribute("data-nota")!=null)return;
      if(sel.hidden||(sel.style&&sel.style.display==="none"))return;
      var opts=sel.options; if(!opts||opts.length<2)return;
      var par=sel.parentNode; if(!par||!par.insertBefore)return;
      var inp=document.createElement("input");
      inp.type="text"; inp.className=(sel.className?sel.className+" ":"")+"sh-ta-inp";
      inp.setAttribute("autocomplete","off");
      inp.style.cssText="width:100%;box-sizing:border-box;";
      sel.__shTA=inp; sel.style.display="none"; par.insertBefore(inp,sel);
      var drop=null;
      function sync(){ var o=sel.options[sel.selectedIndex]; inp.value=o?(o.text||o.textContent||""):""; }
      function close(){ if(drop&&drop.parentNode)drop.parentNode.removeChild(drop); drop=null; }
      function pick(i){ if(i<0||i>=sel.options.length)return; sel.selectedIndex=i; try{ sel.dispatchEvent(new Event("change",{bubbles:true})); }catch(e){ if(sel.onchange){ try{ sel.onchange(); }catch(e2){} } } sync(); close(); }
      function find(q){ q=String(q||"").toLowerCase().trim(); if(!q)return -1; for(var i=0;i<sel.options.length;i++){ var o=sel.options[i]; if(o&&String(o.text||o.textContent||"").toLowerCase().indexOf(q)>=0)return i; } return -1; }
      function open(q){
        close();
        var r=inp.getBoundingClientRect();
        var qq=String(q||"").toLowerCase().trim();
        var html="", n=0;
        for(var i=0;i<sel.options.length;i++){
          var o=sel.options[i]; if(!o)continue;
          var t=o.text||o.textContent||"";
          if(qq&&t.toLowerCase().indexOf(qq)<0)continue;
          html+='<div class="sh-ta-row" data-i="'+i+'">'+escTA(t)+"</div>";
          if(++n>=60)break;
        }
        if(!html)html='<div class="sh-ta-empty">Ничего не найдено</div>';
        drop=document.createElement("div"); drop.className="sh-ta-drop"; drop.innerHTML=html;
        drop.style.position="fixed"; drop.style.left=r.left+"px"; drop.style.top=(r.bottom+2)+"px";
        drop.style.width=Math.max(170,r.width)+"px"; drop.style.zIndex="9999";
        (document.body||document.documentElement).appendChild(drop);
        var rows=drop.querySelectorAll?drop.querySelectorAll(".sh-ta-row"):[];
        for(var k=0;k<rows.length;k++){ (function(row){
          row.onmousedown=function(ev){ if(ev&&ev.preventDefault)ev.preventDefault(); };
          row.onclick=function(){ pick(parseInt(row.getAttribute("data-i"),10)); };
        })(rows[k]); }
      }
      inp.onfocus=function(){ sync(); open(""); };
      inp.oninput=function(){ open(inp.value); };
      inp.onblur=function(){ setTimeout(close,180); };
      inp.onkeydown=function(ev){
        ev=ev||window.event||{}; var k=ev.key||ev.keyCode;
        if(k==="Enter"||k===13){ var i=find(inp.value); if(i>=0)pick(i); else close(); if(ev.preventDefault)ev.preventDefault(); }
        else if(k==="Escape"||k===27){ sync(); close(); if(ev.stopPropagation)ev.stopPropagation(); }
        else if((k==="ArrowDown"||k===40)&&drop){ var r0=drop.querySelector&&drop.querySelector(".sh-ta-row"); if(r0&&r0.click){ r0.click(); } if(ev.preventDefault)ev.preventDefault(); }
      };
      sync();
    }catch(e){}
  }
  function all(root){
    if(!root)return;
    try{
      if(root.tagName&&String(root.tagName).toLowerCase()==="select")mk(root);
      var list=root.querySelectorAll?root.querySelectorAll("select"):[];
      for(var i=0;i<list.length;i++)mk(list[i]);
    }catch(e){}
  }
  try{
    setTimeout(function(){ try{ all(document.body||document); }catch(e){} },0);
    setTimeout(function(){ try{ all(document.body||document); }catch(e){} },600);
    if(typeof MutationObserver!=="undefined"&&document.body){
      var mo=new MutationObserver(function(muts){
        for(var i=0;i<muts.length;i++){ var a=muts[i].addedNodes||[]; for(var j=0;j<a.length;j++)all(a[j]); }

})();
</script>

<script>
/* ==== ВЫДЕЛЕНИЕ СТРОК #invoicesTable (Excel) ==== */
(function(){
  "use strict";
  var TBL="#invoicesTable", ANCHOR="";
  function table(){return document.querySelector(TBL);}
  function rows(t){return Array.prototype.slice.call(t.querySelectorAll("tbody tr[data-key]"));}
  function state(){
    if(typeof window.__shNaklSelState==="function"){try{var s=window.__shNaklSelState();if(s&&typeof s==="object")return s;}catch(e){}}
    if(!window.shNaklSel||typeof window.shNaklSel!=="object")window.shNaklSel={};
    return window.shNaklSel;
  }
  function hasSelHook(){return typeof window.__shNaklApplySel==="function";}
  // единая точка применения: класс .table-row-selected + чекбокс первой колонки
  function sync(t){
    if(hasSelHook()){try{window.__shNaklApplySel();return;}catch(e){}}
    var s=state(),rs=rows(t);
    for(var i=0;i<rs.length;i++){
      var on=!!s[rs[i].getAttribute("data-key")];
      rs[i].classList.toggle("table-row-selected",on);
      var ck=rs[i].querySelector(".sh-nakl-chk")||rs[i].querySelector("input[type=checkbox]");
      if(ck)ck.checked=on;
    }
    var all=t.querySelector("thead input[type=checkbox]");
    if(all&&rs.length)all.checked=rs.every(function(tr){return tr.classList.contains("table-row-selected");});
  }
  function mark(){if(hasSelHook())window.__naklSelHandled=true;}
  function aGet(){ try{ if(typeof window.__shNaklAnchorGet==="function")return window.__shNaklAnchorGet()||""; }catch(e){} return ANCHOR; }
  function aSet(k){ ANCHOR=k||""; try{ if(typeof window.__shNaklAnchorSet==="function")window.__shNaklAnchorSet(ANCHOR); }catch(e){} }
  document.addEventListener("click",function(ev){
    var t=table(); if(!t)return;
    var tgt=ev.target&&ev.target.closest?ev.target:null; if(!tgt)return;
    var tr=tgt.closest("tbody tr[data-key]"); if(!tr||!t.contains(tr))return;
    var s=state(),rs=rows(t),k=tr.getAttribute("data-key"),i=rs.indexOf(tr);
    if(i<0)return;
    var box=tgt.tagName==="INPUT"?tgt:(tgt.closest("input[type=checkbox]")||null);
    // клик по чекбоксу строки — переключает выделение этой строки
    if(box){ if(box.closest("thead"))return;
      // чекбокс строки обрабатывает сам журнал (onchange -> shNaklSel -> applySel).
      // Только гасим штатную обработку строки, иначе клик по чекбоксу ещё и выделит строку.
      mark(); return; }
    if(tgt.closest("button"))return;
    mark();
    // клик по ЛЮБОМУ месту ячейки с чекбоксом — переключает строку (как Ctrl), остальные НЕ снимаются
    if(tgt.closest("td.sh-nakl-chkcell")){
      if(s[k])delete s[k];else s[k]=true; aSet(k); sync(t); return;
    }
    // Shift — диапазон от последнего клика
    if(ev.shiftKey){
      var a=-1;
      for(var q=0;q<rs.length;q++)if(rs[q].getAttribute("data-key")===aGet()){a=q;break;}
      if(a<0){aSet(k);sync(t);return;}
      var lo=a<i?a:i, hi=a<i?i:a;
      for(var j=lo;j<=hi;j++)s[rs[j].getAttribute("data-key")]=true;
      sync(t); return;
    }
    // Ctrl/Cmd — добавить/убрать из выделения
    if(ev.ctrlKey||ev.metaKey){
      if(s[k])delete s[k];else s[k]=true; aSet(k); sync(t); return;
    }
    // одиночный клик — выделяет только эту строку
    var ks=Object.keys(s); for(var m=0;m<ks.length;m++)delete s[ks[m]];
    s[k]=true; aSet(k); sync(t);
  },true);
})();
/* ==== /ВЫДЕЛЕНИЕ СТРОК #invoicesTable ==== */
</script>
