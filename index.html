}
function shXlsxDateFromHeader(txt){
  const m=/(\d{1,2})[.,\-](\d{1,2})[.,\-](\d{2,4})/.exec(String(txt||''));
  if(!m) return '';
  let dd=+m[1], mm=+m[2], yy=+m[3];
  if(yy<100) yy=(yy>70)?1900+yy:2000+yy;
  if(!(dd>=1&&dd<=31&&mm>=1&&mm<=12)) return '';
  return yy+'-'+(mm<10?'0':'')+mm+'-'+(dd<10?'0':'')+dd;

/* Дата в самой шапке списка («29,09,26» или «29.09»): только чистая дата, адрес сюда не попадёт. */
function shXlsxDateFromHeadCell(head,yearRef){
  const row=head||[];

function shXlsxLegalFromHeader(txt){

function shXlsxOrderHead(o){

    });
    const k=addr?shAddrKey(addr):'';
    if(k&&!info.byAddr[k]) info.byAddr[k]={date:d,legal:lg,addr:addr,goods:goods,name:s.name};
  });
  info.headCols=headCols;
  return info;
}
async function shXlsxReadBook(file){
  const buf=await file.arrayBuffer();
  const z=await _xlsxUnzip(buf);
  const ss=shXlsxShared(z);
  const list=shXlsxSheetList(z);
  const sheets=list.map(s=>({name:s.name,path:s.path,bytes:z[s.path],ss:ss}));
  const sum=shXlsxFindSummary(sheets,12);
  if(!sum) throw new Error('Лист со списком магазинов не найден: нужен лист с адресами и колонками 90 г / 200 г.');
  const srows=_xlsxGrid(sum.bytes,ss);
  const headRow=(sum.row!=null?sum.row:0);
  const head=(srows[headRow]&&srows[headRow].cells)||[];
  const cols=shXlsxCols(head);
  if(cols.addr<0) throw new Error('В шапке не нашёл адрес: нужна колонка «Адрес» либо список без подписей (дата, адрес, 90 г, 200 г).');
  if(cols.q90<0&&cols.q200<0) throw new Error('В шапке не нашёл колонки 90 г / 200 г.');
  const dataRows=srows.filter(r=>r.n-1>headRow);
  const ord=shXlsxOrderHead({sheets:sheets});
  return {
    fileName:(file&&file.name)||'книга.xlsx',
    sheet:sum.name, cols:cols, rows:dataRows, orders:ord,
    date:(()=>{ const ks=Object.keys(ord.dates); const nd=shXlsxDateFromName((file&&file.name)||''); if(ks.length===1)return ks[0]; return nd||shXlsxDateFromHeadCell(head,nd); })(),
    dates:ord.dates, legals:ord.legals
  };
}
function shXlsxRowAddr(raw){
  const a=String(raw==null?'':raw).replace(/\s+/g,' ').trim();
  let parts=a.split(/[,;]/).map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean);
  let id='';
  if(parts.length&&/^\d{4,8}$/.test(parts[0])){ id=parts[0]; parts.shift(); }
  const cut=parts.findIndex(p=>/^калининградская\s+(область|обл)\.?$/i.test(p));
  if(cut>=0) parts.splice(cut,1);
  let city='';
  if(parts.length&&/^(г\.|г |го |город|п\.|пос\.|с\.|с |село|снт|д\.|деревня)\s*/i.test(parts[0])){
    city=parts.shift().replace(/\s+/g,'');
  }
  if(parts.length) parts[0]=parts[0].replace(/^[.\s]+/,'');
  return {id:id,raw:a,rest:parts.join(', '),city:city,parts:parts};
}
const SH_XLSX_TAIL_JUNK=/^(к\.?\d*|кв\.?\d*|квартира|пом\.?\d*|помещ\.?\d*|чз\d*|чп\d*|п\.\d+|подъезд|эт\.?\d*|этаж|офис|стр\.?\d*|корп\.?\d*|зд\.?)$/i;
const SH_XLSX_MARK=/\s*(ч\s*[.\/]?\s*[зп])\s*[.\dIVXA-Zа-яa-я]*$/i;
const SH_XLSX_HOUSE=/^(з|зд|д|дом)\.?\s*\d|^\d+[а-яa-z]?(\s*[-–]\s*\d+[а-яa-z]?)?$/i;
function shXlsxCleanPart(p){
  let s=String(p==null?'':p).replace(/\s+/g,' ').trim();
  let prev=null;
  while(prev!==s){ prev=s; s=s.replace(SH_XLSX_MARK,'').trim(); }
  s=s.replace(/^[.\s]+/,'').replace(/[.\s]+$/,'');
  return s;
}
function shXlsxShopName(raw){
  const pa=shXlsxRowAddr(raw);
  const parts=pa.parts.map(shXlsxCleanPart).filter(p=>p&&!SH_XLSX_TAIL_JUNK.test(p));
  if(!parts.length) return pa.rest||pa.raw;
  let houseAt=-1;
  for(let i=0;i<parts.length;i++){ if(SH_XLSX_HOUSE.test(parts[i])){ houseAt=i; break; } }
  if(houseAt<0) return parts.join(' ');
  const street=parts.slice(0,houseAt).join(' ').replace(/\s+(ул|улица|пр-?кт|проспект|пер|переулок|наб|набережная|б-р|шоссе|аллея|линия|кольцовая)\.?$/i,' $1').replace(/\s+/g,' ').trim();
  const h=parts[houseAt].replace(/^(дом|зд|з|д)\.?\s*/i,'').trim();
  return (street?street+' ':'')+h;
}



/* ==== ИМПОРТ ИЗ EXCEL: модель строк для предпросмотра (П16) ==== */
/* Совпадение только по номеру дома (28, 16, 1) — это НЕ тот же магазин.
   Поэтому для подсказки требуем ещё совпадение улицы/названия. */
function shImpStreetHit(fileAddr,shop){
  if(!shop) return false;
  const f=shAddrNorm(fileAddr);
  if(!f.streetKey) return false;
  const a=shAddrNorm(shop.addr||'');
  const b=shAddrNorm(shop.name||'');
  const street=a.streetKey||b.streetKey;                /* адрес магазина, иначе название */
  return !!street&&f.streetKey===street;
}
function shImpMatchKind(fileAddr,shop){
  const sc=shMatchScore(fileAddr,shop);
  if(sc<2) return 'нет';
  if(!shImpStreetHit(fileAddr,shop)) return 'нет';
  return shMatchKind(sc);
}
function shImpBestShop(fileAddr){
  const shops=store.shipShops||[];
  let best=null,bs=0,bk='нет';
  for(let i=0;i<shops.length;i++){
    const sc=shMatchScore(fileAddr,shops[i]);
    if(sc<=bs) continue;
    const k=shImpMatchKind(fileAddr,shops[i]);
    if(k==='нет') continue;
    best=shops[i]; bs=sc; bk=k;
  }
  return {shop:best,score:bs,kind:bk};
}
function shImpDominantLegal(bk){
  const nm=bk.legals||{};
  let top='',n=0;
  for(const k in nm){ if(nm[k]>n){ top=k; n=nm[k]; } }
  return top;
}
function shImpLegalByName(name){
  const ls=shLegals();
  for(let i=0;i<ls.length;i++) if(ls[i].name===name) return ls[i].id;
  return '';
}
function shXlsxBuildRows(bk){
  const def=((store.shipSettings||{}).importLegalId)||'';
  const dom=shImpLegalByName(shImpDominantLegal(bk));
  const seen={},seenNo={};
  const out=[];
  const c90=bk.cols.q90, c200=bk.cols.q200;
  for(let i=0;i<bk.rows.length;i++){
    const row=bk.rows[i];
    let addr='';
    if(bk.cols.addr>=0){
      const to=(bk.cols.addrTo!=null&&bk.cols.addrTo>=bk.cols.addr)?bk.cols.addrTo:bk.cols.addr;
      for(let ci=bk.cols.addr;ci<=to;ci++){ const v=String(row.cells[ci]==null?'':row.cells[ci]).replace(/\s+/g,' ').trim(); if(v) addr+=(addr?', ':'')+v; }
    }
    addr=addr.replace(/\s+/g,' ').trim();
    const q90=bk.cols.q90>=0?shXlsxNum(row.cells[bk.cols.q90]):0;
    const q200=bk.cols.q200>=0?shXlsxNum(row.cells[bk.cols.q200]):0;
    const junk=shXlsxJunk(addr,q90,q200);
    const key=shAddrKey(addr);
    const ord=bk.orders.byAddr[key]||null;
    const o90=ord?ord.goods.filter(g=>g.g===90)[0]:null;
    const o200=ord?ord.goods.filter(g=>g.g===200)[0]:null;
    const first=!seen[key];
    const dupOf=first?'':(seenNo[key]||'');
    seen[key]=true;
    if(first) seenNo[key]=String(row.cells[0]==null?'':row.cells[0]).trim()||String(i+1);
    const b=shImpBestShop(addr);
    const legalId=shLegalAddrOf(addr)||def||(ord?shImpLegalByName(ord.legal):'')||dom;
    const p90=(o90&&o90.price>0)?o90.price:null;
    const p200=(o200&&o200.price>0)?o200.price:null;
    out.push({
      i:out.length,
      no:String(row.cells[0]==null?'':row.cells[0]).trim(),
      raw:addr, key:key, junk:junk,
      name:(first?shXlsxShopName(addr):''),
      q90:q90, q200:q200,
      boxes90:(o90?o90.boxes:0), boxes200:(o200?o200.boxes:0),
      price90:p90, price200:p200,
      legalId:legalId,
      date:(ord&&ord.date)?ord.date:(bk.date||''),
      sheet:(ord?ord.name:''),
      orderNo:(ord?ord.no:''),
      dup:!first, dupOf:dupOf,
      kind:b.kind, shopId:(b.shop?b.shop.id:''),
      sel:!junk&&first
    });
  }
  /* дубль получает имя первого вхождения — иначе предпросмотр покажет два разных магазина */
  const byKey={};
  out.forEach(r=>{ if(!r.junk&&!r.name&&byKey[r.key]) r.name=byKey[r.key]; if(!r.junk&&r.name) byKey[r.key]=byKey[r.key]||r.name; });
  return out;
}
/* Приоритет цены: накладная (из файла) → контрагент → товар (зашитые цены). */
function shImpRowPrice(r,which){
  const v=which===90?r.price90:r.price200;
  if(v!=null&&v>0) return v;
  const g=which===90?shG90():shG200();
  if(!g) return 0;
  return shPriceFor(r.legalId,g.id);
}
function shImpRowSum(r){
  return (r.q90||0)*shImpRowPrice(r,90)+(r.q200||0)*shImpRowPrice(r,200);
}
function shImpSelected(rows){ return (rows||[]).filter(r=>r.sel&&!r.junk&&!r.dup); }   /* П42: дубль не импортируется */
/* Новые магазины считаем по УНИКАЛЬНЫМ адресам: две строки одного адреса — один магазин.
   file* — итоги по ВСЕМ годным строкам файла (как в «итого» книги), независимо от галочек. */
function shImpTotal(rows){
  const all=(rows||[]).filter(r=>!r.junk);
  const sel=shImpSelected(rows);
  const uniq={},newKeys={};
  all.forEach(r=>{ const k=r.key||('i'+r.i); uniq[k]=1; if(!r.shopId) newKeys[k]=1; });
  return {
    rows:sel.length, uniq:Object.keys(uniq).length,
    q90:sel.reduce((a,r)=>a+(r.q90||0),0),
    q200:sel.reduce((a,r)=>a+(r.q200||0),0),
    sum:sel.reduce((a,r)=>a+shImpRowSum(r),0),
    fileRows:all.length,
    fileQ90:all.reduce((a,r)=>a+(r.q90||0),0),
    fileQ200:all.reduce((a,r)=>a+(r.q200||0),0),
    fileSum:all.reduce((a,r)=>a+shImpRowSum(r),0),
    dup:all.filter(r=>r.dup).length,
    junk:(rows||[]).filter(r=>r.junk).length,
    newShops:Object.keys(newKeys).length,
    newRows:sel.filter(r=>!r.shopId).length
  };
}

      if(r.shopId){ const s=(shShops()||[]).find(x=>x.id===r.shopId); if(s) r.kind='вручную'; }
      else { r.kind='нет'; const b=shImpBestShop(r.raw); r.kind=(b.kind==='нет')?'новый':b.kind; }
      shImpRenderTable(); shImpRefreshTotals();
    };
  });
  shImpBox.querySelectorAll('.sh-imp-name').forEach(inp=>{
    inp.onchange=()=>{ const r=shImpRows[+inp.getAttribute('data-i')]; if(r) r.name=inp.value.trim(); shImpRenderTable(); };
  });

    sel.onchange=()=>{ const r=shImpRows[+sel.getAttribute('data-i')]; if(r) r.legalId=sel.value; shImpRefreshTotals(); };
  });
  const num=(cls,key,isPrice)=>{
    shImpBox.querySelectorAll(cls).forEach(inp=>{
      inp.onchange=()=>{
        const r=shImpRows[+inp.getAttribute('data-i')]; if(!r)return;
        const v=inp.value.replace(',','.').trim();
        const n=parseFloat(v);
        if(isPrice){ r[key]=(v===''||!isFinite(n)||n<0)?null:Math.round(n*100)/100; }
        else r[key]=(isFinite(n)&&n>0)?n:0;
        shImpRenderTable(); shImpRefreshTotals();
      };
    });
  };
  num('.sh-imp-q90','q90',false);
  num('.sh-imp-q200','q200',false);
  num('.sh-imp-p90','price90',true);
  num('.sh-imp-p200','price200',true);
  shImpBox.querySelectorAll('.sh-imp-pin').forEach(ck=>{
    ck.onchange=()=>{ const r=shImpRows[+ck.getAttribute('data-i')]; if(r) r.pin=ck.checked; };

    b.onclick=(ev)=>{ if(ev&&ev.stopPropagation) ev.stopPropagation(); shImpJumpTo(b.getAttribute('data-jump')); };
  });
  const all=shImpQ('#shImpChkAll');
  if(all) all.checked=list.length>0&&list.every(r=>r.sel);
}

/* ---- ПРИМЕНЕНИЕ: магазины, накладные, план, цены ---- */
function shImpCheckRows(sel,date){
  const errs=[];
  shEnsureLavashGoods();
  if(!shG90()||!shG200()) errs.push('Нет товаров 90 г / 200 г — заведи их в «Сырьё» или настрой список.');
  const seenShop={};
  sel.forEach(r=>{
    if(!r.shopId){
      if(!r.name) errs.push('Строка №'+(r.no||r.i)+': у нового магазина пустое название.');
      const k=r.key||('i'+r.i);
      const other=sel.find(x=>x!==r&&(x.key||('i'+x.i))===k&&!x.shopId);
      if(other&&r.name&&other.name&&r.name!==other.name) errs.push('Строки №'+(r.no||r.i)+' и №'+(other.no||other.i)+': одноадресные магазины названы по-разному («'+r.name+'» и «'+other.name+'») — придумай одно название.');
      if(seenShop[k]&&seenShop[k]!==r.name) errs.push('Дубли одного адреса с разными названиями.');
      seenShop[k]=r.name;
    }
    if(!(r.q90>0)&&!(r.q200>0)) errs.push('Строка №'+(r.no||r.i)+': нулевое количество.');
  });
  if(!sel.length) errs.push('Не отмечено ни одной строки.');
  if(!date) errs.push('Не указана дата отгрузки.');
  return errs;
}
function shImpApply(){
  if(!shImpBook||!shImpRows.length){ shImpMsg('Сначала выбери файл .xlsx',true); return; }
  const dEl=shImpQ('#shImpDate');
  const date=dEl?(dEl.value||''):'';
  const sel=shImpSelected(shImpRows);
  const errs=shImpCheckRows(sel,date);
  if(errs.length){ shImpMsg('⚠ '+errs.slice(0,6).join(' ')+(errs.length>6?' … и ещё '+(errs.length-6):''),true); return; }
  /* П47: диалог замены убран — импорт не затирает, а добавляет новые */
  const g90=shG90(), g200=shG200();
  if(!g90||!g200){ shImpMsg('⚠ Нет товаров 90 г / 200 г в справочнике — заведи их в «Настройках → Отгрузки».',true); return; }
  const n0=parseInt((store.shipSettings||{}).nextNaklNum,10)||1;
  const made=[],newShops=[],pinned=[],skippedExist=[];
  const existed=new Set();   /* П45: номера, которые уже были в реестре до импорта = обновлены */
  try{
    /* 1. магазины */
    const byKey={};
    sel.forEach(r=>{
      const k=r.key||('i'+r.i);
      if(!r.shopId){
        if(byKey[k]){ r.shopId=byKey[k]; return; }
        /* П44: дни недели НЕ назначаются — магазин не попадёт ни в один день
           до того, как пользователь назначит их в Отгрузки → Настройки → Расписание. */
        const s={id:'sh'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:r.name,addr:r.raw};
        if(r.legalId) s.legalId=r.legalId;   /* контрагент необязателен (П40) */
        store.shipShops.push(s);
        byKey[k]=s.id; r.shopId=s.id;
        newShops.push(s);
      }
    });
    saveStore();
    /* 2. план + накладные + цены (количества по магазину СУММИРУЮТСЯ: две строки одного
          адреса — одна накладная, иначе дубль затирал бы первый) */
    const now=new Date().toISOString();
    const acc={};
    sel.forEach(r=>{
      if(!acc[r.shopId]) acc[r.shopId]={r:r,data:{}};
      if(r.q90>0) acc[r.shopId].data[g90.id]=(acc[r.shopId].data[g90.id]||0)+r.q90;
      if(r.q200>0) acc[r.shopId].data[g200.id]=(acc[r.shopId].data[g200.id]||0)+r.q200;
    });
    const plan=[];
    Object.keys(acc).forEach(k=>{
      const r=acc[k].r, data=acc[k].data;
      const s=(store.shipShops||[]).find(x=>x.id===r.shopId);
      const shopName=s?s.name:r.name;
      /* П45: был ли номер ДО импорта — читаем реестр напрямую (без shNaklRegOf) */
      const _prev=(shNaklReg()||{})[shNaklKeyDate(date,r.shopId||shopName)]||null;
      if(_prev&&_prev.num){ existed.add(String(_prev.num)); skippedExist.push(shopName); return; }
      const reg=shEnsureNakl(date,r.shopId,shopName);
      reg.mod=now;
      reg.prices={g90:shImpRowPrice(r,90),g200:shImpRowPrice(r,200)};
      /* Юрлицо НАКЛАДНОЙ (может отличаться от юрлица магазина) — П23 */
      if(r.legalId) reg.legalId=r.legalId;
      made.push(reg.num);
      plan.push({shopId:r.shopId,shop:shopName,data:data,naklNum:reg.num});
      if(r.pin&&r.legalId) pinned.push([r.raw,r.legalId]);
    });
    /* П47: план сливаем с существующим (новые магазины добавляем, существующие не трогаем) */
    const _exPlan=(shipPlans&&shipPlans[date])||[];
    const _exIds={};
    _exPlan.forEach(r=>{_exIds[r.shopId]=r;});
    plan.forEach(r=>{ _exIds[r.shopId]=r; });
    shipPlans[date]=Object.keys(_exIds).map(k=>_exIds[k]);
    saveShip();
    saveStore();
    /* 3. особые адреса */
    pinned.forEach(p=>shSetLegalAddr(p[0],p[1]));
    if(pinned.length) saveStore();
  }catch(e){
    const done=made.length;
    store.shipSettings=store.shipSettings||{};
    store.shipSettings.nextNaklNum=n0+done;
    saveStore();
    alert('⚠ Импорт прерван: '+e.message+'\n\nУже создано накладных: '+done+(done?' (№ '+made.join(', ')+')':'')+'. Номера не потеряны — счётчик возвращён на '+done+'.');
    return;
  }
  const uniq=[...new Set(made)].sort((a,b)=>a-b);
  /* П45: отчёт — создано / обновлено / пропущено (мусор+дубли) / новые магазины / особые адреса */
  const total=shImpRows.length;   /* П45d: до shImpClose(), он обнуляет shImpRows */
  const skipped=shImpRows.filter(r=>r.junk||r.dup).length;
  const upd=uniq.filter(n=>existed.has(String(n))).length;
  const fresh=uniq.filter(n=>!existed.has(String(n))).length;   /* П45e: новых номеров */
  shImpClose();
  let msg='✅ Импорт готов — план на '+fmtDate(date)+' сохранён.'+'\n';
  if(uniq.length) msg+='Накладных в плане: '+uniq.length+' (№ '+uniq.join(', ')+').\n';
  if(fresh) msg+='Создано новых накладных: '+fresh+'.\n';
  if(skippedExist.length) msg+='Пропущено (уже есть накладная): '+skippedExist.length+'.\n';
  if(skipped) msg+='Пропущено (мусор/дубли): '+skipped+' из '+total+' строк файла.\n';
  if(newShops.length) msg+='Новых магазинов: '+newShops.length+(newShops.length?' — дни недели назначь в Отгрузки → Настройки → Расписание.':'');
  if(pinned.length) msg+='Особых адресов запомнено: '+pinned.length+'.';
  alert(msg);
  shipSub='nakl';
  renderShip();
}

function shEnterBy(id){ var x=document.getElementById(id); if(!x||x.disabled)return null; return shEnterShown(x)?x:null; }
function shEnterShown(el){
  if(!el||el.disabled)return false;
  try{ if(el.getClientRects&&el.getClientRects().length)return true; }catch(e){}
  try{ if(el.offsetWidth||el.offsetHeight||el.offsetParent)return true; }catch(e){}
  return false;
}
function shEnterIn(scope,id){ if(!scope||!scope.querySelector)return null; var x=scope.querySelector('#'+id); return (x&&!x.disabled&&shEnterShown(x))?x:null; }
function shEnterFields(scope){
  var out=[];
  if(!scope||!scope.querySelectorAll)return out;
  var all=Array.prototype.slice.call(scope.querySelectorAll('input,select'));
  for(var i=0;i<all.length;i++){
    var el=all[i], t=String(el.type||'').toLowerCase();

}
function shEnterFocusNext(el,scope){

}

function shEnterGeneric(scope){
  if(!scope||!scope.querySelectorAll)return null;
  var list=[];
  try{ list=Array.prototype.slice.call(scope.querySelectorAll('button,input[type="submit"],input[type="button"],[role="button"]')); }catch(e){}
  var good=/^(?:[^\wа-яё]*)(Сохранить|Добавить|Создать|Применить|Активировать|Сформировать|Рассчитать|Показать|Собрать|Импортировать|Исправить|Завершить|Подтвердить|Готово)/i;
  var bad=/файл|скачать|экспорт|печат|копир|отправ|подел|архив|удал|очист|сброс|отмен|закры|назад|выйти/i;
  var best=null, bestScore=-1;
  for(var i=0;i<list.length;i++){
    var b=list[i], t=String(b.textContent||b.value||'').replace(/\s+/g,' ').trim();
    if(!t||bad.test(t)||!good.test(t))continue;
    if(b.disabled||b.getAttribute('aria-disabled')==='true'||b.getAttribute('data-sh-off')!=null)continue;
    if(!shEnterShown(b))continue;
    var sc=10;
    if(/Сохранить/i.test(t))sc+=60;

    else if(/Рассчитать|Показать|Собрать/i.test(t))sc+=40;
    else sc+=20;

function shEnterPrimaryFor(el){
  var mapped=shEnterMapped(el);

  var modal=el.closest?el.closest('.modal'):null;
  if(modal){
    var mp=['naklFullSaveFact','naklFullSavePlan','naklClOk','naklFixOk','naklClLegalOk','naklClShopOk','naklFullGoodOk','naklFullLegalOk','naklFullShopOk','lSave','mSave','gSave','eSave','cSave'];
    for(var i=0;i<mp.length;i++){ var x=shEnterIn(modal,mp[i]); if(x)return x; }
    return shEnterGeneric(modal);
  }
  var pane=el.closest?el.closest('[id^="pane-"]'):null;
  if(pane){
    if(pane.id==='pane-calc'){ var c=shEnterBy('cSave'); if(c)return c; }

      var pp=['shSettingsSave','shSaveFact','shSavePlan','shSaveGoods','svBuild','shCalcForecast','shShowAnalytics'];
      for(var j=0;j<pp.length;j++){ var y=shEnterBy(pp[j]); if(y)return y; }

    var card=el.closest?el.closest('.card'):null;
    if(card){ var cg=shEnterGeneric(card); if(cg)return cg; }

function shEnterTrigger(tgt, el){
  if(!tgt||tgt===el)return false;
  var tag=String(tgt.tagName||'').toLowerCase();
  if(tag==='input'||tag==='select'||tag==='textarea'){
    try{ tgt.focus(); return true; }catch(e){ return false; }

function shInitEnterNav(){
  if(typeof document==='undefined'||!document.addEventListener)return;
  if(window.__shEnterNavBound)return;
  window.__shEnterNavBound=true;
  document.addEventListener('keydown',function(ev){
    if(ev.key!=='Enter'||ev.defaultPrevented||ev.isComposing||ev.repeat||ev.ctrlKey||ev.altKey||ev.metaKey)return;
    var el=ev.target;
    if(!el||el.nodeType!==1)return;
    var tag=String(el.tagName||'').toLowerCase();
    if(tag!=='input'&&tag!=='select')return;
    if(el.disabled||el.readOnly||el.isContentEditable)return;
    var id=String(el.id||''), idl=id.toLowerCase();
    if(id==='cName'||id==='licCode')return;
    if(idl.indexOf('search')>=0)return;
    if(el.classList&&el.classList.contains('sh-nakl-chk'))return;
    var type=String(el.type||'').toLowerCase();
    if(type==='hidden'||type==='checkbox'||type==='radio'||type==='button'||type==='submit'||type==='reset'||type==='file'||type==='color'||type==='range')return;
    if(id==='abTime'||id==='naklFrom'||id==='naklTo'){
      var n0=shEnterFocusNext(el,(el.closest?el.closest('.card'):null)||el.parentNode);
      if(n0)ev.preventDefault();
      return;
    }
    if(shEnterIsGrid(el)){
      var gs=shEnterGridScope(el);
      if(gs&&shEnterFocusNext(el,gs)){ ev.preventDefault(); return; }
    }
    var mapped=shEnterMapped(el);
    if(!mapped&&tag==='select'){
      var ns=shEnterFocusNext(el,el.parentNode);
      if(ns){ ev.preventDefault(); return; }
    }
    var tgt=mapped||shEnterPrimaryFor(el);
    if(tgt&&shEnterTrigger(tgt,el)){ ev.preventDefault(); return; }
    var card=el.closest?el.closest('.card'):null;
    if(card&&shEnterFocusNext(el,card)){ ev.preventDefault(); return; }
    var pane=el.closest?el.closest('[id^="pane-"]'):null;
    if(pane&&shEnterFocusNext(el,pane)){ ev.preventDefault(); }
  },false);
}

  let article='',unit='',price=null,name='';
  let m=s.match(/^(\d+)\s+/);
  if(m&&m[1].length>=6){ article=m[1]; s=s.slice(m[0].length); }
  m=s.match(/(\d+(?:[.,]\d+)?)\s*(?:р|₽|руб\.?)?$/i);
  if(m){ price=m[1].replace(',','.'); s=s.slice(0,m.index); }
  s=s.trim();
  const units=UNITS.slice().sort((a,b)=>b.length-a.length);
  const low=s.toLowerCase();
  for(const u of units){
    if(!u)continue;
    if(low.endsWith(u)){
      const cut=s.slice(0,s.length-u.length);
      if(cut.trim()){ unit=u; s=cut; }
      break;
    }
  }
  name=s.replace(/[\s_*]+$/g,'').trim();
  if(price==null&&unit){
    const m2=name.match(/(\d+(?:[.,]\d+)?)\s*$/);
    if(m2){ price=+m2[1].replace(',','.'); name=name.slice(0,m2.index).trim(); }
  }
  if(price==null){
    const mm=name.match(/^(\d+(?:[.,]\d+)?)\s*(?:руб\.?|₽|р)?\s*([а-яёА-ЯЁa-zA-Z]*)\s*?(.+)$/i);
    if(mm){
      const upart=mm[2].toLowerCase();
      if(!upart||UNITS.indexOf(upart)>=0){
        price=+mm[1].replace(',','.');
        if(upart)unit=upart;
        name=mm[3].trim();
      }
    }
    if(price!=null&&!unit){
      for(const u of units){
        if(!u)continue;
        if(name.toLowerCase().indexOf(u+' ')>-1){
          const g=name.match(new RegExp('^'+u+'(?:\\s+|$)(.*)$','i'));
          if(g){ unit=u; name=g[1].trim(); }
          break;
        }
      }
    }
  }
  if(!name)return null;
  return {article,name,unit,price:price!=null?+price:null};
}

/* П51.2: кандидаты возврата — ВСЕ накладные магазина за ПОСЛЕДНЮЮ предыдущую дату,
   по возрастанию номера. Если за тот день было две накладные — их две, и возврату
   надо указать адресата (shRetPickOrd). Одна накладная — обычный случай. */
function shRetPrevList(date,shop,shopId){
  const list=shipHistory.filter(h=>h&&h.date<date&&((shopId&&h.shopId===shopId)||(!shopId&&h.shop===shop)));
  if(!list.length)return [];
  let top=list[0].date;
  list.forEach(h=>{if(h.date>top)top=h.date;});
  const same=list.filter(h=>h.date===top);
  same.sort((a,b)=>(a.naklOrd||1)-(b.naklOrd||1));
  return same;
}
/* Последняя накладная предыдущего визита = кандидат с наибольшим номером. */
function shRetPrevOf(date,shop,shopId){
  const list=shRetPrevList(date,shop,shopId);
  return list.length?list[list.length-1]:null;
}
/* П51.2: конкретная накладная-получатель возврата (ord<=0 — последняя). */
function shRetPrevPick(date,shop,shopId,ord){
  const list=shRetPrevList(date,shop,shopId);
  if(!list.length)return null;
  const o=parseInt(ord,10)||0;
  if(o>0){const f=list.filter(h=>(h.naklOrd||1)===o);if(f.length)return f[0];}
  return list[list.length-1];
}
function shRouteReturnsClone(date,shop,shopId,data){
  const out=JSON.parse(JSON.stringify(data||{}));
  const prev=shRetPrevOf(date,shop,shopId);
  if(!prev)return {out:out,moved:null};
  const moved={};
  for(const g in out){const q=out[g]&&(out[g].returned||0);if(q>0){moved[g]=q;out[g].returned=0;}}
  return {out:out,moved:Object.keys(moved).length?moved:null};
}
function shApplyReturnsMove(rec){
  if(!rec||!rec.retPrev)return;
  const want=parseInt(rec.retPrev.ord,10)||1;
  const p=shipHistory.find(h=>h.date===rec.retPrev.date&&((rec.retPrev.shopId&&h.shopId===rec.retPrev.shopId)||(!rec.retPrev.shopId&&h.shop===rec.retPrev.shop))&&((h.naklOrd||1)===want));
  if(p&&p.data){
    for(const g in rec.retPrev.qty){const d=p.data[g];if(d&&typeof d==='object')d.returned=Math.max(0,(d.returned||0)-rec.retPrev.qty[g]);}
  }
  delete rec.retPrev;
}
function shRouteReturns(date,shop,shopId,data,rec,pickOrd){
  if(!rec)return;
  shApplyReturnsMove(rec);
  const prev=shRetPrevPick(date,shop,shopId,pickOrd);
  if(!prev||!data)return;
  const qty={};
  for(const g in data){const d=data[g];const q=d&&(d.returned||0);if(q>0){
    if(!prev.data)prev.data={};
    const pd=prev.data[g];
    if(!pd||typeof pd!=='object')prev.data[g]={shipped:0,returned:0};
    prev.data[g].returned=(prev.data[g].returned||0)+q;
    d.returned=0;
    qty[g]=q;
  }}
  if(Object.keys(qty).length)rec.retPrev={date:prev.date,shop:prev.shop,shopId:prev.shopId||'',ord:(prev.naklOrd||1),qty:qty};
}
function shMigrateReturns(){
  try{
    if(typeof navigator!=='undefined'&&navigator&&navigator.userAgent==='node-test')return false;
    if(!Array.isArray(shipHistory)||!shipHistory.length)return false;
    if(store&&store.shipSettings&&store.shipSettings.retMigrated===true)return false;
    let changed=false;
    const recs=shipHistory.slice().sort((a,b)=>a.date<b.date?-1:(a.date>b.date?1:0));
    recs.forEach(rec=>{
      if(!rec||rec.retPrev||!rec.data)return;
      const prev=shRetPrevOf(rec.date,rec.shop,rec.shopId);
      if(!prev||!prev.data)return;
      const qty={};
      Object.keys(rec.data).forEach(g=>{
        const d=rec.data[g];
        const q=d&&(d.returned||0);
        if(!(q>0))return;
        if(!prev.data[g]||typeof prev.data[g]!=='object')prev.data[g]={shipped:0,returned:0};
        prev.data[g].returned=(prev.data[g].returned||0)+q;
        d.returned=0;
        qty[g]=q;
      });
      if(Object.keys(qty).length){rec.retPrev={date:prev.date,shop:prev.shop,shopId:prev.shopId||'',ord:(prev.naklOrd||1),qty:qty};changed=true;}
    });
    if(changed){
      if(store){store.shipSettings=store.shipSettings||{};store.shipSettings.retMigrated=true;}
      if(typeof saveShip==='function')saveShip();
      if(typeof persist==='function')persist();
    }
    return changed;
  }catch(e){return false;}
}
// ==== Закрытие накладной предыдущим визитом ====
// Накладная закрывается НЕ сразу, а когда в следующий визит в этот магазин
// введены возвраты (в т.ч. нулевые). Текущая накладная остаётся «В работе».
function shRetListTxt(qty){
  if(!qty)return '';
  const goods=store.shipGoods||[];
  return Object.keys(qty).filter(g=>qty[g]>0).map(g=>{
    const m=goods.find(x=>x.id===g);
    return (m?(m.name||m.title||g):g)+' — '+qty[g]+' шт';
  }).join(', ');
}
// Закрыть накладную за предыдущий визит (возвраты уже перенесены в shipHistory).
// Возвращает {num,date,retTxt} для сообщения либо null.
function shClosePrevNakl(prev,retTxt){
  if(!prev)return null;
  const reg=shNaklReg();
  const key=shNaklKeyDate(prev.date,prev.shopId||prev.shop,(prev.naklOrd||1));
  const r=reg[key];
  if(!r)return null;
  if(!r.closed){r.closed=true;r.mod=new Date().toISOString();}
  return {num:r.num,date:prev.date,retTxt:retTxt||''};
}
function shMigrateCloseRule(){
  try{
    if(typeof navigator!=='undefined'&&navigator&&navigator.userAgent==='node-test')return false;
    if(!Array.isArray(shipHistory)||!shipHistory.length)return false;
    if(store&&store.shipSettings&&store.shipSettings.closeRuleMigrated===true)return false;
    const reg=shNaklReg();
    const byShop={};
    Object.keys(reg).forEach(k=>{
      const i=k.indexOf('|');if(i<0)return;
      const date=k.slice(0,i),shop=k.slice(i+1);
      if(!byShop[shop])byShop[shop]=[];
      byShop[shop].push({key:k,date:date});
    });
    const now=new Date().toISOString();
    let changed=false;
    Object.keys(byShop).forEach(shop=>{
      const rows=byShop[shop].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
      rows.forEach((r,idx)=>{
        const want=(idx>0);
        if(!!reg[r.key].closed!==want){reg[r.key].closed=want;changed=true;}
        if(want&&!reg[r.key].closedAt){reg[r.key].closedAt=now;changed=true;}
      });
    });
    if(changed){
      if(store){store.shipSettings=store.shipSettings||{};store.shipSettings.closeRuleMigrated=true;}
      if(typeof saveShip==='function')saveShip();
      if(typeof persist==='function')persist();
    }else if(store){
      store.shipSettings=store.shipSettings||{};store.shipSettings.closeRuleMigrated=true;
      if(typeof persist==='function')persist();
    }
    return changed;
  }catch(e){return false;}
}
function shSaveFact(){
  const dateEl=$('shDate');
  const shopEl=$('shDispShop');
  const date=dateEl?dateEl.value:'';
  const shop=shopEl?(shopEl.value||'').trim():'';
  if(!date||!shop){alert('Выбери дату и магазин');return;}
  if(!shSelShopId){
    const dayList=shDayShopFind('');

    }
  }
  let goods=store.shipGoods||[];
  try{ let canon=[]; if(typeof shG90==='function'){const a=shG90();if(a)canon.push(a);} if(typeof shG200==='function'){const b=shG200();if(b)canon.push(b);} if(!canon.length){const re=/(^|[^0-9])(90|200)\s*(г|гр|грамм)/i;canon=goods.filter(g=>re.test(g.name||''));} if(canon.length) goods=canon; }catch(e){}
  const noRet=shDayNoRet();
  const data={};
  let hasData=false;
  goods.forEach(g=>{
    const giveEl=document.querySelector('.sh-give[data-gid="'+g.id+'"]');
    const retEl=document.querySelector('.sh-ret[data-gid="'+g.id+'"]');

    data[g.id]={shipped:+giveStr||0,returned:noRet?0:(+retStr||0)};
  });
  if(!hasData){alert('Введи хотя бы одно значение');return;}
const shopId=shSelShopId;
  const curOrd=(parseInt(shDayOrd,10)||1);
  const existing=shipHistory.findIndex(h=>h.date===date&&h.shop===shop&&h.shopId===shopId&&((h.naklOrd||1)===curOrd));
  const reg=shNaklReg();
  const key=shNaklKeyDate(date,shopId||shop,curOrd);
  let r=reg[key];
  const now=new Date().toISOString();
  const routed=shRouteReturnsClone(date,shop,shopId,data);
  const storeData=routed.out;
  const prevEntry={};goods.forEach(g=>{const v=existing>=0?(shipHistory[existing].data?shipHistory[existing].data[g.id]:null):null;const er=existing>=0?shipHistory[existing]:null;prevEntry[g.id]={shipped:v?(+(v.shipped||0)):0,returned:(er&&er.retPrev&&er.retPrev.qty&&er.retPrev.qty[g.id]!=null)?er.retPrev.qty[g.id]:(v?(+(v.returned||0)):0)};});
  const sameData=existing>=0&&JSON.stringify(prevEntry)===JSON.stringify(data);
  if(existing>=0&&sameData){
    alert('Данные не изменились — накладная №'+(r?r.num:(shipHistory[existing].naklNum||''))+' уже так сохранена.');
    return;
  }
  if(!r){
    if(!shDayAskSecond(date,shopId,shop,curOrd))return;
    const num=shNaklNumOf(date,shopId,shop,curOrd)||shNextNaklNum();
    r={num:num,at:now,mod:now,closed:false};
    if(curOrd>1)r.ord=curOrd;
    reg[key]=r;
  }
  const num=r.num;
  const prevClose=shRetPrevPick(date,shop,shopId,shRetPickOrd);
  const retTxt=shRetListTxt(routed.moved);
  const prevMsg=prevClose?('Накладная № '+(shNaklRegOf(prevClose.date,prevClose.shopId,prevClose.shop,(prevClose.naklOrd||1))||{}).num+' за '+fmtDate(prevClose.date)+' будет закрыта'+(retTxt?(' — возврат: '+retTxt):' — возвратов не было')+'.'):'';

/* Последний визит в магазин в ТОТ ЖЕ день недели, что и выбранная дата прогноза.
   Возвраты в shipHistory уже перенесены в накладную предыдущего визита,
   поэтому h.data[gid].returned — это фактические возвраты той отгрузки. */
function shFcPrevVisit(date,shopId,shopName,day){
  if(!date)return null;
  const wantDay=day||getDayRu(date);
  let best=null;
  for(const h of (shipHistory||[])){
    if(!h||!h.data||!h.date)continue;
    if(h.date>=date)continue;
    if(getDayRu(h.date)!==wantDay)continue;
    const same=shopId?(h.shopId===shopId):(h.shop===shopName);
    if(!same)continue;
    if(!best||h.date>best.date)best=h;
  }
  if(!best)return null;
  let give=0,ret=0;const byGood={};
  for(const gid in best.data){const v=best.data[gid]||{};
    const sh=+v.shipped||0,rt=+v.returned||0;
    if(sh||rt)byGood[gid]={give:sh,ret:rt};
    if(sh)give+=sh;
    if(rt)ret+=rt;
  }
  return {date:best.date,day:getDayRu(best.date),give:give,ret:ret,byGood:byGood};
}

      if(r){n++;goods.forEach(g=>{tot[g.id]+=(r.data[g.id]>0?r.data[g.id]:0)||0;});}
    });
    let t='Итого: ';goods.forEach(g=>{t+='<b>'+esc(g.name)+'</b> — '+tot[g.id]+' шт  ';});
    info.innerHTML=t;
  }

  const planSearch=$('shPlanSearch');
  if(planSearch){
    const box=document.createElement('div');
    box.style.cssText='position:relative';
    planSearch.parentNode.insertBefore(box,planSearch.nextSibling);
    const dd=document.createElement('div');
    dd.style.cssText='position:absolute;left:0;right:0;max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);z-index:20;box-shadow:var(--shadow);display:none';
    box.appendChild(planSearch); box.appendChild(dd);
function showList(q){
      const ql=(q||'').trim().toLowerCase();
      const matches=rows.filter(r=>!ql||shopLabel(r.shopId).toLowerCase().indexOf(ql)>=0);
      dd.innerHTML=matches.slice(0,20).map(r=>{
        const on=selShops.indexOf(r.shopId)>=0;
        return '<div style="padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--txt);display:flex;gap:8px;align-items:center"'+
        (on?' style="background:color-mix(in srgb,var(--accent) 15%,transparent)"':'')+
        ' data-sid="'+r.shopId+'"><span style="flex:1">'+esc(shopLabel(r.shopId))+'</span>'+
        (on?'<span class="hint">✓</span>':'')+'</div>';
      }).join('');
dd.style.display=matches.length?'block':'none';
      dd.querySelectorAll('[data-sid]').forEach(div=>div.onclick=()=>{
        const sid=div.dataset.sid;
        if(selShops.indexOf(sid)<0)selShops.push(sid);
        const lbl=shopLabel(sid).toLowerCase();
        if((planQ||'').toLowerCase()===lbl){ planQ=''; planSearch.value=''; }
        else { planQ=lbl; planSearch.value=shopLabel(sid); }
        showList(planSearch.value);
        renderSel();
      });
    }
    planSearch.oninput=()=>{ planQ=planSearch.value; showList(planSearch.value); renderSel(); };
    planSearch.onfocus=()=>showList(planSearch.value);
    document.addEventListener('click',e=>{ if(!box.contains(e.target))dd.style.display='none'; });
  }
  Object.keys(shFcDirtyData).forEach(sid=>{
    const r=rows.find(x=>x.shopId===sid);
    if(!r)return;
    Object.keys(shFcDirtyData[sid]).forEach(gid=>{
      r.data[gid]=shFcDirtyData[sid][gid];
      shPlanManual[sid+'_'+gid]=1;
    });
  });
  renderSel();

if(!el.__shFcInputBound){
  el.__shFcInputBound=1;
  const hRowsById=new Map();
  rows.forEach(x=>hRowsById.set(String(x.shopId),x));
  const hRowOf=(sid)=>{const x=hRowsById.get(String(sid));if(x)return x;for(let i=0;i<rows.length;i++){if(rows[i].shopId===sid)return rows[i];}return null;};
  const hPlans=shipPlans[shFDVal]||[];
  const hSavedById=new Map();
  hPlans.forEach(x=>{const k=String(x.shopId||('n:'+x.shop));if(!hSavedById.has(k))hSavedById.set(k,x);});
  el.addEventListener('input',e=>{
    if(e.target&&e.target.classList&&e.target.classList.contains('sh-pred')){
      const sid=e.target.dataset.sid, gid=e.target.dataset.gid;
      const r=hRowOf(sid);
      const plSaved=hPlans;
      const pSaved=hSavedById.get(String(sid))||plSaved.find(x=>(x.shopId||('n:'+x.shop))===sid);
      const keep=(pSaved&&pSaved.data&&pSaved.data[gid]!=null)?pSaved.data[gid]:null;
      shPlanManual[sid+'_'+gid]=1;
      shFcDirtyData[sid]=shFcDirtyData[sid]||{};
      if(e.target.value===''){
        delete shFcDirtyData[sid][gid];
        if(r){ if(keep!=null)r.data[gid]=keep; else delete r.data[gid]; }
        e.target.value=(keep!=null)?keep:'';
      } else {
        shFcDirtyData[sid][gid]=+e.target.value||0;
        if(r)r.data[gid]=+e.target.value||0;
      }
      shFcDirty[sid]=Object.keys(shFcDirtyData[sid]).length>0;
      updateTotal();
      const summ=el.querySelector('.sh-summ[data-sid="'+sid+'"]');
      if(summ&&r)summ.textContent='всего '+shopTotal(r)+' шт';
      shFcStatusUI();
    }
  });
}
}

    {id:'avg',label:'📊 Средние по дням недели',hint:'среднее отдано пн-вс по каждому товару'}

function shAnalyticsPrintBuild(from,to,picked){
  const fromDate=new Date(from), toDate=new Date(to);
  const filtered=shipHistory.filter(h=>{
    const ds=String(h.date||'').slice(0,10);
    return ds>=from&&ds<=to;
  });
  const planRecs=[];
  Object.keys(shipPlans||{}).forEach(d=>{ const ds=String(d).slice(0,10); if(ds<from||ds>to)return; (shipPlans[d]||[]).forEach(p=>{ if(p)planRecs.push(p); }); });
  const goodsAll=shMergeLocalGoods(store.shipGoods||[],filtered);
  const goodsWork=shMergeLocalGoods(store.shipGoods||[],filtered.concat(planRecs));
  let goods=goodsAll;
  const alarm=(store.shipSettings&&store.shipSettings.returnAlarm)||15;
  const td='border:1px solid #000;padding:4px 6px;font-size:12px;';
  const th=td+'font-weight:700;background:#eee;';
  const c=td+'text-align:center;';
  const daysDiff=Math.floor((toDate-fromDate)/86400000)+1;
  let firstBlock=true;
  const pb=()=>{const fb=firstBlock;firstBlock=false;return fb?'':'<div style="page-break-before:always"></div>';};
  const gv=(h,gid)=>((h.data&&h.data[gid])?h.data[gid].shipped||0:0);
  const rt=(h,gid)=>((h.data&&h.data[gid])?h.data[gid].returned||0:0);
  const recActive=h=>{const d=(h&&h.data)||{};return Object.keys(d).some(k=>{const v=d[k];return (v&&typeof v==='object')?((+v.shipped>0)||(+v.returned>0)):((+v)>0);});};
  goods=goodsAll.filter(g=>filtered.some(h=>recActive(h)&&((gv(h,g.id)>0)||(rt(h,g.id)>0))));
  const sumGive=h=>goods.reduce((s,g)=>s+gv(h,g.id),0);
  const sumRet=h=>goods.reduce((s,g)=>s+rt(h,g.id),0);
  const gUnit=g=>shGoodMeta(g).unit||'';
  const gPrice=(g,h)=>shNaklPrice(h?h.date:'',h?h.shopId:'',h?h.shop:'',h?((shShops().find(s2=>s2&&s2.id===h.shopId)||{}).legalId||''):'',g.id,h?h.naklOrd:1);

  const shopMap={};
  filtered.forEach(h=>{
    const _shops=store.shipShops||[];
    const _shp=(h.shopId?_shops.find(x=>x.id===h.shopId):null)||_shops.find(x=>x.name===h.shop)||null;
    const key=h.shopId||(_shp?_shp.id:('n:'+h.shop));
    if(!shopMap[key])shopMap[key]={shop:_shp?_shp.name:h.shop,addr:_shp?(_shp.addr||''):'',records:[]};
    shopMap[key].records.push(h);
  });
  const shopKeys=Object.keys(shopMap).filter(k=>shopMap[k].records.some(recActive));
  const totByGood={};goods.forEach(g=>{const r={give:0,ret:0};filtered.forEach(h=>{if(h.data&&h.data[g.id]){r.give+=h.data[g.id].shipped||0;r.ret+=h.data[g.id].returned||0;}});totByGood[g.id]=r;});
  const revByGood={};goods.forEach(g=>{revByGood[g.id]=Math.round(filtered.reduce((a,h)=>a+(gv(h,g.id)-rt(h,g.id))*gPrice(g,h),0));});
  const revByShop={};shopKeys.forEach(k=>{revByShop[k]=Math.round(shopMap[k].records.reduce((a,h)=>a+goods.reduce((s,g)=>s+(gv(h,g.id)-rt(h,g.id))*gPrice(g,h),0),0));});
  const totalRev=goods.reduce((a,g)=>a+revByGood[g.id],0);

  let r='<style>h2,h4{font-family:Arial,sans-serif;margin:4px 0 8px}table{border-collapse:collapse}td,th{font-family:Arial,sans-serif}</style>';
  r+='<h2 style="text-align:center">Аналитика по отгрузкам</h2>';
  r+='<div style="font-size:12px;margin-bottom:10px">Период: с <b>'+fmtDate(from)+'</b> по <b>'+fmtDate(to)+'</b> ('+daysDiff+' дн.) &nbsp;|&nbsp; Порог возврата: '+alarm+'%</div>';

  /* по товарам */
  if(picked.indexOf('goods')>=0){
  r+='<h4>Товары</h4><table><tr><th style="'+th+'text-align:left">Товар</th><th style="'+th+'">Ед.</th><th style="'+th+'">Отдано</th><th style="'+th+'">Возврат</th><th style="'+th+'">Возврат, %</th><th style="'+th+'">Выручка, ₽</th></tr>';
  let pctSum=0,pctN=0;
  const byUnit={};
  goods.forEach(g=>{
    const t=totByGood[g.id],u=gUnit(g)||'—';
    const pct=t.give>0?((t.ret/t.give)*100):0;
    if(t.give>0){pctSum+=pct;pctN++;}
    if(!byUnit[u])byUnit[u]={give:0,ret:0,rev:0};
    byUnit[u].give+=t.give;byUnit[u].ret+=t.ret;byUnit[u].rev+=revByGood[g.id];
    r+='<tr><td style="'+td+'">'+esc(g.name)+'</td><td style="'+c+'">'+esc(u)+'</td><td style="'+c+'">'+t.give+(u?' '+esc(u):'')+'</td><td style="'+c+'">'+t.ret+(u?' '+esc(u):'')+'</td><td style="'+c+'">'+pct.toFixed(1)+'%</td><td style="'+c+'">'+revByGood[g.id].toLocaleString('ru-RU')+' ₽</td></tr>';
  });
  const avgPct=pctN?Math.round(pctSum/pctN*10)/10:0;
  r+='<tr style="font-weight:700"><td style="'+td+'" colspan="4">СРЕДНИЙ % возврата</td><td style="'+c+'">'+avgPct.toFixed(1)+'%</td><td style="'+td+'"></td></tr>';
  Object.keys(byUnit).forEach(u=>{
    const t=byUnit[u];
    r+='<tr><td style="'+td+'" colspan="2"><b>ИТОГО по '+esc(u)+'</b></td><td style="'+c+'">'+t.give+'</td><td style="'+c+'">'+t.ret+'</td><td style="'+td+'"></td><td style="'+c+'">'+t.rev.toLocaleString('ru-RU')+' ₽</td></tr>';
  });
  r+='<tr style="font-weight:700"><td style="'+td+'" colspan="5">ВСЕГО выручка</td><td style="'+c+'">'+totalRev.toLocaleString('ru-RU')+' ₽</td></tr></table>';
  }

  /* по магазинам */
  if(picked.indexOf('shops')>=0){
  r+=pb()+'<h4>Магазины</h4>';
  const nG=goods.length;
  r+='<table><tr><th style="'+th+'text-align:left" rowspan="2">Магазин</th><th style="'+th+'" colspan="'+nG+'">Количество</th><th style="'+th+'" colspan="'+nG+'">Возвраты</th><th style="'+th+'" rowspan="2">% возврата</th><th style="'+th+'" rowspan="2">Заработали, ₽</th><th style="'+th+'" rowspan="2">Потеряли, ₽</th><th style="'+th+'" rowspan="2">Прибыль, ₽</th></tr><tr>';
  goods.forEach(g=>{r+='<th style="'+th+'">'+esc(g.name)+(gUnit(g)?' ('+esc(gUnit(g))+')':'')+'</th>';});
  goods.forEach(g=>{r+='<th style="'+th+'">'+esc(g.name)+(gUnit(g)?' ('+esc(gUnit(g))+')':'')+'</th>';});
  r+='</tr>';
  const totG={},totR={};goods.forEach(g=>{totG[g.id]=0;totR[g.id]=0;});
  let totRevSh=0,totLostSh=0;
  shopKeys.forEach(k=>{
    const sm=shopMap[k];
    r+='<tr><td style="'+td+'">'+esc(sm.shop)+(sm.addr?'<br><span style="font-size:10px">'+esc(sm.addr)+'</span>':'')+'</td>';
    goods.forEach(g=>{
      let gvS=0,rtS=0;
      sm.records.forEach(h=>{gvS+=gv(h,g.id);rtS+=rt(h,g.id);});
      totG[g.id]+=gvS;
      r+='<td style="'+c+'">'+gvS+'</td>';
    });
    goods.forEach(g=>{
      let rr=0;
      sm.records.forEach(h=>{rr+=rt(h,g.id);});
      totR[g.id]+=rr;
      r+='<td style="'+c+'">'+rr+'</td>';
    });
    const give=sm.records.reduce((a,h)=>a+sumGive(h),0);
    const ret=sm.records.reduce((a,h)=>a+sumRet(h),0);
    const pct=give>0?((ret/give)*100).toFixed(1):'0';
    const lost=Math.round(goods.reduce((a,g)=>a+sm.records.reduce((x,h)=>x+rt(h,g.id),0)*gPrice(g,sm.records[0]),0));
    r+=pctCellPh('<td style="'+c+'">'+pct+'%</td>',pct,alarm)+'<td style="'+c+'">'+revByShop[k].toLocaleString('ru-RU')+'</td><td style="'+c+'">−'+lost.toLocaleString('ru-RU')+'</td><td style="'+c+';font-weight:800">'+(revByShop[k]-lost>=0?'+':'−')+Math.abs(revByShop[k]-lost).toLocaleString('ru-RU')+'</td></tr>';
    totRevSh+=revByShop[k];
    totLostSh+=lost;
  });
  r+='<tr style="font-weight:700"><td style="'+td+'">ИТОГО</td>';
  goods.forEach(g=>{r+='<td style="'+c+'">'+totG[g.id]+'</td>';});
  goods.forEach(g=>{r+='<td style="'+c+'">'+totR[g.id]+'</td>';});
  const tg=goods.reduce((a,g)=>a+totG[g.id],0),tr=goods.reduce((a,g)=>a+totR[g.id],0);
  const tp=tg>0?((tr/tg)*100).toFixed(1):'0';
  r+=pctCellPh('<td style="'+c+'">'+tp+'%</td>',tp,alarm)+'<td style="'+c+'">'+totRevSh.toLocaleString('ru-RU')+'</td><td style="'+c+'">−'+totLostSh.toLocaleString('ru-RU')+'</td><td style="'+c+';font-weight:800">'+(totRevSh-totLostSh>=0?'+':'−')+Math.abs(totRevSh-totLostSh).toLocaleString('ru-RU')+'</td></tr>';
  r+='</table>';
  }
  function pctCellPh(cell,pct,al){const p=+pct;if(p>al)return cell.replace('<td','<td style="background:#f8d7da');return p>al/2?cell.replace('<td','<td style="background:#fff3cd'):cell;}

  /* юрлица */
  if(picked.indexOf('legal')>=0){
  r+=pb()+'<h4>Юрлица</h4>';
  const _lgKnown=shLegals().map(le=>{const recs=shAnLegalRecs(le.id,filtered);return {le:le,recs:recs};});
  const _lgUsed=[];
  _lgKnown.forEach(x=>x.recs.forEach(h=>_lgUsed.push(h)));
  const _lgGroups={};
  filtered.forEach(h=>{
    if(!recActive(h)||_lgUsed.indexOf(h)>=0)return;
    const _lid=shAnLegalOf(h);
    if(!_lgGroups[_lid])_lgGroups[_lid]={le:_lid?(shLegalById(_lid)||{id:_lid,name:'Юрлицо '+_lid}):{id:'',name:'Без юрлица'},recs:[]};
    _lgGroups[_lid].recs.push(h);
  });
  const legals=_lgKnown.concat(Object.keys(_lgGroups).map(k=>_lgGroups[k])).filter(x=>x.recs.some(recActive));
  if(!legals.length){
    r+='<div style="font-size:12px">Юрлиц нет.</div>';
  } else {
    const lRows=legals.map(L=>{
      const le=L.le;
      const recs=L.recs;
      const give=recs.reduce((a,h)=>a+sumGive(h),0);
      const ret=recs.reduce((a,h)=>a+sumRet(h),0);
      const rev=Math.round(recs.reduce((a,h)=>a+goods.reduce((s,g)=>s+(gv(h,g.id)-rt(h,g.id))*gPrice(g,h),0),0));
      const lost=Math.round(recs.reduce((a,h)=>a+goods.reduce((s,g)=>s+rt(h,g.id)*gPrice(g,h),0),0));
      const points={};
      recs.forEach(h=>{
        const shp=shAnShopOf(h);
        const key=(shp?shp.id:h.shopId)||('n:'+h.shop);
        if(!points[key])points[key]={name:shp?shp.name:h.shop,addr:shp?(shp.addr||''):'',g:0,r:0,rev:0};
        points[key].g+=sumGive(h);points[key].r+=sumRet(h);
        points[key].rev+=Math.round(goods.reduce((s,g)=>s+(gv(h,g.id)-rt(h,g.id))*gPrice(g,h),0));
      });
      return {le,give,ret,rev,lost,points:Object.keys(points).map(k=>points[k]).sort((a,b)=>b.rev-a.rev)};
    }).filter(x=>x.give>0||x.ret>0);
    if(!lRows.length){
      r+='<div style="font-size:12px">За период по юрлицам отгрузок нет.</div>';
    } else {
      let tG=0,tR=0,tRev=0,tLost=0;
      r+='<table><tr><th style="'+th+'text-align:left">Юрлицо</th><th style="'+th+'">Точек</th><th style="'+th+'">Отдано</th><th style="'+th+'">Возврат</th><th style="'+th+'">% возвр.</th><th style="'+th+'">Выручка, ₽</th><th style="'+th+'">Потери, ₽</th><th style="'+th+'">Прибыль, ₽</th></tr>';
      lRows.forEach(x=>{
        const pct=x.give>0?((x.ret/x.give)*100).toFixed(1):'0';
        const prof=x.rev-x.lost;
        tG+=x.give;tR+=x.ret;tRev+=x.rev;tLost+=x.lost;
        r+='<tr><td style="'+td+'"><b>'+esc(x.le.name)+'</b>'+(x.le.inn?'<br><span style="font-size:10px">ИНН '+esc(x.le.inn)+'</span>':'')+'</td><td style="'+c+'">'+x.points.length+'</td><td style="'+c+'">'+x.give+'</td><td style="'+c+'">'+x.ret+'</td><td style="'+c+'">'+pct+'%</td><td style="'+c+'">'+x.rev+'</td><td style="'+c+'">'+(x.lost>0?'−'+x.lost:'0')+'</td><td style="'+c+';font-weight:800">'+(prof>=0?'+':'−')+Math.abs(prof)+'</td></tr>';
      });
      const tp=tG>0?((tR/tG)*100).toFixed(1):'0',prof=tRev-tLost;
      r+='<tr style="font-weight:700"><td style="'+td+'">ИТОГО</td><td style="'+c+'">'+lRows.reduce((a,x)=>a+x.points.length,0)+'</td><td style="'+c+'">'+tG+'</td><td style="'+c+'">'+tR+'</td><td style="'+c+'">'+tp+'%</td><td style="'+c+'">'+tRev+'</td><td style="'+c+'">'+(tLost>0?'−'+tLost:'0')+'</td><td style="'+c+'">'+(prof>=0?'+':'−')+Math.abs(prof)+'</td></tr>';
      r+='</table>';
    }
  }
  }

  /* сводка */

  r+='<tr><td style="'+td+'">Отдано всего</td><td style="'+c+'">'+tG.toLocaleString('ru-RU')+'</td></tr>';

  r+='<tr><td style="'+td+'">Потери от возвратов</td><td style="'+c+'">−'+tLs.toLocaleString('ru-RU')+' ₽</td></tr>';
  r+='<tr><td style="'+td+'">Прибыль</td><td style="'+c+'">'+(tRev-tLs>=0?'+':'−')+Math.abs(tRev-tLs).toLocaleString('ru-RU')+' ₽</td></tr>';
  r+='<tr><td style="'+td+'">Среднее в день</td><td style="'+c+'">'+(nDy?Math.round(tG/nDy).toLocaleString('ru-RU'):'—')+'</td></tr>';
  r+='<tr><td style="'+td+'">Среднее на магазин в день</td><td style="'+c+'">'+(nDy&&nSh?Math.round(tG/(nSh*nDy)).toLocaleString('ru-RU'):'—')+'</td></tr>';
  r+='</table>';
  }

  /* динамика по дням */
  if(picked.indexOf('days')>=0){
  r+=pb()+'<h4>Динамика по дням</h4>';
  let prevGv=null;
  r+='<table><tr><th style="'+th+'text-align:left">Дата</th><th style="'+th+'">День</th><th style="'+th+'">Отдано</th><th style="'+th+'">Возврат</th><th style="'+th+'">%</th><th style="'+th+'">Выручка, ₽</th><th style="'+th+'">к пред. дню</th></tr>';
  const dayRows={};
  filtered.forEach(h=>{if(!dayRows[h.date])dayRows[h.date]={give:0,ret:0,rev:0};dayRows[h.date].give+=sumGive(h);dayRows[h.date].ret+=sumRet(h);dayRows[h.date].rev+=Math.round(goods.reduce((s,g)=>s+(gv(h,g.id)-rt(h,g.id))*gPrice(g,h),0));});
  Object.keys(dayRows).sort().forEach(d=>{
    const t=dayRows[d];
    const pct=t.give>0?(t.ret/t.give*100):0;
    const chg=prevGv===null?'—':(prevGv>0?Math.round((t.give-prevGv)/prevGv*100):(t.give>0?100:0));

    prevGv=t.give;
  });
  r+='</table>';
  }

  

  /* упущенная выручка */
  if(picked.indexOf('lost')>=0){
  r+=pb()+'<h4>Упущенная выручка из-за возвратов</h4><div style="font-size:11px;color:#555;margin-bottom:4px">Возврат × цена товара.</div>';
  r+='<table><tr><th style="'+th+'text-align:left">Товар</th><th style="'+th+'">Ед.</th><th style="'+th+'">Возврат</th><th style="'+th+'">Цена, ₽</th><th style="'+th+'">Упущено, ₽</th></tr>';
  let totLost=0;
  goods.forEach(g=>{
    const t=totByGood[g.id],u=gUnit(g)||'—';
    const lostRaw=filtered.reduce((a,h)=>a+rt(h,g.id)*gPrice(g,h),0);
    const lost=Math.round(lostRaw);
    const price=t.ret>0?Math.round(lostRaw/t.ret*100)/100:gPrice(g);
    totLost+=lost;
    r+='<tr><td style="'+td+'">'+esc(g.name)+'</td><td style="'+c+'">'+esc(u)+'</td><td style="'+c+'">'+t.ret+'</td><td style="'+c+'">'+price+'</td><td style="'+c+'">'+lost.toLocaleString('ru-RU')+'</td></tr>';

  /* лучшие/худшие */

  /* сравнение периодов */
  if(picked.indexOf('cmp')>=0){

  /* среднее по дням недели */

  r+='<div style="font-size:12px;margin-top:20px">Дата печати: '+new Date(Date.now()+2*3600*1000).toISOString().slice(0,10)+'</div>';
  shPrintOpen([[r,'Аналитика']]);
  return r;
}

function shPrintCtx(sids){
  const fDate=shCurFDate||($('shForecastDate')?$('shForecastDate').value:'');
  const goods=shCurGoods&&shCurGoods.length?shCurGoods:store.shipGoods||[];
  let curRows=shCurRows||[];

  const bySid={};
  sids.forEach(sid=>{
    let r=curRows.find(x=>x.shopId===sid);
    if(!r&&sid.indexOf('n:')===0)r=curRows.find(x=>x.shop===sid.slice(2));
    if(!r){const pr=plan.find(p=>(p.shopId===sid)||(p.shop===sid)||(p.shop===sid.slice(2)));bySid[sid]=pr?pr.data||{}:{};}
    else bySid[sid]=r.data||{};
  });
  const idToShop={};
  store.shipShops.forEach(s=>{idToShop[s.id]=s.name+((s.addr&&bySid[s.id])?' — '+s.addr:'');});
  Object.keys(bySid).forEach(sid=>{ if(sid.indexOf('n:')===0&&!idToShop[sid])idToShop[sid]=sid.slice(2); });
  return {fDate,goods,bySid,idToShop,dayName:fDate?getDayRu(fDate):''};
}
function shA5Fit(root){
  root=root||document;
  const halves=root.querySelectorAll('.a5half');
  for(let i=0;i<halves.length;i++){
    const half=halves[i];
    const doc=half.querySelector('.a5doc');
    if(!doc)continue;
    doc.style.transform='none';
    doc.style.transformOrigin='top left';
    let padT=0,padB=0,padL=0,padR=0;
    try{ const cs=(typeof getComputedStyle==='function')?getComputedStyle(half):null; if(cs){ padT=parseFloat(cs.paddingTop)||0; padB=parseFloat(cs.paddingBottom)||0; padL=parseFloat(cs.paddingLeft)||0; padR=parseFloat(cs.paddingRight)||0; } }catch(e){}
    const avail=half.clientHeight-padT-padB, W=half.clientWidth-padL-padR;
    if(!avail||!W){continue;}
    let k=1;
    for(let p=0;p<8;p++){
      doc.style.width=(W/k)+'px';
      doc.style.height='auto';
      const H=doc.scrollHeight;
      if(!H){break;}
      const raw=Math.max(0.55, Math.min(1.2, avail/H));
      const nk=k+0.7*(raw-k);
      if(Math.abs(nk-k)<0.004){k=nk;break;}
      k=nk;
    }
    for(let g=0;g<24;g++){
      doc.style.width=(W/k)+'px';
      doc.style.height='auto';
      const H2=doc.scrollHeight||0;
      if(!H2)break;
      if(H2*k<=avail+0.5)break;
      k=Math.max(0.55, k*Math.max(0.97, avail/(H2*k)));
    }
    doc.style.width=(W/k)+'px';
    doc.style.height=(avail/k)+'px';
    doc.style.transform='scale('+k+')';
    doc.style.overflow='hidden';
  }
}

function shSumPropis(n){
  n=Math.round((n||0)*100)/100;
  const rub=Math.floor(n);
  const kop=Math.round((n-rub)*100);
  const ones=['','один','два','три','четыре','пять','шесть','семь','восемь','девять','десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать'];
  const tens=['','десять','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'];
  const hundreds=['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот'];
  function three(a){
    let s='';
    const h=Math.floor(a/100); if(h)s+=hundreds[h]+' ';
    const t=a%100;
    if(t>0&&t<20)s+=ones[t]+' ';
    else{const d=Math.floor(t/10),u=t%10; if(d)s+=tens[d]+' '; if(u)s+=ones[u]+' ';}
    return s;
  }
  function plural2(a,f){const t=a%100; if(t>=11&&t<=14)return f[2]; const u=a%10; if(u===1)return f[0]; if(u>=2&&u<=4)return f[1]; return f[2];}
  let rubTxt='';
  if(rub===0)rubTxt='ноль';
  else{
    const th=Math.floor(rub/1000),rest=rub%1000;
    let thTxt='';
    if(th){
      let w=three(th).trim();
      if(/один$/.test(w))w=w.replace(/один$/,'одна');
      else if(/два$/.test(w))w=w.replace(/два$/,'две');
      thTxt=w+' '+plural2(th,['тысяча','тысячи','тысяч'])+' ';
    }
    rubTxt=(thTxt+three(rest)).trim();
  }
  return rubTxt+' '+plural2(rub,['рубль','рубля','рублей'])+' '+(kop<10?'0':'')+kop+' копеек';
}

function shSimpleSheetPages(sid,ctx,num,copies,orient){

function shUpdSheetPages(sid,ctx,num,copies,orient){
  const land=(orient==='landscape');
  const SW=land?'297mm':'210mm', SH=land?'209mm':'296mm';
  const availPx=(land?209:296)*3.7795/2-(land?38:30);
  const headerH=175,footerH=120,rowH=27,targetK=0.75;
  const maxRows=Math.max(3,Math.floor((availPx/targetK-headerH-footerH)/rowH));
  const rows=shUpdRows(sid,ctx);
  const chunks=[];
  for(let i=0;i<rows.length;i+=maxRows)chunks.push(rows.slice(i,i+maxRows));
  if(!chunks.length)chunks.push([]);
  copies=Math.max(1,Math.min(9,copies||1));
  const slots=[];
  for(let k=0;k<copies;k++){
    for(let ci=0;ci<chunks.length;ci++){
      const raw=shUpdHtml(sid,ctx,num,chunks[ci],ci===chunks.length-1)||'';
      slots.push(raw?('<div class="a5doc" style="height:100%;display:flex;flex-direction:column;overflow:hidden">'+raw+'</div>'):'');
    }
  }
  const pages=[];
  const sheets=Math.ceil(slots.length/2);
  for(let s=0;s<sheets;s++){
    const slotTop=slots[s*2]||'',slotBot=slots[s*2+1]||'';
    const cut=slotBot?('<div style="position:absolute;top:50%;left:0;right:0;border-top:1px dashed #888"></div>'+
      '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:0 6px;font-size:9px;color:#888;white-space:nowrap">✂ линия разреза</div>'):'';
    pages.push('<div class="a4sheet" style="width:'+SW+';height:'+SH+';box-sizing:border-box;padding:0 4mm;display:flex;flex-direction:column;overflow:hidden;position:relative;background:#fff;margin:0 auto">'+
      '<div class="a5half" style="flex:1 1 50%;min-height:0;overflow:hidden;box-sizing:border-box;padding-top:8mm">'+slotTop+'</div>'+
      '<div class="a5half" style="flex:1 1 50%;min-height:0;overflow:hidden;box-sizing:border-box;padding-top:10mm">'+slotBot+'</div>'+
      cut+
    '</div>');
  }
  return pages;
}

  h+='<div style="margin-top:10px;font-size:12px"><b>Архив сверок:</b> <span id="svArchCnt" style="color:var(--muted)">'+((store.shipRecon||[]).length?store.shipRecon.length+' документов':'нет')+'</span></div>';
  return h;
}

function shAnWorkQty(it,gid){ return shQtyOf((it&&it.data)?it.data[gid]:0); }
function shAnWorkMoney(it,gid){
  const q=shAnWorkQty(it,gid);
  if(!q)return 0;
  let p=0;
  try{ p=shNaklPrice(it.date,it.shopId||'',it.shopName||it.shop||'',it.legalId||'',gid,it.ord||1); }catch(e){ p=0; }
  return Math.round(q*(+p||0));
}
function shAnWorkRows(from,to,leId){
  let rows=[];
  try{ rows=(typeof shNaklRows==='function')?shNaklRows():[]; }catch(e){ rows=[]; }
  const out=[], seen={};
  (rows||[]).forEach(r=>{
    if(!r||!r.date)return;
    const ds=String(r.date).slice(0,10);
    if(ds<from||ds>to)return;
    const ord=r.ord||1;
    const plain=r.shopName||r.shop||'';
    const full=r.shop||plain;
    let hasFact=false;
    try{
      hasFact=(shipHistory||[]).some(h=>{
        if(String(h.date||'').slice(0,10)!==ds)return false;
        if((h.naklOrd||1)!==ord)return false;
        if(r.shopId)return h.shopId===r.shopId;
        return h.shop===plain||h.shop===full;
      });
    }catch(e){}
    if(hasFact)return;
    const data=r.data||{};
    if(!Object.keys(data).some(k=>shQtyOf(data[k])>0))return;
    if(leId){
      let ok=false;
      try{ ok=shAnLegalHas(leId,{date:ds,shopId:r.shopId||'',shop:plain||full,naklOrd:ord}); }catch(e){ ok=false; }
      if(!ok)return;
    }
    const key=ds+'|'+(r.shopId||full)+'|'+ord;
    if(seen[key])return;
    seen[key]=1;
    out.push({date:ds,shopId:r.shopId||'',shop:full,shopName:plain,ord:ord,num:r.num||'',data:data});
  });
  out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:((+a.num||0)-(+b.num||0)));
  return out;
}
function shAnWorkTotals(list,goods){
  const gs=goods||[];
  const qty=(list||[]).reduce((a,it)=>a+gs.reduce((x,g)=>x+shAnWorkQty(it,g.id),0),0);
  const money=(list||[]).reduce((a,it)=>a+gs.reduce((x,g)=>x+shAnWorkMoney(it,g.id),0),0);
  const shops={};(list||[]).forEach(it=>{shops[it.shopId||it.shop]=1;});
  return {nakl:(list||[]).length,qty:qty,money:money,shops:Object.keys(shops).length};
}

function shSverkaData(leId,from,to){
  const le=shLegalById(leId);
  const shops=store.shipShops.filter(s=>s.legalId===leId);
  const _svRecs=shipHistory.filter(h=>h.date>=from&&h.date<=to&&shAnLegalHas(leId,h));
  const goods=shMergeLocalGoods(store.shipGoods||[],_svRecs);

  const rows={};
  goods.forEach(g=>{rows[g.id]={name:g.name,unit:(g.unit||''),price:shGoodMeta(g).price,own:0};});
  const dayMap={},shopMap={};
  shipHistory.forEach(h=>{
    const sid=h.shopId||('n:'+h.shop);
    if(!shAnLegalHas(leId,h))return;
    if(h.date<from||h.date>to)return;
    const shp=shops.find(s=>s.id===h.shopId)||shopMap[sid];
    const sName=shp?shp.name:h.shop;
    const sAddr=shp?(shp.addr||''):'';
    const shpKey=sName+(sAddr?' — '+sAddr:'');
    if(!shopMap[shpKey])shopMap[shpKey]={name:sName,addr:sAddr,rows:{},own:0,list:[]};
    const sm=shopMap[shpKey];
    if(!dayMap[h.date])dayMap[h.date]={give:0,ret:0,own:0,shops:{}};
    sm.list.push(h.date);
    goods.forEach(g=>{
      const d=h.data&&h.data[g.id];
      if(!d)return;
      const net=(d.shipped||0)-(d.returned||0);
      const q=(d.shipped||0);
      const r=(d.returned||0);
      if(!sm.rows[g.id])sm.rows[g.id]={name:g.name,unit:(g.unit||''),shipped:0,ret:0,own:0};
      sm.rows[g.id].shipped+=q;
      sm.rows[g.id].ret+=r;
      sm.rows[g.id].own+=net;
      if(!dayMap[h.date].shops[shpKey])dayMap[h.date].shops[shpKey]=0;
      const p=shGoodMeta(g).price;
      if(p!=null&&net){
        rows[g.id].own+=Math.round(p*net);
        sm.own+=Math.round(p*net);
        dayMap[h.date].own+=Math.round(p*net);
      }
      dayMap[h.date].give+=q;dayMap[h.date].ret+=r;
    });
  });
  const days=Object.keys(dayMap).sort().map(d=>({date:d,own:dayMap[d].own,give:dayMap[d].give,ret:dayMap[d].ret,shops:Object.keys(dayMap[d].shops)}));
  const shopRows=Object.keys(shopMap).map(k=>({shop:shopMap[k].name,addr:shopMap[k].addr,own:shopMap[k].own,days:shopMap[k].list.filter((v,i,a)=>a.indexOf(v)===i).sort(),rows:shopMap[k].rows})).sort((a,b)=>b.own-a.own);
  const workRows=shAnWorkRows(from,to,leId);
  const _svPlanRecs=[];
  Object.keys(shipPlans||{}).forEach(d=>{ const ds=String(d).slice(0,10); if(ds<from||ds>to)return; (shipPlans[d]||[]).forEach(p=>{ if(p)_svPlanRecs.push(p); }); });
  const workGoods=shMergeLocalGoods(store.shipGoods||[],_svRecs.concat(_svPlanRecs));
  const work={list:workRows,goods:workGoods,rows:{},totalQty:0,totalMoney:0};
  workGoods.forEach(g=>{work.rows[g.id]={name:g.name,unit:(g.unit||''),qty:0,money:0};});
  workRows.forEach(it=>{workGoods.forEach(g=>{const q=shAnWorkQty(it,g.id);if(!q)return;const m=shAnWorkMoney(it,g.id);work.rows[g.id].qty+=q;work.rows[g.id].money+=m;work.totalQty+=q;work.totalMoney+=m;});});
  return {le,shops,goods,rows,days,shopRows,work};
}

function shSavePlan(){
  const fDate=$('shForecastDate')?$('shForecastDate').value:'';
  if(!fDate){alert('Выбери дату прогноза');return;}
  const el=$('shForecastResult');
  if(!el||el.style.display==='none'){alert('Сначала рассчитай прогноз');return;}
  const inputs=el.querySelectorAll('.sh-pred');
  if(!inputs.length){
    const cur=shipPlans[fDate]||[];
    if(!cur.length){ alert('План уже сохранён. Чтобы изменить — нажми ✏️ у строки или отметь магазины и «✏️ Редактировать отмеченные».'); return; }
    const ensured=cur.map(p=>(shEnsureNakl(fDate,p.shopId,p.shop,p.naklOrd)||{}).num);
    const uniq=[...new Set(ensured)].sort();
    alert('План уже сохранён. Накладные: № '+(uniq.join(', ')||'—')+'. Чтобы изменить данные — нажми ✏️ у строки или отметь магазины чекбоксами и «✏️ Редактировать отмеченные».');
    return;
  }
  const goods=store.shipGoods||[];
  const shopRows={};
inputs.forEach(inp=>{
    const sid=inp.dataset.sid, gid=inp.dataset.gid;
    if(inp.value==='')return;
    if(!shopRows[sid])shopRows[sid]={};
    shopRows[sid][gid]=+inp.value||0;
  });
  if(!Object.keys(shopRows).length){alert('Введи хотя бы одно значение по магазину');return;}
  const idToShop={};
  store.shipShops.forEach(s=>{idToShop[s.id]=s.name;});
  const oldPlan=shipPlans[fDate]||[];
  const oldMap={};
  oldPlan.forEach(p=>{oldMap[p.shopId||('n:'+p.shop)]=p;});
  const now=new Date().toISOString();
  const created=[],updated=[],unchanged=[];
  const merged={};
  Object.keys(shopRows).forEach(sid=>{
    const shop=idToShop[sid]||(sid.indexOf('n:')===0?sid.slice(2):sid);
    const op=oldMap[sid]||oldMap['n:'+shop]||null;
    const row=op?op:{};
    row.naklOrd=(op&&op.naklOrd)||1;
    const oldData=op?op.data||null:null;
    row.shopId=(sid.indexOf('n:')===0)?(op&&op.shopId?op.shopId:''):sid;
    row.shop=shop;
    row.data=Object.assign({},(op&&op.data)||{},shopRows[sid]);
    const reg=shEnsureNakl(fDate,sid,shop,row.naklOrd);
    if(!reg)return;
    row.naklNum=reg.num;
    merged[sid]=row;
    if(oldData===null){ created.push(reg.num); }
    else if(JSON.stringify(oldData)===JSON.stringify(row.data)){ unchanged.push(reg.num); }
    else { updated.push(reg.num); reg.mod=now; saveStore(); }
  });
  oldPlan.forEach(p=>{
    const sid=p.shopId||('n:'+p.shop);
    if(!merged[sid])merged[sid]=p;
  });
  const rows=Object.keys(merged).map(sid=>merged[sid]);
  shipPlans[fDate]=rows;
  saveShip();
  shFcDirty={};shFcDirtyData={};shFcEditRows={};
  let msg='✅ План сохранён.';
  if(created.length)msg+=' Накладные № '+created.join(', ')+' созданы.';
  if(updated.length)msg+=' Данные в накладных № '+updated.join(', ')+' обновлены.';
  if(!created.length&&!updated.length&&unchanged.length)msg='Данные не изменились, сохранение не требуется.';
  alert(msg);
  shCalcForecast(true);
}

function shShowAnalytics(){
  const from=$('shFromDate')?$('shFromDate').value:'';
  const to=$('shToDate')?$('shToDate').value:'';
  if(!from||!to){alert('Укажи период');return;}
  const fromDate=new Date(from), toDate=new Date(to);
  const filtered=shipHistory.filter(h=>{
    const ds=String(h.date||'').slice(0,10);
    return ds>=from&&ds<=to;
  });
  const planRecs=[];
  Object.keys(shipPlans||{}).forEach(d=>{ const ds=String(d).slice(0,10); if(ds<from||ds>to)return; (shipPlans[d]||[]).forEach(p=>{ if(p)planRecs.push(p); }); });
  const goodsAll=shMergeLocalGoods(store.shipGoods||[],filtered);
  const goodsWork=shMergeLocalGoods(store.shipGoods||[],filtered.concat(planRecs));
  let goods=goodsAll;
  const el=$('shAnalyticsResult');
  if(!el)return;
  const alarm=(store.shipSettings&&store.shipSettings.returnAlarm)||15;
  const daysDiff=Math.floor((toDate-fromDate)/86400000)+1;

  const giveCl='background:color-mix(in srgb,var(--ok) 10%,transparent);color:var(--ok);font-weight:600;text-align:center';
  const retCl='background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--danger);font-weight:600;text-align:center';
  const pctCl='background:var(--panel2);color:var(--muted);font-weight:700;text-align:center';
  const thSt='border:1px solid var(--line);padding:8px;background:var(--panel2)';
  const tdSt='border:1px solid var(--line);padding:6px 8px';
  function markPct(v){
    if(v>alarm)return 'background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger);font-weight:800;text-align:center';
    if(v>alarm/2)return 'background:color-mix(in srgb,var(--warn) 13%,transparent);color:var(--warn);font-weight:800;text-align:center';
    return 'background:color-mix(in srgb,var(--ok) 11%,transparent);color:var(--ok);font-weight:700;text-align:center';
  }
  const pctCell=pct=>'<td style="'+tdSt+';'+markPct(+pct)+'">'+pct+'%</td>';
  const gv=(h,gid)=>((h.data&&h.data[gid])?h.data[gid].shipped||0:0);
  const rt=(h,gid)=>((h.data&&h.data[gid])?h.data[gid].returned||0:0);
  const sumGive=h=>(goods.reduce((s,g)=>s+gv(h,g.id),0));
  const sumRet=h=>(goods.reduce((s,g)=>s+rt(h,g.id),0));
  const gUnit=g=>shGoodMeta(g).unit||'';
  /* П25: суммы аналитики — по цене накладной/контрагента, а не только справочника. */
  const anaPrice=(gid,h)=>shNaklPrice(h?h.date:'',h?h.shopId:'',h?h.shop:'',h?((shShops().find(s2=>s2&&s2.id===h.shopId)||{}).legalId||''):'',gid,h?h.naklOrd:1);
  const anaAvg=(gid,recs)=>{const list=(recs&&recs.length)?recs:filtered;let net=0,sum=0;list.forEach(h=>{const n=gv(h,gid)-rt(h,gid);if(n>0){net+=n;sum+=n*anaPrice(gid,h);}});return net>0?Math.round(sum/net*100)/100:anaPrice(gid,list[0]||null);};
  const recActive=h=>{const d=(h&&h.data)||{};return Object.keys(d).some(k=>{const v=d[k];return (v&&typeof v==='object')?((+v.shipped>0)||(+v.returned>0)):((+v)>0);});};
  goods=goodsAll.filter(g=>filtered.some(h=>recActive(h)&&((gv(h,g.id)>0)||(rt(h,g.id)>0))));
  const workRows=shAnWorkRows(from,to);
  const workTot=shAnWorkTotals(workRows,goodsAll);

  const shopMap={};
  filtered.forEach(h=>{
    const _shops=store.shipShops||[];
    const _shp=(h.shopId?_shops.find(x=>x.id===h.shopId):null)||_shops.find(x=>x.name===h.shop)||null;
    const key=h.shopId||(_shp?_shp.id:('n:'+h.shop));
    if(!shopMap[key])shopMap[key]={shop:_shp?_shp.name:h.shop,addr:_shp?(_shp.addr||''):'',records:[]};
    shopMap[key].records.push(h);
  });
  const shopKeys=Object.keys(shopMap).filter(k=>shopMap[k].records.some(recActive));
  function rowsTop(){
    return shopKeys.map(k=>{
      const recs=shopMap[k].records;
      const give=recs.reduce((a,h)=>a+sumGive(h),0),ret=recs.reduce((a,h)=>a+sumRet(h),0);
      return {shop:shopMap[k].shop,addr:shopMap[k].addr||'',pct:give>0?(ret/give*100):0,ret,give};
    }).sort((a,b)=>b.pct-a.pct);
  }

  function revFor(recs,gid){return Math.round(recs.reduce((a,h)=>a+(gv(h,gid)-rt(h,gid))*anaPrice(gid,h),0));}

  const builders={
    sum(){
      const totG=filtered.reduce((a,h)=>a+sumGive(h),0);

function drvIsJunkRow(a){

function drvParseRowCells(c){

  if(ai<0)return null;

  if(!addr||drvIsJunkRow(addr))return null;
  const vals=[];
  for(let i=ai+1;i<c.length;i++){
    const s=String(c[i]).trim();
    if(!s){vals.push(0);continue;}
    if(/^[—–-]+$/.test(s)){vals.push(0);continue;}
    if(/^\d+([.,]\d+)?$/.test(s))vals.push(+s.replace(',','.'));

function drvGraphForDay(d){
  const g=store.drvGraph;
  if(!g)return null;
  const dt=new Date((d||'')+'T12:00:00');
  if(isNaN(dt))return null;
  return g[['вс','пн','вт','ср','чт','пт','сб'][dt.getDay()]]||null;
}
function drvAddrKey(a){
  return String(a).toLowerCase().replace(/ё/g,'е').replace(/[^а-яa-z0-9]/g,'');
}
function drvAddrEq(a,b){
  const ka=drvAddrKey(a),kb=drvAddrKey(b);
  if(!ka||!kb)return false;
  if(ka===kb)return true;
  const s=ka.length<=kb.length?ka:kb,l=ka.length<=kb.length?kb:ka;
  return s.length>=8&&l.indexOf(s)>=0;
}
function drvGraphApply(d,rows){
  const g=drvGraphForDay(d);
  const st=drvStore();
  const mem=drvMem();
  const gEnt=Object.keys(g||{}).map(dn=>({dn,v:st.list.find(x=>x.name.toLowerCase()===dn.toLowerCase())})).filter(x=>x.v);
  const out=rows.map(r=>{
    let drv='';
    if(g){
      const hit=gEnt.find(x=>g[x.dn].some(a=>drvAddrEq(a,r.addr)));
      if(hit)drv=hit.v.id;
    }
    return {id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),addr:r.addr,g90:r.g90,g200:r.g200,drv:drv||mem[r.addr]||''};
  });
  if(g){
    const order={}; let i=0;
    Object.keys(g).forEach(dn=>g[dn].forEach(a=>{ const k=drvAddrKey(a); if(!(k in order))order[k]=i++; }));
    const ordFor=addr=>{
      const ka=drvAddrKey(addr); let best=-1,bl=0;
      Object.keys(order).forEach(k=>{
        const s=k.length<=ka.length?k:ka,l=k.length<=ka.length?ka:k;
        if(s.length>=8&&l.indexOf(s)>=0&&s.length>bl){bl=s.length;best=order[k];}
      });
      return best<0?1e9:best;
    };
    out.sort((a,b)=>ordFor(a.addr)-ordFor(b.addr));
  }
  return out;
}
function drvPlanQtyMap(date){
  const map={};
  try{
    const a=(typeof shG90==='function')?shG90():null;
    const b=(typeof shG200==='function')?shG200():null;
    if(!a&&!b)return map;
    const plans=(typeof shipPlans!=='undefined'&&shipPlans&&shipPlans[date])||[];
    plans.forEach(p=>{
      if(!p)return;
      const q90=a?(Math.max(0,Math.round(+((p.data||{})[a.id])||0))):0;
      const q200=b?(Math.max(0,Math.round(+((p.data||{})[b.id])||0))):0;
      if(!q90&&!q200)return;
      const sh=p.shopId?((store.shipShops||[]).find(x=>x&&x.id===p.shopId)):null;
      const keys=[];
      if(sh){ if(sh.addr)keys.push(sh.addr); if(sh.name)keys.push(sh.name); if(sh.name&&sh.addr)keys.push(sh.name+' '+sh.addr); }
      else if(p.shop)keys.push(p.shop);
      keys.forEach(k=>{ const kk=drvAddrKey(k); if(kk&&!(kk in map))map[kk]={g90:q90,g200:q200}; });
    });
  }catch(e){}
  return map;
}
function drvEnrichFromPlan(date,rows){
  try{
    const map=drvPlanQtyMap(date);
    const keys=Object.keys(map);
    if(!keys.length)return rows;
    return rows.map(r=>{
      if(r.g90||r.g200)return r;
      const kr=drvAddrKey(r.addr);
      let hit=null,bl=0;
      if(kr&&map[kr])hit=map[kr];
      else keys.forEach(k=>{
        const s=k.length<=kr.length?k:kr,l=k.length<=kr.length?kr:k;
        const min=(/\d/.test(s)?4:8);
        if(s.length>=min&&l.indexOf(s)>=0&&s.length>bl){bl=s.length;hit=map[k];}
      });
      return hit?Object.assign({},r,{g90:hit.g90,g200:hit.g200}):r;
    });
  }catch(e){ return rows; }
}
function drvShopQty(date,name,addr){
  try{
    const map=drvPlanQtyMap(date);
    const keys=Object.keys(map);
    if(!keys.length)return null;
    const cands=[drvAddrKey(addr),drvAddrKey(name+' '+addr),drvAddrKey(name)].filter(Boolean);
    for(const kr of cands){ if(map[kr])return map[kr]; }
    for(const kr of cands){
      let hit=null,bl=0;
      keys.forEach(k=>{
        const s=k.length<=kr.length?k:kr,l=k.length<=kr.length?kr:k;
        const min=(/\d/.test(s)?4:8);
        if(s.length>=min&&l.indexOf(s)>=0&&s.length>bl){bl=s.length;hit=map[k];}
      });
      if(hit)return hit;
    }
  }catch(e){}
  return null;
}
function drvDateInText(t){

  if(!m)return null;

  if(dd<1||dd>31||mm<1||mm>12)return null;

function drvDupKey(s){ const SP=String.fromCharCode(32); return String(s||'').trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,SP); }
function drvFindDups(rows){
  const seen={},list=[];
  rows.forEach(r=>{
    const k=drvDupKey(r.addr);
    if(seen[k]===undefined){ seen[k]=list.length; list.push({addr:r.addr,g90:+r.g90||0,g200:+r.g200||0,n:1}); }
    else{ const d=list[seen[k]]; d.g90+=+r.g90||0; d.g200+=+r.g200||0; d.n++; }
  });
  return list.filter(d=>d.n>1);
}
function drvAskDups(rows){

function drvMoveRow(d,id,dir){
  const rz=drvRz()[d]||[];
  const i=rz.findIndex(r=>r.id===id);
  if(i<0)return;
  const k=rz[i].drv||'';
  let j=i;
  do{ j+=dir; }while(j>=0&&j<rz.length&&((rz[j].drv||'')!==k));
  if(j<0||j>=rz.length)return;
  const t=rz[i]; rz[i]=rz[j]; rz[j]=t;
  let pi=0; rz.forEach(r=>{ if((r.drv||'')===k)r.pos=pi++; });
  try{ saveStore(); }catch(e){}
  drvShow();
}
function drvDropRow(d,srcId,dstId){
  if(srcId===dstId)return;
  const rz=drvRz()[d]||[];
  const i=rz.findIndex(r=>r.id===srcId);
  const j=rz.findIndex(r=>r.id===dstId);
  if(i<0||j<0)return;
  if((rz[i].drv||'')!==(rz[j].drv||''))return;
  const moving=rz.splice(i,1)[0];
  let k=rz.findIndex(r=>r.id===dstId);
  if(i<j)k++;
  rz.splice(k,0,moving);
  const grp=moving.drv||''; let pi=0;
  rz.forEach(r=>{ if((r.drv||'')===grp)r.pos=pi++; });
  try{ saveStore(); }catch(e){}
  drvShow();
}
async function drvSaveDayOrder(d){
  const st=drvStore();
  const all=drvAllRows(d,st);
  if(!all.length)return;
  const counters={}; const rows=[];
  all.forEach(r=>{
    const k=r.drv||''; counters[k]=counters[k]||0; const pos=counters[k]++;
    r.pos=pos;
    rows.push({id:r.id,rdate:d,addr:r.addr,g90:+r.g90||0,g200:+r.g200||0,drv:k,pos:pos});
    const rzx=drvRz(); const arr=rzx[d]=rzx[d]||[];
    if(!arr.some(x=>x.id===r.id))arr.push(r);
  });
  try{ saveStore(); }catch(e){}
  try{
    await supaUpsert('drv_rz','id',rows);
    alert('☁ Порядок на '+d.split('-').reverse().join('.')+' сохранён: '+rows.length+' строк.');
  }catch(e){ alert('Не удалось сохранить порядок: '+e.message); }
}
async function drvSyncRz(){
  try{
    const tomb=await drvTombIds();
    if(tomb.length){ drvDropIds(tomb); try{ saveStore(); }catch(_){}}
    const crz=await supaGet('drv_rz?select=*');
    const tset={}; tomb.forEach(i=>tset[i]=1);
    const rzx=drvRz();
    crz.forEach(c=>{
      if(tset[c.id])return;
      const dd=c.rdate;
      const arr=rzx[dd]=rzx[dd]||[];
      const ex=arr.find(x=>x.id===c.id);
      if(ex){ ex.drv=c.drv||''; if(typeof c.pos==='number')ex.pos=c.pos; }
      else arr.push({id:c.id,addr:c.addr,g90:+c.g90||0,g200:+c.g200||0,drv:c.drv||'',pos:(typeof c.pos==='number'?c.pos:undefined)});
    });
    Object.keys(rzx).forEach(dd=>{ if(!rzx[dd]||!rzx[dd].length)delete rzx[dd]; });
    try{ saveStore(); }catch(_){}
  }catch(_){}
}

function drvPageUrl(name){

function drvCopyLink(name){
  const url=drvPageUrl(name);
  const done=()=>alert('Ссылка скопирована:\n'+url);
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done).catch(()=>{ prompt('Скопируйте ссылку вручную:',url); });
    }else{
      const ta=document.createElement('textarea');
      ta.value=url; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); done(); }catch(e){ prompt('Скопируйте ссылку вручную:',url); }
      document.body.removeChild(ta);
    }
  }catch(e){ prompt('Скопируйте ссылку вручную:',url); }
}

function drvRzEditRow(d,id){

  const a=prompt('Адрес:',r.addr||'');
  if(a===null)return;

  const n200=prompt('Количество 200г:',String(r.g200||0));

function renderZak(){
