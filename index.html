<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Калькуляшка Про</title>
<hta:application id="oApp"
  applicationname="Калькуляшка Про"
  singleinstance="yes"
  scroll="no"
/>
<style id="thStyles"></style>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; }
  body {
    margin:0; color:var(--txt); font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 700px at 20% -10%,var(--panel2) 0%,var(--bg) 55%);
    height:auto; min-height:100vh; overflow:auto;
  }
  .app { max-width:1120px; width:100%; margin:0 auto; padding:12px 16px 16px; min-height:100vh; display:flex; flex-direction:column; gap:10px; }

  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .logo { width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:var(--shadow); color:#fff; flex:none; }
  .hd { margin-right:auto; }
  header h1 { margin:0; font-size:18px; }
  .sub { color:var(--muted); font-size:11px; }
.tabs { display:flex; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:4px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tab { border:none; background:transparent; color:var(--muted); padding:11px 16px; font-size:15px; border-radius:10px; cursor:pointer; font-weight:600; white-space:nowrap; flex:none; }
.tab.active { background:var(--accent); color:#fff; }

  /* Отгрузки и модалки: крупные поля ввода — удобнее на телефоне */
  #pane-ship input[type="text"],#pane-ship input[type="number"],#pane-ship input[type="date"],
  #pane-ship select,#pane-ship textarea,
  .modal-back .modal input[type="text"],.modal-back .modal input[type="number"],
  .modal-back .modal select,.modal-back .modal textarea { font-size:15px; min-height:44px; }
  #pane-ship .btn { min-height:40px; font-size:14px; }
  #pane-ship .btn.sm { min-height:30px; font-size:12px; }
  #pane-ship input[type="checkbox"] { min-height:0; }
  #pane-ship .sh-drop input[type="text"] { min-height:40px; }
  #pane-ship table input[type="number"] { min-height:42px; }

  /* ============ Выпадающие списки: белые, для контраста ============ */
  .sh-drop, .sh-pyat-drop { background:#fff!important; color:#111!important; border-color:#cfd4dd!important; }
  .sh-drop .sh-drop-row, .sh-pyat-drop > div { color:#111!important; border-bottom-color:#e5e8ee!important; }
  .sh-drop .sh-drop-row:hover, .sh-pyat-drop > div:hover { background:#eef3fb!important; }
  select option { background:#fff!important; color:#111!important; }
  #naklFullShopInp, #naklFullLegalInp, #shDispShop { background:#fff!important; color:#111!important; border-color:#cfd4dd!important; }
  #naklFullShopInp::placeholder, #naklFullLegalInp::placeholder, #shDispShop::placeholder { color:#8a93a6!important; }
  #pane-ship select, .modal-back .modal select, #naklFullRows .nakl-add-sel { background:#fff!important; color:#111!important; border-color:#cfd4dd!important; }
  input[type="date"], input[type="datetime-local"], input[type="time"] { background:#fff!important; color:#111!important; border-color:#cfd4dd!important; color-scheme:light; }
  input[type="date"]::-webkit-calendar-picker-indicator, input[type="datetime-local"]::-webkit-calendar-picker-indicator, input[type="time"]::-webkit-calendar-picker-indicator { filter:none; opacity:.75; cursor:pointer; }
  input[type="date"]::-webkit-datetime-edit, input[type="datetime-local"]::-webkit-datetime-edit, input[type="time"]::-webkit-datetime-edit { color:#111; }
  #naklFullShopBox, #naklFullLegalBox, #naklFullGoodBox { background:#fff!important; color:#111!important; }
  #naklFullShopBox input, #naklFullShopBox select, #naklFullLegalBox input, #naklFullGoodBox input, #naklFullGoodBox select { background:#fff!important; color:#111!important; border:1px solid #cfd4dd!important; }
  #naklFullShopBox input::placeholder, #naklFullLegalBox input::placeholder, #naklFullGoodBox input::placeholder { color:#8a93a6!important; }
  /* ============ Живой подвал ============ */
  .app { padding-bottom:130px; }
  .app.no-cellar { padding-bottom:0; }
  .cg-sig-mini { display:none; margin-top:auto; flex:none; text-align:center; padding:3px 0 1px; font-size:11px; font-weight:700; letter-spacing:.03em; color:var(--muted);
    border-top:1px solid var(--line); }
  .app.no-cellar .cg-sig-mini { display:block; }
  .cg-scene { position:relative; left:auto; right:auto; bottom:auto; width:100%; height:130px; z-index:5; pointer-events:none; overflow:hidden;
    margin-top:auto; flex:none; border-radius:12px; box-shadow:inset 0 0 0 1px var(--line), var(--shadow); }
  .cg-scene:before { content:''; position:absolute; inset:0; z-index:0;
    background:
      linear-gradient(rgba(0,0,0,.30), rgba(0,0,0,.55)),
      repeating-linear-gradient(0deg, color-mix(in srgb,var(--panel2) 82%,#000) 0 11px, rgba(0,0,0,.28) 11px 14px),
      repeating-linear-gradient(90deg, transparent 0 34px, var(--line) 34px 36px, transparent 36px 40px);
    box-shadow:inset 0 6px 14px rgba(0,0,0,.45); }
  .cg-scene.dim:before { background:
      linear-gradient(rgba(0,0,0,.72), rgba(0,0,0,.82)),
      repeating-linear-gradient(0deg, color-mix(in srgb,var(--panel2) 82%,#000) 0 11px, rgba(0,0,0,.28) 11px 14px),
      repeating-linear-gradient(90deg, transparent 0 34px, var(--line) 34px 36px, transparent 36px 40px); }

  /* Кнопка демо: прогнать все сценки маскота */
  .cg-demo { position:absolute; left:6px; top:4px; z-index:7; pointer-events:auto; cursor:pointer;
    width:22px; height:18px; padding:0; border:1px solid var(--line); border-radius:4px;
    background:color-mix(in srgb,var(--panel) 85%,transparent); color:var(--accent2);
    font-size:10px; line-height:1; box-shadow:var(--shadow); opacity:.7; }
  .cg-demo:hover { opacity:1; filter:brightness(1.1); }
  .cg-demo.on { background:var(--accent); color:#fff; border-color:var(--accent); opacity:1; }

  /* Пол (деревянная доска) */
  .cg-scene:after { content:''; position:absolute; left:0; right:0; bottom:0; height:13px; z-index:1;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.14) 0 2px, transparent 2px 60px),
      linear-gradient(180deg, color-mix(in srgb,var(--panel) 70%,#5a4220), color-mix(in srgb,var(--bg) 55%,#3a2a12));
    border-top:1px solid rgba(0,0,0,.5); }

  /* Лампочка на проводе (ниже, чтобы не мешать табличке) */
  .cg-lamp { position:absolute; top:0; left:50%; transform:translateX(-50%); width:16px; height:50px; z-index:3; pointer-events:auto; cursor:pointer; }
  .cg-lamp:before { content:''; position:absolute; left:7px; top:0; width:2px; height:34px; background:rgba(20,20,30,.7); }
  .cg-lamp:after { content:''; position:absolute; left:1px; top:33px; width:14px; height:16px; border-radius:50% 50% 46% 46%; background:radial-gradient(circle at 50% 32%, #fff8d8, #ffd05e 60%, #b37a1e); box-shadow:0 0 20px 10px rgba(255,190,80,.5); }
  .cg-scene.dim .cg-lamp:after { background:radial-gradient(circle at 50% 32%, #6a6a70, #3c3c42 60%, #232329); box-shadow:none; }

  /* Световое пятно от лампы */
  .cg-light { position:absolute; left:50%; top:0; transform:translateX(-50%); width:420px; height:104px; z-index:2; background:radial-gradient(ellipse at 50% 0%, rgba(255,214,140,.16), transparent 66%); animation:cgFlicker 4.2s infinite; }
  .cg-scene.dim .cg-light { opacity:0; animation:none; }
  @keyframes cgFlicker { 0%,100%{opacity:1} 42%{opacity:.86} 43%{opacity:1} 70%{opacity:.93} 71%{opacity:1} 88%{opacity:.78} 89%{opacity:1} }

  /* Паутины в углах */
  .cg-web { position:absolute; top:0; z-index:2; opacity:.9; pointer-events:auto; cursor:pointer; }
  .cg-web-l { left:120px; }
  .cg-web-r { right:120px; transform:scaleX(-1); }
  .cg-web line, .cg-web path { stroke:rgba(225,225,235,.4); stroke-width:1; fill:none; }

  /* Паук на нити */
  .cg-spider { position:absolute; left:164px; top:16px; width:8px; height:8px; z-index:4; border-radius:50%; background:#12141c; animation:cgSpider 14s ease-in-out infinite; pointer-events:auto; cursor:pointer;
    box-shadow:2px -2px 0 -2px #12141c, -2px -2px 0 -2px #12141c, 3px 2px 0 -2px #12141c, -3px 2px 0 -2px #12141c, 2px 4px 0 -2px #12141c, -2px 4px 0 -2px #12141c; }
  @keyframes cgSpider { 0%,100%{ transform:translateY(0);} 45%{ transform:translateY(0);} 60%{ transform:translateY(44px);} 75%{ transform:translateY(44px);} 90%{ transform:translateY(0);} }

  /* Полка с банками (углублена в полку) */
  .cg-shelf { position:absolute; left:10px; top:66px;pointer-events:auto;cursor:pointer; width:100px; height:15px; z-index:2;
    background:linear-gradient(180deg, color-mix(in srgb,var(--panel) 55%,#6a5328), #3a2c14); border-radius:2px; opacity:.95;
    box-shadow:0 3px 6px rgba(0,0,0,.45); }
  .cg-jar { position:absolute; bottom:11px; width:18px; height:26px; border-radius:3px; background:linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,.10)); box-shadow:inset 0 0 0 1px rgba(255,255,255,.22); }
  .cg-jar:before { content:''; position:absolute; left:3px; top:-5px; right:3px; height:5px; border-radius:2px; background:color-mix(in srgb,var(--accent) 55%,#8a6a30); }
  .cg-jar:nth-child(1){ left:5px; top:6px; }
  .cg-jar:nth-child(2){ left:40px; top:6px; background:linear-gradient(180deg, rgba(255,180,120,.5), rgba(255,180,120,.2)); }
  .cg-jar:nth-child(3){ left:75px; top:6px; background:linear-gradient(180deg, rgba(140,200,120,.5), rgba(140,200,120,.2)); }
  .cg-jar:after { content:''; position:absolute; left:3px; top:6px; right:3px; bottom:3px; border-radius:2px; background:rgba(255,255,255,.18); }

  /* Девиз-табличка на стене (крупная, слева) */
  .cg-sig { position:absolute; left:50%; transform:translateX(-50%); top:52px; z-index:2; padding:2px 10px 3px; border-radius:4px; white-space:nowrap;
    font-size:13px; font-weight:800; letter-spacing:.02em; color:#ffe9a8;
    background:linear-gradient(180deg,#8a6a30,#5a4218);
    border:1px solid #33250c; box-shadow:0 2px 5px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,230,150,.25); animation:cgSigSway 7s ease-in-out infinite; }
  @keyframes cgSigSway { 0%,100%{ transform:translateX(-50%) rotate(-.5deg); } 50%{ transform:translateX(-50%) rotate(.5deg); } }

  /* Картина на стене в центре */
  .cg-pic { position:absolute; left:50%;pointer-events:auto;cursor:pointer; transform:translateX(-50%); top:76px; width:54px; height:40px; z-index:2; border-radius:2px;
    background:linear-gradient(180deg,#8a6a30,#5a4218); border:3px solid #3a2a10; box-shadow:0 3px 7px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,230,150,.2); }
  .cg-pic i { position:absolute; inset:0; border-radius:1px;
    background:
      radial-gradient(circle at 78% 22%, #ffe9a0 0 3px, transparent 4px),
      linear-gradient(180deg, #7db8d9 0 55%, #5a8a3a 55% 80%, #8a6a30 80%); }
  .cg-pic:after { content:''; position:absolute; left:6px; right:6px; top:30px; height:2px; background:rgba(255,255,255,.18); }

  /* Столик с чашкой */
  .cg-table { position:absolute; right:76px;pointer-events:auto;cursor:pointer; bottom:13px; width:52px; height:15px; z-index:2;
    background:linear-gradient(180deg, color-mix(in srgb,var(--panel) 55%,#6a5328), #3a2c14); border-radius:2px; box-shadow:0 3px 6px rgba(0,0,0,.4); }
  .cg-cup { position:absolute; left:16px; top:-13px; width:18px; height:14px; border-radius:2px 2px 4px 4px; background:linear-gradient(180deg, #f0e8dc, #c9bda6); }
  .cg-cup:before { content:''; position:absolute; right:-6px; top:2px; width:6px; height:8px; border:2px solid #c9bda6; border-left:none; border-radius:0 3px 3px 0; }
  .cg-code { position:absolute; display:none; z-index:5; font-size:9px; font-weight:900; color:#fff; background:rgba(20,20,20,.55); border-radius:6px; line-height:1; padding:1.5px 3px; pointer-events:none; text-shadow:0 1px 1px rgba(0,0,0,.4); }
  .cg-scene.codes .cg-code { display:block; }
  .cg-cup .cg-code { left:15px; top:-3px; }
  .cg-books .cg-code { left:42px; top:20px; }
  .cg-dumbbell .cg-code { left:17px; top:-9px; }
  .cg-plant .cg-code { left:8px; top:-6px; }
  .cg-cup:after { content:''; position:absolute; left:4px; top:-6px; width:10px; height:7px; background:radial-gradient(ellipse at 50% 100%, rgba(190,190,200,.85) 30%, transparent 72%); filter:blur(.5px); animation:cgSteam 1.9s ease-out infinite; }
  @keyframes cgSteam { 0%{ transform:translateY(2px) scale(.7) ; opacity:0;} 35%{ opacity:.9;} 100%{ transform:translateY(-12px) scale(1.5); opacity:0;} }

  /* Кроватка — деревянная с изголовьем и пледом */
  .cg-bed { position:absolute; right:8px;pointer-events:auto;cursor:pointer; bottom:13px; width:60px; height:24px; z-index:2; border-radius:3px;
    background:linear-gradient(180deg,#7a5f36,#543b1c); border:1px solid #2e2210; box-shadow:0 3px 6px rgba(0,0,0,.45); }
  .cg-bed:before { content:''; position:absolute; left:0; top:-9px; width:7px; height:33px; border-radius:2px;
    background:linear-gradient(90deg,#8a6c3d,#5a431f); border:1px solid #2e2210; }
  .cg-bed:after { content:''; position:absolute; right:3px; top:4px; bottom:3px; left:12px; border-radius:3px;
    background:repeating-linear-gradient(80deg, color-mix(in srgb,var(--accent) 78%,#fff) 0 8px, color-mix(in srgb,var(--accent2) 78%,#fff) 8px 16px); opacity:.9; }

  /* Часы настенные — показывают реальное время */
  .cg-clock { position:absolute; right:186px; top:13px; z-index:2; pointer-events:auto; cursor:pointer;
    background:linear-gradient(180deg,#3a2b16,#2a1e10); border:2px solid #4a341a; border-radius:4px;
    padding:1px; box-shadow:0 2px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,220,140,.4); }
  .cg-clock .cg-lcd { display:block; font:700 11px/1 'Courier New',monospace; letter-spacing:1px; color:#e6ffe6;
    background:linear-gradient(180deg,#123812,#0d2a0d); border:1px solid #4b7a3b;
    padding:2px 4px; border-radius:3px; box-shadow:inset 0 0 4px rgba(160,255,150,.35);
    text-shadow:0 0 4px rgba(120,255,110,.9); white-space:nowrap; }
  .cg-clock .cg-lcd { position:absolute; left:50%; top:50%; width:22px; height:10px; margin:-5px 0 0 -11px; z-index:3; text-align:center; line-height:10px;
    background:linear-gradient(180deg,#1a2a1a,#0e1a0e); border:1px solid #223522; border-radius:2px;
    box-shadow:inset 0 0 3px rgba(0,0,0,.7), 0 1px 2px rgba(0,0,0,.3); color:#c6f7a0; }
  .cg-clock .cg-lcd:after { content:''; position:absolute; inset:1px; pointer-events:none;
    background:linear-gradient(rgba(255,255,255,.05),rgba(0,0,0,.15)); border-radius:1px; }

  /* Комод с ящиками (слева под полкой) */
  .cg-dresser { position:absolute; left:8px;pointer-events:auto;cursor:pointer; bottom:13px; width:52px; height:34px; z-index:2; border-radius:2px;
    background:linear-gradient(180deg,#7a5f36,#543b1c); border:1px solid #2e2210; box-shadow:0 3px 6px rgba(0,0,0,.45); }
  .cg-dresser:before { content:''; position:absolute; left:3px; right:3px; top:8px; height:1px; background:rgba(0,0,0,.55); box-shadow:0 8px 0 rgba(0,0,0,.55); }
  .cg-dresser:after { content:''; position:absolute; left:50%; top:4px; margin-left:-2px; width:4px; height:2px; border-radius:1px; background:#e9d9ac;
    box-shadow:0 8px 0 #a88b52, 0 16px 0 #e9d9ac, 0 24px 0 #a88b52; }

  /* Швабра на стене (справа над столиком) */
  .cg-mop { position:absolute; right:70px; top:24px; width:4px; height:38px; z-index:2; border-radius:2px; pointer-events:auto; cursor:pointer;
    background:linear-gradient(180deg,#8a6a30,#5a4020); transform:rotate(6deg); transform-origin:50% 100%; box-shadow:inset -1px 0 0 rgba(255,255,255,.15); }
  .cg-mop:before { content:''; position:absolute; left:-5px; top:0; width:14px; height:3px; border-radius:2px; background:#443017; box-shadow:3px -2px 0 -1px #2e2210; }
  .cg-mop:after { content:''; position:absolute; left:-7px; bottom:0; width:18px; height:9px; border-radius:2px; background:linear-gradient(180deg,#c9a23e,#8a6a30);
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.35); }

  /* Ведро в углу у сетки */
  .cg-bucket { position:absolute; right:168px; bottom:13px; width:20px; height:17px; z-index:2; border-radius:2px; pointer-events:auto; cursor:pointer;
    background:linear-gradient(180deg,#4a5868,#303a46); border:1px solid #1c212b; box-shadow:0 2px 4px rgba(0,0,0,.4); }
  .cg-bucket:before { content:''; position:absolute; left:-1px; right:-1px; top:-2px; height:3px; border-radius:2px; background:linear-gradient(180deg,#cdd6df,#8b96a3); }
  .cg-bucket:after { content:''; position:absolute; left:50%; top:-5px; margin-left:-2px; width:4px; height:4px; border-radius:50%; background:#8b6a30; box-shadow:0 0 3px rgba(0,0,0,.4); }

  /* Коробки в углу сцены (справа на полу) */
  .cg-box { position:absolute; right:150px; bottom:13px; width:22px; height:14px; z-index:2; border-radius:1px; pointer-events:auto; cursor:pointer;
    background:linear-gradient(180deg,#c9a263,#9a743e); border:1px solid #5a4020; box-shadow:0 2px 4px rgba(0,0,0,.4); }
  .cg-box:before { content:''; position:absolute; left:5px; top:-10px; width:22px; height:14px; border-radius:1px;
    background:linear-gradient(180deg,#a8834a,#805f2e); border:1px solid #4a341a; box-shadow:0 2px 4px rgba(0,0,0,.4); }
  .cg-box:after { content:''; position:absolute; left:0; top:-10px; width:2px; height:10px; background:rgba(0,0,0,.25); }

  /* Полка с книжками на стене (над комодом) */
  .cg-books { position:absolute; left:120px; top:14px; width:40px; height:19px; z-index:2; pointer-events:auto; cursor:pointer; }
  .cg-book { position:absolute; bottom:0; width:9px; border-radius:1px 1px 0 0; box-shadow:inset 2px 0 0 rgba(255,255,255,.16); }
  .cg-book:nth-child(1){ left:1px; height:15px; background:linear-gradient(90deg,#8a5a3a,#a06a45); }
  .cg-book:nth-child(2){ left:10px; height:11px; background:linear-gradient(90deg,#3a5a8a,#4a6fa8); }
  .cg-book:nth-child(3){ left:19px; height:17px; background:linear-gradient(90deg,#2f7a4a,#3d8f5e); }
  .cg-book:nth-child(4){ left:28px; height:13px; background:linear-gradient(90deg,#8a7a2f,#9d8c3a); }
  .cg-book:after { content:''; position:absolute; left:0; right:0; top:25%; height:1px; background:rgba(255,255,255,.25); }
  .cg-books:after { content:''; position:absolute; left:-2px; right:-2px; bottom:-2px; height:3px; border-radius:1px;
    background:linear-gradient(180deg,#6a5328,#3a2c14); box-shadow:0 2px 3px rgba(0,0,0,.4); }

  /* Ящик с овощами (сырьё) на полу */
  .cg-crate { position:absolute; left:176px; bottom:13px; width:30px; height:18px; z-index:2; pointer-events:auto; cursor:pointer;
    background:repeating-linear-gradient(90deg,#c9a263 0 12px,#8a6a30 12px 14px); border:1px solid #5a4020;
    box-shadow:0 3px 5px rgba(0,0,0,.4); }
  .cg-crate:before { content:''; position:absolute; left:3px; top:-6px; width:10px; height:9px; border-radius:50% 50% 55% 55%;
    background:radial-gradient(circle at 35% 30%, #ffa06a, #c94a1e); box-shadow:inset 0 -2px 0 rgba(0,0,0,.15); }
  .cg-crate:after { content:''; position:absolute; right:2px; top:-5px; width:11px; height:8px; border-radius:1px;
    background:linear-gradient(180deg,#efd94a,#b8941e); box-shadow:inset 0 -2px 0 rgba(0,0,0,.12); }

  /* Цветок в горшке у коврика */
  .cg-plant { position:absolute; left:302px; bottom:13px; width:18px; height:28px; z-index:2; pointer-events:auto; cursor:pointer; }
  .cg-plant:before { content:''; position:absolute; left:2px; bottom:0; width:14px; height:9px; border-radius:2px 2px 3px 3px;
    background:linear-gradient(180deg,#b0553a,#7a3320); box-shadow:0 2px 4px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.18); }
  .cg-plant:after { content:''; position:absolute; left:5px; bottom:7px; width:8px; height:15px; border-radius:50% 50% 40% 40%; transform:rotate(-14deg);
    background:linear-gradient(180deg,#4da55e,#2f7a45); box-shadow:8px 5px 0 -2px #47a05a, -3px 6px 0 -3px #357a45; }

  /* Гантелька под отжимания */
  .cg-dumbbell { position:absolute; left:248px; bottom:13px; width:24px; height:7px; z-index:2; pointer-events:auto; cursor:pointer; }

  /* Состояние: отжимается */

  /* Тап-анимации маскота + эмоция */

  .calcguy.cg-squash { animation: cgSquash .6s ease !important; }
  .calcguy.cg-float { animation: cgFloat 1s ease !important; }

  @keyframes cgWink { 0%{transform:scale(1,1);} 20%{transform:scale(1.04,.97) rotate(-3deg);} 40%{transform:scale(1,1);} 100%{transform:scale(1,1);} }

  .pane { display:none; }
  .pane.active { display:flex; flex-direction:column; animation:fade .15s ease; }
  @keyframes fade { from{opacity:0} to{opacity:1} }

  .card { background:var(--panel); border:1px solid var(--line); border-radius:13px; box-shadow:var(--shadow); }

  /* Калькулятор: 2 колонки без скролла */
  .calc-box { display:grid; grid-template-columns:320px 1fr; gap:12px; min-height:0; flex:1; }
  @media (max-width:760px){ .calc-box { grid-template-columns:1fr; } }
  /* ============ Отгрузки: крупные поля и кнопки — удобно на телефоне ============ */
  #pane-ship input,#pane-ship select,#pane-ship textarea { font-size:16px!important; border-radius:9px; }
  #pane-ship input[type="text"],#pane-ship input[type="number"],#pane-ship input[type="date"],
  #pane-ship select,#pane-ship textarea { padding:9px 8px!important; min-height:44px; }
  #pane-ship input[type="number"] { min-height:40px; }

  #pane-ship input[type="checkbox"] { min-height:0!important; }
  #pane-ship .btn { min-height:46px; font-size:15px; padding:10px 14px; }
  #pane-ship .btn.sm { min-height:36px; font-size:13px; padding:7px 10px; }
  #pane-ship .sh-drop { min-height:0!important; }
  #pane-ship .frow select { min-height:44px; }
  /* Просто прóзрачно: поля в модалках тоже крупнее */
  .modal-back .modal input:not([type="checkbox"]),.modal-back .modal select,.modal-back .modal textarea { font-size:16px!important; padding:10px 10px!important; min-height:46px; border-radius:9px; }
  /* ============ Отгрузки: крупные поля ввода (удобно на телефоне) ============ */
  #pane-ship input[type="text"],#pane-ship input[type="number"],#pane-ship input[type="date"],
  #pane-ship select,#pane-ship textarea,
  .modal-back .modal input[type="text"],.modal-back .modal input[type="number"],
  .modal-back .modal select,.modal-back .modal textarea {
    font-size:16px!important; padding:10px 10px!important; min-height:48px;
    -webkit-appearance:none; border-radius:9px;
  }
  #pane-ship input[type="number"].sh-pred { min-height:48px; }
  #pane-ship input[type="checkbox"] { min-height:0; }
  #pane-ship .btn { min-height:46px; font-size:15px; padding:10px 14px; }
  #pane-ship .btn.sm { min-height:34px; font-size:13px; padding:6px 10px; }
  #pane-ship .icon-del,#pane-ship .icon-rm,#pane-ship .icon-add { min-height:40px; width:40px; font-size:17px; }
  #pane-ship input[type="date"] { -webkit-appearance:none; }
  /* ============ Аналитика: список «Блок:» — на всю ширину, со стрелкой ============ */
  #pane-ship #shAnTab {
    -webkit-appearance:none!important; -moz-appearance:none!important; appearance:none!important;
    width:100%!important; max-width:none!important;
    font-size:15px!important; min-height:46px!important;
    padding:10px 42px 10px 12px!important;
    background-color:var(--panel2)!important; color:var(--txt)!important;
    border:1px solid var(--line)!important; border-radius:10px!important;
    cursor:pointer!important;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'%3E%3Cpath d='M1 1l6 6 6-6' fill='none' stroke='%235c6470' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E")!important;
    background-repeat:no-repeat!important;
    background-position:right 14px center!important;
    background-size:14px 9px!important;
  }
  #pane-ship #shAnTab:hover { border-color:var(--accent)!important; }
  #pane-ship #shAnTab:focus { outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent); outline-offset:1px; }
  .calc-left { display:flex; flex-direction:column; gap:10px; min-height:0; overflow:auto; }
  .calc-left .grow { flex:1; min-height:0; display:flex; flex-direction:column; }
  .calc-left .grow > div:last-child { margin-top:auto; }
  label { display:block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 4px; }
  select,input { width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:8px; font-size:14px; }
  select:focus,input:focus { outline:none; border-color:var(--accent); }
  .frow { margin-bottom:10px; }
  .row2 { display:flex; gap:8px; }
  .row2 > div { flex:1; }
.btn { border:none; border-radius:8px; padding:9px 12px; font-size:13px; cursor:pointer; color:var(--txt); }
  .btn.ghost { background:var(--panel2); border:1px solid var(--line); }
  .btn.acc { background:var(--accent); color:#fff; width:100%; font-weight:700; }
  .btn.go { background:var(--accent); color:#fff; font-weight:700; }
  .btn.ok { background:var(--ok); color:#fff; }
  .btn.view { background:color-mix(in srgb,var(--accent2) 20%,var(--panel2)); color:var(--txt); border:1px solid color-mix(in srgb,var(--accent2) 45%,transparent); }
  .btn.copy { background:color-mix(in srgb,var(--warn) 20%,var(--panel2)); color:var(--txt); border:1px solid color-mix(in srgb,var(--warn) 45%,transparent); }
  .btn.print { background:color-mix(in srgb,var(--accent) 16%,var(--panel2)); color:var(--txt); border:1px solid color-mix(in srgb,var(--accent) 45%,transparent); }
  .btn.danger { background:var(--danger); color:#fff; }

  .btn.sm { padding:6px 9px; font-size:12px; }
  .preset { border:1px solid var(--line); background:var(--panel2); color:var(--txt); border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer; font-weight:600; }
  .preset:hover { border-color:var(--accent); color:var(--accent2); }

  /* Результат */
  .calc-right { min-height:0; display:flex; flex-direction:column; }
  .res-head { display:flex; justify-content:space-between; align-items:center; padding:12px 14px 0; gap:8px; }

  .total { display:flex; gap:20px; flex-wrap:wrap; padding:14px 14px 12px; border-bottom:1px solid var(--line);
    background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,transparent),transparent); }

  .ing-cost { text-align:right; color:var(--accent2); font-weight:600; }

  /* Закуп */
  .buy-prod-list { display:flex; flex-direction:column; gap:6px; max-height:52vh; overflow:auto; }
  .buy-prod { display:flex; align-items:center; gap:8px; padding:7px 8px; border:1px solid var(--line); border-radius:9px; background:var(--panel2); }
  .buy-qty { width:64px; padding:6px; font-size:14px; text-align:center; flex:none; }

  .buy-check input { position:absolute; opacity:0; width:0; height:0; }
  .buy-check span { display:block; width:22px; height:22px; border:2px solid var(--accent2); border-radius:6px; background:transparent; transition:.15s; }
  .buy-check input:checked + span { background:var(--ok); border-color:var(--ok); position:relative; }
  .buy-check input:checked + span:after { content:"✓"; color:#fff; font-size:15px; font-weight:700; position:absolute; inset:0; display:grid; place-items:center; }
  .buy-item { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); }

  .hist-p-head { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; cursor:pointer; }

  .help-sec.hd td:last-child { color:var(--muted); }

let _scaleTimer=null,_scaleSaving=false,_scaleDirty=false,_scaleActive=false,_scaleLoading=false,_scaleWarned=false,_scaleAt=0,_scalePendingSave=false;
function scaleFlagOn(){ try{ const v=JSON.parse(localStorage.getItem(SCALE_FLAG)||'null'); return !!(v&&v.enabled); }catch(e){ return false; } }
function scaleSetFlag(on){ try{ if(on)localStorage.setItem(SCALE_FLAG,JSON.stringify({enabled:true,at:Date.now()})); else localStorage.removeItem(SCALE_FLAG); }catch(e){} }
function scaleCanUse(){ try{ return typeof indexedDB!=='undefined'&&!!indexedDB; }catch(e){ return false; } }
function scaleActive(){ return _scaleActive||scaleFlagOn(); }
function scaleSnapshot(){ return {app:'recipeCalc',v:4,at:Date.now(),store:store,buy:buy,buyRaw:buyRaw,buyHist:buyHist,plans:plans,purchases:purchases,shipHistory:shipHistory,shipPlans:shipPlans}; }
function scaleWarn(e){ if(_scaleWarned)return; _scaleWarned=true; try{ setTimeout(function(){alert('Не удалось сохранить большие данные в хранилище браузера: '+((e&&e.message)||e)+String.fromCharCode(10)+'Сделай копию в файл.'); },0); }catch(_){} }
function scaleActivate(){ if(!scaleCanUse())return false; _scaleActive=true; scaleSetFlag(true); return true; }
async function scaleSaveNow(){ if(!_scaleActive||_scaleLoading)return false; try{ const snap=scaleSnapshot(); await idbSet(SCALE_IDB_KEY,snap); _scaleAt=snap.at||Date.now(); scaleSetFlag(true); scaleAfterSaved(); return true; }catch(e){ scaleWarn(e); return false; } }
function scaleAfterSaved(){ try{ [STORE_KEY,SHIP_KEY,BACKUP_KEY,BUY_KEY,PUR_KEY,PLAN_KEY,'recipeCalc.buyhist.v1'].forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} }); }catch(e){} }
async function scaleFlush(){ if(_scaleSaving)return; _scaleSaving=true; try{ while(_scaleDirty){ _scaleDirty=false; const ok=await scaleSaveNow(); if(!ok){ _scaleDirty=true; break; } } } finally { _scaleSaving=false; } }
function queueScaleSave(){ if(!_scaleActive||_scaleLoading){ if(_scaleLoading)_scaleDirty=true; return; } _scaleDirty=true; if(_scaleTimer)clearTimeout(_scaleTimer); _scaleTimer=setTimeout(function(){ _scaleTimer=null; scaleFlush(); },400); }
try{ if(typeof window!=='undefined'&&window.addEventListener)window.addEventListener('pagehide',function(){ if(!_scaleActive||_scaleLoading)return; _scaleDirty=true; scaleFlush(); }); }catch(e){}
try{ if(typeof window!=='undefined'&&window.addEventListener&&typeof document!=='undefined'&&document.addEventListener)document.addEventListener('visibilitychange',function(){ if(document.visibilityState!=='hidden')return; if(!_scaleActive||_scaleLoading)return; if(_scaleTimer){ clearTimeout(_scaleTimer); _scaleTimer=null; } _scaleDirty=true; scaleFlush(); }); }catch(e){}
function scaleLoaderShow(){ try{ if(!document||!document.body||document.getElementById('scaleLoad'))return; const o=document.createElement('div'); o.id='scaleLoad'; o.style.cssText='position:fixed;inset:0;z-index:99999;background:var(--bg,#121419);display:flex;align-items:center;justify-content:center;color:var(--txt,#e8eaf2);font:600 15px system-ui,sans-serif'; o.innerHTML='<div style="text-align:center"><div style="font-size:28px;margin-bottom:8px">⏳</div><div>Загрузка данных…</div><div style="font-size:12px;opacity:.65;margin-top:6px">Большая база из хранилища браузера</div></div>'; document.body.appendChild(o); }catch(e){} }
function scaleLoaderHide(){ try{ const o=document.getElementById('scaleLoad'); if(o&&o.parentNode)o.parentNode.removeChild(o); }catch(e){} }
function scaleApplySnapshot(rec){ try{ applyFileData(rec); }catch(e){ return false; } try{ const a=document.querySelector('.tab.active[data-tab]'); if(a)a.click(); else renderCalc(); }catch(e){} return true; }
async function initScaleStore(){
  if(!scaleFlagOn()){ _scaleLoading=false; return false; }
  _scaleLoading=true; scaleLoaderShow();
  let rec=null; try{ rec=await idbGet(SCALE_IDB_KEY); }catch(e){}
  if(!(rec&&rec.store&&rec.store.products&&rec.store.raw)){
    _scaleLoading=false; _scaleActive=false; scaleSetFlag(false); scaleLoaderHide();
    if(_lsHadData){ try{ persist(); saveShip(); }catch(e){} }
    return false;
  }
  if(!scaleApplySnapshot(rec)){ _scaleActive=false; scaleLoaderHide(); scaleWarn(new Error('база не прочиталась')); return false; }
  _scaleAt=rec.at||0;
  _scaleActive=true; _scaleLoading=false; if(_scalePendingSave){ _scalePendingSave=false; queueScaleSave(); } else { queueScaleSave(); } scaleLoaderHide();
  return true;
}
function persist(){
  if(_scaleLoading){ _scalePendingSave=true; return; }
  const big=(typeof shScaleMode==='function'&&shScaleMode());
  if((scaleActive()||big)&&(_scaleActive||scaleActivate())){ queueScaleSave(); queueFileSave(); return; }
  try{ localStorage.setItem(STORE_KEY,JSON.stringify(store)); }
  catch(e){ if(scaleActivate())queueScaleSave(); }
  queueFileSave(); queueMirror();
}
function loadBackups(){ let b=null; try{ b=JSON.parse(localStorage.getItem(BACKUP_KEY)); }catch(e){} return Array.isArray(b)?b:[]; }
function saveBackups(b){ try{ localStorage.setItem(BACKUP_KEY,JSON.stringify(b.slice(0,BACKUP_MAX))); }catch(e){} }
function snapInfo(d){ const st=(d&&d.store)||d||{}; const p=Array.isArray(st.products)?st.products.length:0; const r=Array.isArray(st.raw)?st.raw.length:0; return p+' рецептов · '+r+' сырья'; }
function makeSnapshot(){ return { at:Date.now(), data:JSON.parse(JSON.stringify({ store, buy, buyRaw, buyHist, plans, purchases, shipHistory, shipPlans })) }; }
function takeBackup(force){
  if(_scaleLoading||scaleActive())return;
  if(typeof shScaleMode==='function'&&shScaleMode())return;
  const b=loadBackups();
  const last=b[0];
  const cur=makeSnapshot();
  if(!force && last && JSON.stringify(last.data)===JSON.stringify(cur.data)) return;
  b.unshift(cur);
  saveBackups(b);
}
function saveStore(){
  if(typeof shScaleInvalidate==='function')shScaleInvalidate();
  persist();
  if(_bkTimer)clearTimeout(_bkTimer);
  _bkTimer=setTimeout(takeBackup,1500);
}
function restoreFromSnapshot(s){
  const sd=(s&&s.data)||{};
  const st=sd.store||sd;
  try{ store=JSON.parse(JSON.stringify(st)); }catch(e){}
  if(sd.buy&&sd.buy.sel){ try{ buy=JSON.parse(JSON.stringify(sd.buy)); }catch(e){} }
  if(sd.buyRaw&&sd.buyRaw.items){ try{ buyRaw=JSON.parse(JSON.stringify(sd.buyRaw)); }catch(e){} }
  if(sd.buyHist&&sd.buyHist.range){ try{ buyHist=JSON.parse(JSON.stringify(sd.buyHist)); }catch(e){} }
  if(Array.isArray(sd.plans)){ try{ plans=JSON.parse(JSON.stringify(sd.plans)); }catch(e){} }
  if(Array.isArray(sd.purchases)){ try{ purchases=JSON.parse(JSON.stringify(sd.purchases)); }catch(e){} }
  if(Array.isArray(sd.shipHistory)){ try{ shipHistory=JSON.parse(JSON.stringify(sd.shipHistory)); }catch(e){} }
  if(sd.shipPlans&&typeof sd.shipPlans==='object'){ try{ shipPlans=JSON.parse(JSON.stringify(sd.shipPlans)); }catch(e){} }
  try{ shMigrateReturns(); shMigrateCloseRule(); }catch(e){}
  if(typeof shScaleInvalidate==='function')shScaleInvalidate();
  applyTheme(); persist(); saveBuy(); savePlans(); savePurchases(); saveBuyHist(); saveShip(); saveBackups(loadBackups());
}

function abTick(){
  if(!ab.enabled) return;
  // ежедневная по времени (копия в приложении + файл в папку)
  if(ab.time && todayStr()!==_abLastTime && nowMin()>=ab.time){
    var late=-1;
    try{
      var pm=/^(\d{1,2}):(\d{2})$/.exec(ab.time);
      if(pm){
        var d=new Date(Date.now()+2*3600*1000);
        var sched=+pm[1]*60+ +pm[2], now=d.getUTCHours()*60+d.getUTCMinutes();
        late=now-sched;
      }
    }catch(e){}
    takeBackup(); _abLastTime=todayStr();
    if(abDirHandle) writeDirBackup();
    if(late>30 && !ab._missedShown){
      ab._missedShown=true;
      ab._missedInfo={sched:ab.time,at:nowMin()};
      setTimeout(function(){
        if(!sessionStorage.getItem('abMissedNotified')){
          sessionStorage.setItem('abMissedNotified','1');
          alert('Авто-бэкап по расписанию в '+ab._missedInfo.sched+' не сработал — приложение (или компьютер) было закрыто.\n\nКопия данных сделана сейчас, при запуске, в '+ab._missedInfo.at+'.');

    }
  }
  renderAbStatus&&renderAbStatus();
}

function seedDemoFactHistory(){
  const DAYS_RU2=['вс','пн','вт','ср','чт','пт','сб'];
  const shops=store.shipShops||[], goods=store.shipGoods||[];
  let count=0;
  for(let back=42;back>=0&&count<60;back--){
    const ds=todayISOOffset(back);
    const dayRu=DAYS_RU2[new Date(ds+'T12:00:00').getDay()];
    shops.forEach((s,si)=>{
      if((s.days||[]).indexOf(dayRu)<0)return;
      if(count>=60)return;
      const seed2=(si*31+back*17+5)%97;
      const data={};
      goods.forEach((g,gi)=>{
        const base=24+seed2%22+gi*9;
        const shipped=Math.round(base*(0.62+((seed2+gi*3)%11)/22));
        const returned=Math.min(Math.round(shipped*(0.04+((seed2+gi*5)%6)/16)),Math.round(shipped*0.4));
        data[g.id]={shipped,returned};
      });
      shipHistory.push({date:ds,shop:s.name,shopId:s.id,data});
      count++;
    });
  }
}

  for(let i=0;i<str.length;i++){ h=(h^str.charCodeAt(i)); h=Math.imul(h,16777619)>>>0; }
  return h>>>0;
}
function licKeySig(machine, exp){ return ('0000000'+licFnv32((String(machine||'').trim()+'|'+String(exp||'')+'|'+LIC_MASTER)).toString(16).toUpperCase()).slice(-8); }
function licMachineName(){ try{ if(!licIsHta())return ''; return new ActiveXObject('WScript.Shell').ExpandEnvironmentStrings('%COMPUTERNAME%').toUpperCase(); }catch(_){ return ''; } }
function licReadKeyFile(){
  if(!licIsHta()) return {ok:false,err:'не HTA'};
  try{
    const fso=new ActiveXObject('Scripting.FileSystemObject');
    const f=new ActiveXObject('WScript.Shell').ExpandEnvironmentStrings('%ProgramData%')+'\\PelmCalc\\lic.key';
    if(!fso.FileExists(f)) return {ok:false,err:'файл ключа не найден. Запусти инсталлер.'};
    const ts=fso.OpenTextFile(f,1); const text=ts.ReadAll(); ts.Close();
    const m=(text||'').split(/\r?\n/)[0].trim().match(/^([A-F0-9]{8});(\d{4}-\d{2}-\d{2})$/);
    if(!m) return {ok:false,err:'повреждённый файл ключа'};
    const sig=m[1], exp=m[2];
    if(licKeySig(licMachineName(),exp)!==sig) return {ok:false,err:'ключ не подходит к этому устройству'};
    if(exp!=='0000-00-00' && exp<todayISO()) return {ok:false,err:'срок действия ключа истёк ('+fmtDateISO(exp)+')'};
    return {ok:true,exp:exp};
  }catch(e){ return {ok:false,err:'ошибка чтения ключа: '+(e.message||e)}; }
}
function licDaysLeft(exp){
  if(exp==='0000-00-00') return null;
  const [y,m,d]=exp.split('-').map(Number);
  const end=Date.UTC(y,m-1,d+1); const now=Date.now()+2*3600*1000;
  return Math.max(0,Math.ceil((end-now)/86400000));
}

}

  };

  ['Соль и сладкое',['соль','сахар','мёд','мед','ванил','пудр','подсласт','стеви','фруктоз']],
  ['Соусы и добавки',['соус','кетчуп','майонез','горчиц','уксус','паст','бульон','желатин','разрыхлит','сод','дрожж','паниров','сухар','глутамат']],
  ['Прочее',[]]
];
function rawGroups(){ if(Array.isArray(store.groups)&&store.groups.length) return store.groups; store.groups=DEFAULT_GROUPS.slice(); return store.groups; }
function rawGroupOf(r){
  const gs=rawGroups();
  if(r.group){ const gi=gs.indexOf(r.group); if(gi>=0) return gi; }
  const n=(r.name||'').toLowerCase();
  for(let i=0;i<RAW_GROUPS.length;i++){
    let hit=false;
    const words=RAW_GROUPS[i][1];
    for(let j=0;j<words.length;j++){ if(n.indexOf(words[j])!==-1){hit=true;break;} }
    if(hit){ const gi=gs.indexOf(RAW_GROUPS[i][0]); if(gi>=0) return gi; }
  }
  return gs.length-1;
}

function buildExport(){ return { app:'recipeCalc', at:Date.now(), data:JSON.parse(JSON.stringify(store)), shipHistory:JSON.parse(JSON.stringify(shipHistory)), shipPlans:JSON.parse(JSON.stringify(shipPlans)) }; }
function calcFileName(){ const d=new Date(Date.now()+2*3600*1000); const p=n=>String(n).padStart(2,'0'); return 'calculator_'+d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+'.json'; }
function _downloadText(text,name,mime){
  try{
    const blob=new Blob([text],{type:mime||'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=name; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{ if(a.parentNode)a.parentNode.removeChild(a); }catch(e){} try{ URL.revokeObjectURL(url); }catch(e){} },4000);
    return true;
  }catch(e){ return false; }
}
async function _copyText(t){
  try{ if(navigator&&navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(t); return true; } }catch(e){}
  try{
    const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok=document.execCommand&&document.execCommand('copy');
    try{ if(ta.parentNode)ta.parentNode.removeChild(ta); }catch(e){}
    return !!ok;
  }catch(e){ return false; }
}

async function exportToCloud(){
  const payload=JSON.stringify(buildExport(),null,2);

    try{
      const dir=await window.showDirectoryPicker({mode:'readwrite'});
      const fh=await dir.getFileHandle(calcFileName(),{create:true});

      await w.write('\uFEFF'+payload);
      await w.close();
      alert('Файл сохранён в выбранную папку:\n'+calcFileName());
      return;
    }catch(e){ if(e&&e.name==='AbortError')return; }
  }

async function shareDataFile(){
  const payload='\uFEFF'+JSON.stringify(buildExport(),null,2);
  const name=calcFileName();
  try{
    const blob=new Blob([payload],{type:'application/json'});
    const file=new File([blob],name,{type:'application/json'});
    if(navigator&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:'Данные Калькуляшки',text:'Файл данных калькулятора'}); return; }
      catch(e){ if(e&&e.name==='AbortError')return; }
    }
    if(navigator&&navigator.share){
      try{ await navigator.share({title:'Данные Калькуляшки',text:payload}); return; }
      catch(e){ if(e&&e.name==='AbortError')return; }
    }
  }catch(e){}
  _openTransferModal(payload,name);
}
function importCalcText(text){
  try{
    const t=(text||'').replace(/^\uFEFF/,'');
    const d=JSON.parse(t);
    const rec=(d&&d.data)||(d&&d.store)||d;
    if(!rec||!rec.products||!rec.raw||!rec.theme) throw 0;
    const when=d&&d.at?fmtTime(d.at):'неизвестно';
    if(!confirm('Применить данные из файла?\nДата: '+when+'\nРецептов: '+rec.products.length+' · Сырья: '+rec.raw.length))return false;
    store=JSON.parse(JSON.stringify(rec));
    if(Array.isArray(d.shipHistory)){ try{ shipHistory=JSON.parse(JSON.stringify(d.shipHistory)); }catch(e){} }
    if(d.shipPlans&&typeof d.shipPlans==='object'){ try{ shipPlans=JSON.parse(JSON.stringify(d.shipPlans)); }catch(e){} }
    try{ shMigrateReturns(); shMigrateCloseRule(); }catch(e){}
    applyTheme(); renderSettings(); renderCalc(); renderRecipes(); renderRaw(); saveStore(); saveShip();
    alert('Данные применены ('+rec.products.length+' рецептов, '+rec.raw.length+' сырья).');
    return true;
  }catch(_){ alert('Не удалось прочитать файл. Убедись, что это файл калькулятора (.json).'); return false; }
}
function initFileDrop(){
  const panes=document.querySelectorAll('.pane');
  panes.forEach(p=>{
    p.addEventListener('dragover',e=>{e.preventDefault();});
    p.addEventListener('drop',e=>{
      e.preventDefault();
      const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
      if(!f)return;
      const rd=new FileReader(); rd.onload=()=>importCalcText(rd.result); rd.readAsText(f);
    });
  });
}

function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open('recipeCalcFs',1); r.onupgradeneeded=()=>{ try{r.result.createObjectStore('files');}catch(e){} }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ const db=await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction('files','readonly').objectStore('files').get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); }); }
async function idbSet(k,v){ const db=await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction('files','readwrite').objectStore('files').put(v,k); t.onsuccess=()=>res(); t.onerror=()=>rej(t.error); }); }
async function idbDel(k){ const db=await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction('files','readwrite').objectStore('files').delete(k); t.onsuccess=()=>res(); t.onerror=()=>rej(t.error); }); }

  const st0=(d&&(d.store||d.data))||null;

  }
  if(d&&d.buy&&d.buy.sel){ try{ buy=JSON.parse(JSON.stringify(d.buy)); if(!buy.mode)buy.mode='dishes'; }catch(e){} }
  if(d&&d.buyRaw&&d.buyRaw.items){ try{ buyRaw=JSON.parse(JSON.stringify(d.buyRaw)); }catch(e){} }
  if(Array.isArray(d&&d.plans)) plans=JSON.parse(JSON.stringify(d.plans));

  if(Array.isArray(d&&d.shipHistory)){ try{ shipHistory=JSON.parse(JSON.stringify(d.shipHistory)); }catch(e){} }
  if(d&&d.shipPlans&&typeof d.shipPlans==='object'){ try{ shipPlans=JSON.parse(JSON.stringify(d.shipPlans)); }catch(e){} }

async function writeFileData(){
  if(!dataFileHandle)return;
  try{
    if(dataFileHandle.queryPermission && (await dataFileHandle.queryPermission({mode:'readwrite'}))!=='granted'){
      if(dataFileHandle.requestPermission && (await dataFileHandle.requestPermission({mode:'readwrite'}))!=='granted'){ setFsStatus('нет доступа к файлу — выбери файл заново'); return; }
    }
    const w=await dataFileHandle.createWritable();
    await w.write(JSON.stringify(getAllData(),null,2));
    await w.close();
    setFsStatus('💾 файл: '+dataFileHandle.name+' · сохранено '+new Date(Date.now()+2*3600*1000).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){ if(e&&e.name!=='AbortError') setFsStatus('ошибка записи: '+(e.message||e)); }
}

async function importFromFile(){

async function initFileStorage(){

function buyTotals(){
  const agg={};
  for(const pid in buy.sel){
    const q=Number(buy.sel[pid])||0;
    if(q<=0)continue;
    const p=store.products.find(x=>x.id===pid);
    if(!p)continue;
    (p.items||[]).forEach(c=>{
      const k=c.rid;
      agg[k]= (agg[k]||{rid:k,need:0,cost:0});
      agg[k].need += c.qty*q*rawNetMult(k);
      agg[k].cost += c.qty*q*rawNetMult(k)*rawPrice(k);
    });
  }
  return Object.values(agg).map(r=>({rid:r.rid,need:r.need,cost:Math.round(r.cost*100)/100}))
    .sort((a,b)=>(rawName(a.rid).toLowerCase()<rawName(b.rid).toLowerCase()?-1:1));
}
function bindBuyDishesChecks(root, listLen){
  root.querySelectorAll('input[data-rid]').forEach(inp=>{
    inp.onchange=()=>{

      if(inp.checked) buy.checked[rid]=true; else delete buy.checked[rid];
      saveBuy();
      const row=inp.closest('.buy-item'); if(row)row.classList.toggle('done',!!buy.checked[rid]);
      const nm=row?row.querySelector('.ing-name'):null; if(nm)nm.style.textDecoration=(buy.checked[rid]?'line-through':'none');
      const hdr=root.querySelector('.res-head .hint'); if(hdr)hdr.textContent=Object.keys(buy.checked).filter(k=>buy.checked[k]).length+' / '+listLen+' куплено';
      const dv=root.querySelector('#buyDone'); if(dv)dv.textContent=Object.keys(buy.checked).filter(k=>buy.checked[k]).length;
    };
  });
}
function bindBuyPriceInps(root){
  root.querySelectorAll('.price-inp').forEach(inp=>{
    inp.onchange=()=>{
      const rid=inp.getAttribute('data-rid');
      const v=parseFloat(inp.value);
      const r=store.raw.find(x=>x.id===rid);
      if(r && isFinite(v) && v>=0){ r.price=v; }
      saveStore();
      const item=inp.closest('.buy-item');
      const q=item?parseFloat(item.querySelector('.rowCost').getAttribute('data-q'))||0:0;
      const cost=(isFinite(v)?(v||0):0)*q;
      const costEl=item?item.querySelector('.rowCost'):null;
      if(costEl) costEl.textContent=fmtMoney(cost);
      let tot=0;
      root.querySelectorAll('#buyList .buy-item').forEach(li=>{
        const cq=li.querySelector('.rowCost'); const ci=li.querySelector('.price-inp');
        const qq=cq?parseFloat(cq.getAttribute('data-q'))||0:0;
        const pp=ci?(parseFloat(ci.value)||0):0;
        tot+=qq*pp;
      });
      const bs=root.querySelector('#buySum'); if(bs)bs.textContent=fmtMoney(tot);
    };
  });
}

            '<div style="display:flex;gap:6px;align-items:center"><span style="font-weight:700;color:var(--accent2)">'+fmtMoney(p.total)+'</span>'+
            '<button class="btn ghost sm" data-go="'+p.date+'">🛒 Закупаться</button>'+
            '<button class="icon-del" data-dp="'+p.date+'">✕</button></div>'+
          '</div>'+
          '<div class="hist-body" style="display:none">'+
            p.items.map(i=>'<div class="hist-item"><span>'+esc(i.name)+'</span><span class="hint">'+fmtNum(i.qty!=null?i.qty:i.need)+' '+esc(i.unit)+'</span><span>'+fmtMoney(i.sum)+'</span></div>').join('')+
          '</div>'+
        '</div>').join(''):'<div class="empty">Шпаргалок пока нет. На экране «Закуп» выбери дату и «Сохранить шпаргалку».</div>')+
    '</div>'+

  root.querySelectorAll('.hist-p-head').forEach(h=>{ h.onclick=e=>{ if(e.target.closest('[data-dp]')||e.target.closest('[data-go]'))return; const bd=h.nextElementSibling; bd.style.display=bd.style.display==='none'?'':'none'; }; });
  root.querySelectorAll('[data-dp]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); if(!confirm('Удалить шпаргалку?'))return; delPlan(b.getAttribute('data-dp')); renderBuyPlans(); });
  root.querySelectorAll('[data-go]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const date=b.getAttribute('data-go');
    const pl=plans.find(x=>x.date===date)||plans.find(x=>x.date===date&&(x.kind||'dishes'));
    if(!pl||!pl.items.length)return;
    loadBuy(); loadBuyRaw();
    const kinds=(pl.kind||(pl.items[0]&&pl.items[0].pid?'dishes':(pl.items[0]&&(pl.items[0].rid||!store.products.some(p=>p.name===pl.items[0].name))?'raw':'dishes')));
    if(kinds==='raw'){
      const rawSel={};
      (pl.items||[]).forEach(i=>{
        const r=i.rid?store.raw.find(x=>x.id===i.rid):store.raw.find(x=>x.name===i.name);
        if(r) rawSel[r.id]=i.qty!=null?i.qty:i.need;
      });
      buyRaw.items=rawSel; buyRaw.checked={}; buyRaw.date=pl.date;
      buy.mode='raw';
    }else{
      const sel={};
      (pl.items||[]).forEach(i=>{
        const p=i.pid?store.products.find(x=>x.id===i.pid):store.products.find(x=>x.name===i.name);
        if(p) sel[p.id]=i.qty!=null?i.qty:1;
      });
      buy.sel=sel; buy.checked={}; buy.date=pl.date;
      buy.mode='dishes';
    }
    saveBuy();
    buyView='buy';
    renderBuy();
  });
  refreshNotice();
}
function renderBuyHistory(){
  const root=$('pane-buy');
  loadPurchases();
  loadBuyHist();
  const now=Date.now();
  const d7=now-7*864e5, d30=now-30*864e5;
  const range=buyHist.range||'all';
  const from=(range==='7'?d7:(range==='30'?d30:(range==='custom'?((buyHist.from?new Date(buyHist.from+'T00:00:00').getTime():0)):0)));
  const to=(range==='custom'&&buyHist.to?new Date(buyHist.to+'T23:59:59').getTime():Infinity);
  const shown=purchases.filter(p=>p.at>=from && p.at<=to);
  const tAll=shown.reduce((s,p)=>s+p.total,0);
  const t7=shown.filter(p=>p.at>=d7).reduce((s,p)=>s+p.total,0);
  const t30=shown.filter(p=>p.at>=d30).reduce((s,p)=>s+p.total,0);
  const rOpt=r=>'<button class="btn ghost sm'+(range===r?' active':'')+'" data-rng="'+r+'">'+(r==='all'?'Всё время':(r==='7'?'7 дней':(r==='30'?'30 дней':'Период')))+'</button>';
  root.innerHTML=
  pageHint('История закупок: выбери период (пресеты или свои даты) и посмотри расходы. Помечено — по блюдам или по сырью.')+
  '<div class="buy-view-tabs"><button class="btn ghost sm" data-v="buy">Закуп</button><button class="btn ghost sm active" data-v="hist">История</button><button class="btn ghost sm" data-v="plans">Шпаргалки</button></div>'+
  '<div class="card pad" style="padding:12px;margin-bottom:10px">'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">'+rOpt('all')+rOpt('7')+rOpt('30')+rOpt('custom')+
      '<span class="hint" style="margin-left:auto">с <input type="date" id="histFrom" value="'+(buyHist.from||'')+'" style="width:auto;display:inline-block;padding:6px" /> по <input type="date" id="histTo" value="'+(buyHist.to||'')+'" style="width:auto;display:inline-block;padding:6px" /></span>'+
    '</div>'+
  '</div>'+
  '<div class="buy-stats">'+
    '<div><div class="t">Итого по периоду</div><div class="v">'+fmtMoney(tAll)+'</div><div class="hint">'+shown.length+' записей</div></div>'+
    '<div><div class="t">За 30 дней</div><div class="v">'+fmtMoney(t30)+'</div></div>'+
    '<div><div class="t">За 7 дней</div><div class="v">'+fmtMoney(t7)+'</div></div>'+
  '</div>'+
  '<div class="card flex-col" style="min-height:0">'+
    '<div class="tbar"><h3>Закупы</h3><button class="btn ghost sm" id="histClear">Очистить</button></div>'+
    '<div class="scroll" id="histList">'+
      (shown.length?shown.map(p=>
        '<div class="hist-p" data-id="'+p.id+'">'+
          '<div class="hist-p-head">'+
            '<div><b>'+fmtTime(p.at)+'</b> <span class="oktag" style="color:'+(p.kind==='raw'?'#1f9d63':'#e09100')+'">'+(p.kind==='raw'?'🧺 по сырью':'🍽 по блюдам')+'</span> <span class="hint">· '+p.items.length+' поз.</span></div>'+
            '<div style="display:flex;gap:6px;align-items:center"><span style="font-weight:700;color:var(--accent2)">'+fmtMoney(p.total)+'</span>'+
            '<button class="icon-del" data-del="'+p.id+'">✕</button></div>'+
          '</div>'+
          '<div class="hist-body" style="display:none">'+
            p.items.map(i=>'<div class="hist-item"><span>'+esc(i.name)+'</span><span class="hint">'+fmtNum(i.need)+' '+esc(i.unit)+'</span><span>'+fmtMoney(i.sum)+'</span></div>').join('')+
          '</div>'+
        '</div>').join(''):'<div class="empty">За этот период закупов нет.</div>')+
    '</div>'+
  '</div>';
  root.querySelectorAll('.buy-view-tabs [data-v]').forEach(b=>b.onclick=()=>{ buyView=b.getAttribute('data-v'); renderBuy(); });
  root.querySelectorAll('[data-rng]').forEach(b=>b.onclick=()=>{ buyHist.range=b.getAttribute('data-rng'); saveBuyHist(); renderBuyHistory(); });
  const hf=$('histFrom'), ht=$('histTo');
  if(hf)hf.onchange=()=>{ if(hf.value) buyHist.from=hf.value; else delete buyHist.from; if(buyHist.from||buyHist.to) buyHist.range='custom'; saveBuyHist(); renderBuyHistory(); };
  if(ht)ht.onchange=()=>{ if(ht.value) buyHist.to=ht.value; else delete buyHist.to; if(buyHist.from||buyHist.to) buyHist.range='custom'; saveBuyHist(); renderBuyHistory(); };
  root.querySelectorAll('.hist-p-head').forEach(h=>{
    h.onclick=e=>{ if(e.target.closest('[data-del]'))return; const bd=h.nextElementSibling; bd.style.display=bd.style.display==='none'?'':'none'; };
  });
  root.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    if(!confirm('Удалить этот закуп из истории?'))return;
    delPurchase(b.getAttribute('data-del')); renderBuyHistory();
  });
  const hc=$('histClear'); if(hc)hc.onclick=()=>{ if(!confirm('Очистить всю историю закупов?'))return; purchases=[]; savePurchases(); renderBuyHistory(); };
  refreshNotice();
}

// ---- Уведомление о закупе (сверху) ----
const NOTICE_KEY='recipeCalc.notice.v1';
let noticeState=null;
function loadNoticeState(){ try{ const d=JSON.parse(localStorage.getItem(NOTICE_KEY)); if(d&&typeof d==='object') noticeState=d; else noticeState={dismissKey:''}; }catch(e){ noticeState={dismissKey:''}; } }
function saveNoticeState(){ try{ localStorage.setItem(NOTICE_KEY,JSON.stringify(noticeState||{})); }catch(e){} }
function refreshNotice(){
  const box=document.getElementById('notice'); if(!box)return;
  const today=todayISO();
  const plansDue=plans.filter(p=>!p.done && p.date<=today);
  let msg='', items=0, sum=0;
  if(plansDue.length){
    const p=plansDue[0];
    items=(p.items||[]).length; sum=p.total||0;
    msg='Закуп '+(p.kind==='raw'?'(по сырью)':'(по блюдам)')+' на '+fmtDateISO(p.date)+' — '+items+' поз., '+fmtMoney(sum)+'. Осталось купить!';
  }else{
    const listLen = buy.mode==='raw'?Object.keys(buyRaw.items||{}).length:Object.keys(buy.sel||{}).length;
    if(listLen){ items=listLen; msg='В списке закупа '+listLen+' поз., не всё отмечено купленным.'; }
    else { box.style.display='none'; return; }
  }
  const key=msg;
  if(noticeState && noticeState.dismissKey===key){ box.style.display='none'; return; }
  box.innerHTML='<span class="n-txt">📋 '+msg+'</span>'+
    '<button type="button" class="btn sm" id="nOpen" style="border:1px solid currentColor;color:#1a2133;font-weight:800">Открыть</button>'+
    '<span class="n-close" id="nClose" title="Закрыть">✕</span>';
  box.style.display='flex';
  const open=document.getElementById('nOpen'); if(open)open.onclick=()=>{ const tb=document.querySelector('[data-tab="buy"]'); if(tb)tb.click(); };
  const close=document.getElementById('nClose'); if(close)close.onclick=()=>{ box.style.display='none'; noticeState=noticeState||{}; noticeState.dismissKey=key; saveNoticeState(); };
}

      if(_pd&&!_hasFact)addRow(date,p.shopId,p.shop,p.naklNum!=null?p.naklNum:null,'','',!!r.closed,_pd,undefined,p.naklOrd);
    });

function shMergeLocalGoods(base,records){
  const out=(base||[]).slice();
  const seen={};
  out.forEach(g=>{ if(g&&g.id)seen[g.id]=1; });
  (records||[]).forEach(rec=>{
    const lg=(rec&&rec.localGoods)?rec.localGoods:(Array.isArray(rec)?rec:[]);
    lg.forEach(g=>{ if(g&&g.id&&!seen[g.id]){ seen[g.id]=1; out.push(g); } });
  });
  return out;
}

        pagesArr.forEach(p=>htmls.push([p,label]));

}

function shNaklSrcPick(date,shopId,shopName,ord){
  const o=parseInt(ord,10)||1;
  const shp=(store.shipShops||[]).find(x=>x.id===shopId||(!shopId&&x.name===shopName))||null;
  const sid=shp?shp.id:(shopId||'');
  const sName=shp?shp.name:(shopName||'');
  const full=shp?shNaklShopFull(shp.id):(shopName||'');
  const sameShop=(v)=>((sid&&v===sid)||(!!v&&(v===full||v===sName)));
  const fact=(shipHistory||[]).find(h=>h.date===date&&sameShop(h.shopId||h.shop)&&((h.naklOrd||1)===o))||null;
  const planRow=((shipPlans&&shipPlans[date])||[]).find(p=>sameShop(p.shopId||p.shop)&&((p.naklOrd||1)===o))||null;
  const reg=shNaklRegOf(date,sid,sName,o);
  const data={};
  if(planRow&&planRow.data)for(const g in planRow.data){const q=+planRow.data[g];if(q)data[g]=q;}
  if(fact&&fact.data)for(const g in fact.data){
    const d=fact.data[g];
    if(d&&typeof d==='object'){if(+d.shipped)data[g]=+d.shipped;}
    else if(+d)data[g]=+d;
  }
  return {shp:shp,sid:sid,sName:sName,full:full,fact:fact,planRow:planRow,reg:reg,data:data};
}

  };
  const back=el('<div class="modal-back open"><div class="modal" style="width:100%;max-width:none;max-height:none;height:100vh;border-radius:0;margin:0;display:flex;flex-direction:column;padding:12px 16px;box-sizing:border-box">'+
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px">'+
      '<h3 style="margin:0">📋 Копирование накладной</h3>'+
      '<span style="color:var(--muted);font-size:13px">Исходная: '+(srcNum!==''?('№ '+esc(String(srcNum))+' · '):'')+esc(fmtDate(date))+' · '+esc(src.sName||'')+(o>1?(' · накладная № '+o+' этого магазина'):'')+'</span>'+

    '</div>'+

    '<div id="naklClShopBox" style="display:none;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px">'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">'+

  document.body.appendChild(back);

      const gid=tr.getAttribute('data-gid');
      const pi=tr.querySelector('.nakl-cl-price');
      const cell=tr.querySelector('.nakl-cl-info');
      if(!pi||!cell)return;
      const typed=+String(pi.value||'').trim().replace(',','.');
      const lp=shLegalPrice(lid,gid);
      const base=baseFor(gid,lid);
      const gr=shNaklGramsOf(gid);
      const _sp=src.reg&&src.reg.prices; const srcHas=_sp?((gr?(gr===90?_sp.g90:_sp.g200):(_sp.byId?_sp.byId[gid]:null))):null;
      let t='';
      if(base>0&&(lp!=null||!typed||Math.abs(typed-base)>0.001))t='цена по контрагенту/товару: '+shNum2(base)+' ₽';
      if(srcHas!=null&&srcHas>0)t=(t?t+' · ':'')+'в исходной: '+shNum2(srcHas)+' ₽';

    });

    saveStore();
    if(legalSel){ legalSel.innerHTML=legalOpts(id); legalSel.value=id; setInfo(id); }
    err('');

    err('');

    const lid=legalSel?String(legalSel.value||''):'';
    const sp=shShops().filter(x=>x.id===sid)[0]||null;
    const sName=sp?sp.name:'';
    if(!sid&&!sName){err('Выбери магазин для новой накладной.');return;}
    const chosen={};
    let cnt=0;
    rows().forEach(tr=>{
      const ck=tr.querySelector('.nakl-cl-chk'), qi=tr.querySelector('.nakl-cl-qty');
      if(!ck||!ck.checked)return;
      const gid=tr.getAttribute('data-gid');
      const v=Math.max(0,Math.round(+((qi&&qi.value)||0)||0));
      if(!v)return;
      chosen[gid]=v; cnt++;
    });
    if(!cnt){err('Отметь хотя бы один товар и укажи количество.');return;}
    const prices={};
    rows().forEach(tr=>{
      const gid=tr.getAttribute('data-gid');
      if(!(gid in chosen))return;
      const pi=tr.querySelector('.nakl-cl-price');
      const typed=+String((pi&&pi.value)||'').trim().replace(',','.');
      const base=baseFor(gid,lid);
      if(typed>0&&Math.abs(typed-base)>0.001){
        const gr=shNaklGramsOf(gid);
        const pv=Math.round(typed*100)/100;
        if(gr)prices[gr===90?'g90':'g200']=pv;
        else{ if(!prices.byId)prices.byId={}; prices.byId[gid]=pv; }
      }
    });
    if(!confirm('Скопировать накладную в новую?'+String.fromCharCode(10)+
      'Магазин: '+(sName||'—')+String.fromCharCode(10)+'Позиций: '+cnt+String.fromCharCode(10)+
      'Новая получит свой номер. Исходная накладная не изменится.'))return;
    const res=shNaklClone(date,src.sid||'',src.sName||'',o,{shopId:sid,shopName:sName,legalId:lid,data:chosen,prices:prices});
    if(!res||res.err){err((res&&res.err)?res.err:'Не удалось создать копию.');return;}
    close();
    (window.__shNaklRerender||function(){})();
    shNaklView(date,sName,sid,res.num,res.ord);
  };
}

/* П55. shNaklClone с направленными параметрами: shopId/shopName — магазин новой накладной,
   legalId ('' = без юрлица), data — состав, prices — цены по граммам (null = без своей цены).
   Без opts поведение прежнее: копия исходной на магазине исходной, цены — как в исходной. */
function shNaklClone(date,shopId,shopName,ord,opts){
  if(!date)return {err:'Нет даты накладной — скопировать нечего.'};
  const src=shNaklSrcPick(date,shopId,shopName,ord);
  if(!Object.keys(src.data).length)return {err:'В накладной нет отгрузки — скопировать нечего.'};
  opts=opts||{};
  const tSid=(opts.shopId!=null)?String(opts.shopId):(src.sid||'');
  const tName=(opts.shopName!=null)?String(opts.shopName):(src.sName||'');
  if(!tSid&&!tName)return {err:'Не выбран магазин для новой накладной.'};
  let data=JSON.parse(JSON.stringify(src.data));
  if(opts.data&&typeof opts.data==='object'){
    data={};
    for(const k in opts.data){ const q=Math.max(0,Math.round(+opts.data[k]||0)); if(q>0)data[k]=q; }
    if(!Object.keys(data).length)return {err:'Не выбрано ни одного товара — скопировать нечего.'};
  }
  const newOrd=shNaklNextOrd(date,tSid||tName);
  const reg2=shEnsureNakl(date,tSid,tName,newOrd);
  if(!reg2)return {err:'Создание накладной отменено.'};
  const hasLegal=Object.prototype.hasOwnProperty.call(opts,'legalId');
  const wantLegal=hasLegal?String(opts.legalId||''):((src.reg&&src.reg.legalId)||'');
  if(wantLegal)reg2.legalId=wantLegal; else delete reg2.legalId;
  const hasPrices=Object.prototype.hasOwnProperty.call(opts,'prices')&&opts.prices&&typeof opts.prices==='object';
  if(hasPrices){
    reg2.prices=JSON.parse(JSON.stringify(opts.prices));
    if(!Object.keys(reg2.prices).length)delete reg2.prices;
  }
  else if(src.reg&&src.reg.prices)reg2.prices=JSON.parse(JSON.stringify(src.reg.prices));
  const old=(shipPlans&&shipPlans[date])||[];
  old.push({shopId:tSid,shop:tName,data:JSON.parse(JSON.stringify(data)),naklNum:reg2.num,naklOrd:(newOrd>1?newOrd:undefined)});
  shipPlans[date]=old;
  reg2.mod=new Date().toISOString();
  saveStore();
  saveShip();
  return {num:reg2.num,ord:newOrd,date:date};
}

function shNaklPrintSort(rows){
  const numOf=(r)=>{const n=r?r.num:null;return (n==null||n==='')?null:String(n).replace(/\s+/g,'');};
  return (rows||[]).slice().sort((a,b)=>{
    const da=String((a&&a.date)||''), db=String((b&&b.date)||'');
    if(da!==db) return da<db?-1:1;
    const na=numOf(a), nb=numOf(b);
    if(na===null&&nb===null) return 0;
    if(na===null) return 1;
    if(nb===null) return -1;
    const ia=/^\d+$/.test(na)?parseInt(na,10):null, ib=/^\d+$/.test(nb)?parseInt(nb,10):null;
    if(ia!==null&&ib!==null) return ia-ib;
    return na<nb?-1:(na>nb?1:0);
  });
}

function shFillFact(date,shop,shopId,ordArg){
  const ord=(ordArg==null)?(parseInt(shDayOrd,10)||1):(parseInt(ordArg,10)||1);
  const row=shipHistory.find(h=>h.date===date&&((shopId&&h.shopId===shopId)||(!shopId&&h.shop===shop))&&((h.naklOrd||1)===ord));
  if(!row||!row.data)return;
  (store.shipGoods||[]).forEach(g=>{
    const v=row.data[g.id];
    const give=document.querySelector('.sh-give[data-gid="'+g.id+'"]');
    const ret=document.querySelector('.sh-ret[data-gid="'+g.id+'"]');
    if(give&&v&&v.shipped)give.value=v.shipped;
    const rv=(row.retPrev&&row.retPrev.qty&&row.retPrev.qty[g.id]!=null)?row.retPrev.qty[g.id]:(v?(+(v.returned||0)):0);
    if(ret&&rv)ret.value=rv;
  });
}
/* П52: номера накладных магазина за выбранную дату (история + план + реестр). */
function shDayNaklOrds(date,shopId,shopName){
  if(!date)return [];
  const out=[];
  const add=o=>{const n=parseInt(o,10)||1;if(out.indexOf(n)<0)out.push(n);};
  (shipHistory||[]).forEach(h=>{if(h&&h.date===date&&((shopId&&h.shopId===shopId)||(!shopId&&h.shop===shopName)))add(h.naklOrd);});
  ((shipPlans&&shipPlans[date])||[]).forEach(p=>{if(p&&((shopId&&p.shopId===shopId)||(!shopId&&p.shop===shopName)))add(p.naklOrd);});
  shNaklKeysOf(date,shopId||('n:'+shopName)).forEach(k=>add(shNaklSplitKey(k).ord));
  out.sort((a,b)=>a-b);
  return out;
}
/* П52: вторую накладную за тот же день и магазин создаём только с вопроса. */
function shDayAskSecond(date,shopId,shopName,ord){
  const o=parseInt(ord,10)||1;
  if(o<=1)return true;
  const m=shNaklReg()||{};
  const nums=shNaklKeysOf(date,shopId||shopName||'').map(k=>(m[k]&&m[k].num!=null)?('№ '+m[k].num):'').filter(x=>x);
  if(!nums.length)return true;
  const who=shopName||((store.shipShops||[]).find(x=>x&&x.id===shopId)||{}).name||shopId||'';
  return !!window.confirm('По магазину «'+who+'» за '+fmtDate(date)+' уже есть накладная '+nums.join(', ')+'.\n\nСоздать вторую накладную?');
}
/* П52: номер следующей свободной накладной магазина за дату — для пункта «➕ Новая накладная». */
function shDayNaklNextOrd(date,shopId,shopName){
  const ords=shDayNaklOrds(date,shopId,shopName);
  return (ords.length?ords[ords.length-1]:0)+1;
}
function shDayNaklNo(){
  const noEl=$('shNaklNo');
  if(!noEl)return;
  const dEl=$('shDate');
  const disp=$('shDispShop');
  const date=dEl?dEl.value:'';
  const shopVal=disp?(disp.value||'').trim():'';
  if(!date||!shopVal){noEl.style.display='none';shDayRetPickUI();return;}
  const sid=shSelShopId||('n:'+shopVal);
  const ords=shDayNaklOrds(date,shSelShopId,shopVal);
  if(shDayOrd<1||ords.indexOf(shDayOrd)<0)shDayOrd=1;
  if(ords.length){
    let h='<select id="shNaklOrdSel" class="sh-nakl-ord" title="Накладные за этот день — выбери, в какую писать">';
    ords.forEach(o=>{const n=shNaklNumOf(date,sid,shopVal,o);h+='<option value="'+o+'"'+(o===shDayOrd?' selected':'')+'>№ '+(n||'?')+'</option>';});
    h+='<option value="'+shDayNaklNextOrd(date,shSelShopId,shopVal)+'">➕ Новая накладная</option></select>';
    noEl.style.display='inline-block';
    noEl.innerHTML=h;
    const sel=noEl.querySelector('#shNaklOrdSel');
    if(sel)sel.onchange=()=>{
      shDayOrd=parseInt(sel.value,10)||1;
      shRenderFactInputs();
      shFillFact(date,shopVal,shSelShopId,shDayOrd);
      shDayNaklNo();
    };
  }else{
    const num=shNaklNumOf(date,sid,shopVal,shDayOrd);
    if(num){noEl.textContent='Накладная № '+num;noEl.style.display='inline-block';}
    else {noEl.style.display='none';}
  }
  shDayRetPickUI();
}
/* П51.2: возврат уходит в накладную ПРЕДЫДУЩЕГО визита. Если за тот день их было
   несколько — показываем их номера и ждём выбора (по умолчанию последняя). */
function shDayRetPickUI(){
  const dEl=$('shDate'),disp=$('shDispShop'),noEl=$('shNaklNo');
  const date=dEl?dEl.value:'',shopVal=disp?(disp.value||'').trim():'';
  const list=(date&&shopVal)?shRetPrevList(date,shSelShopId,shopVal):[];
  let box=$('shRetOrdBox');
  if(!box&&noEl&&noEl.parentNode&&list.length>1){
    box=document.createElement('div');
    box.id='shRetOrdBox';
    box.style.cssText='margin-top:4px;font-size:12px;color:var(--muted)';
    noEl.parentNode.insertBefore(box,noEl.nextSibling);
  }
  if(!box){shRetPickOrd=0;return;}
  if(list.length<2){shRetPickOrd=0;box.innerHTML='';box.style.display='none';return;}
  const rec=(shipHistory||[]).find(h=>h&&h.date===date&&shSelShopId&&h.shopId===shSelShopId&&((h.naklOrd||1)===shDayOrd));
  const saved=(rec&&rec.retPrev&&rec.retPrev.ord)?rec.retPrev.ord:0;
  if(!shRetPickOrd)shRetPickOrd=saved||(list[list.length-1].naklOrd||1);
  box.style.display='block';
  let h='Возврат уйдёт в накладную: <select id="shRetOrdSel" class="sh-nakl-ord">';
  list.forEach(p=>{const o=p.naklOrd||1;const n=shNaklNumOf(p.date,shSelShopId,p.shop,o);h+='<option value="'+o+'"'+(o===shRetPickOrd?' selected':'')+'>№ '+(n||'?')+' за '+fmtDate(p.date)+'</option>';});
  h+='</select>';
  box.innerHTML=h;
  const sel=box.querySelector('#shRetOrdSel');
  if(sel)sel.onchange=()=>{shRetPickOrd=parseInt(sel.value,10)||0;};
}

  const st=store.shipSettings||{};
  if(st.useRecipes && Array.isArray(st.shipRecipeIds)){
    if(!Array.isArray(st.manualGoods))st.manualGoods=(store.shipGoods||[]).slice();

    store.shipGoods=(store.products||[]).filter(p=>ids.indexOf(p.id)>=0).map(p=>({id:p.id,name:p.name}));
  } else {
    if(Array.isArray(st.manualGoods))store.shipGoods=st.manualGoods;
  }
}

  let hit=0;
  f.houses.forEach(h=>{ if(houses.indexOf(h)>=0) hit++; });
  if(!hit) return 0;                                   /* дома не пересеклись */
  return 10;
}

/* ==== ИМПОРТ НАКЛАДНЫХ ИЗ EXCEL: ЧТЕНИЕ .XLSX, ПРЕДПРОСМОТР, СОЗДАНИЕ НАКЛАДНЫХ (П6–П30) ==== */
/* ==== ИМПОРТ НАКЛАДНЫХ ИЗ EXCEL: ЧТЕНИЕ КНИГИ И РАЗБОР «СВОДКИ» (П6–П13) ==== */
const SH_XLSX_LIM=48*1024*1024;
function shXlsxU16(dv,o){ return dv.getUint16(o,true); }
function shXlsxU32(dv,o){ return dv.getUint32(o,true); }
function shXlsxInflate(bytes){
  const ds=new DecompressionStream('deflate-raw');
  return new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
}
async function _xlsxUnzip(buf){
  if(!buf||!buf.byteLength) throw new Error('Файл пустой — выбери .xlsx заново.');
  if(buf.byteLength>SH_XLSX_LIM) throw new Error('Файл больше 48 МБ — это точно не «Сводка»?');
  const u8=new Uint8Array(buf), dv=new DataView(buf);
  let eo=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){ if(dv.getUint32(i,true)===0x06054b50){ eo=i; break; } }
  if(eo<0) throw new Error('Это не .xlsx (zip-подпись не найдена). Пересохрани книгу в формате .xlsx.');
  const cnt=shXlsxU16(dv,eo+10), cd=shXlsxU32(dv,eo+16);
  const out={}; let p=cd;
  for(let n=0;n<cnt;n++){
    if(p+46>u8.length||dv.getUint32(p,true)!==0x02014b50) break;
    const m=shXlsxU16(dv,p+10), cs=shXlsxU32(dv,p+20);
    const nl=shXlsxU16(dv,p+28), el=shXlsxU16(dv,p+30), cl=shXlsxU16(dv,p+32);
    const lho=shXlsxU32(dv,p+42);
    const name=new TextDecoder('utf-8').decode(u8.subarray(p+46,p+46+nl));
    const lnl=shXlsxU16(dv,lho+26), lel=shXlsxU16(dv,lho+28), ds=lho+30+lnl+lel;
    const raw=u8.slice(ds,ds+cs);
    out[name]= m===0 ? raw : (m===8 ? new Uint8Array(await shXlsxInflate(raw)) : null);
    p+=46+nl+el+cl;
  }
  return out;
}
/* getElementsByTagName на XML-документе в браузере отдаёт коллекцию БЕЗ forEach
   (в отличие от массива в тестовом мини-DOM) — поэтому всегда приводим к массиву. */
function shEls(n,tag){ if(!n) return []; return Array.prototype.slice.call(n.getElementsByTagName(tag)); }
function shXlsxDoc(bytes){
  if(!bytes) return null;
  const x=new TextDecoder('utf-8').decode(bytes);
  const d=new DOMParser().parseFromString(x,'application/xml');
  if(!d||!d.documentElement) throw new Error('Повреждённый XML внутри книги — файл не читается.');
  return d;
}
function shXlsxShared(z){
  const d=shXlsxDoc(z['xl/sharedStrings.xml']);
  if(!d) return [];
  const out=[];
  shEls(d,'si').forEach(si=>{ let s=''; shEls(si,'t').forEach(t=>s+=t.textContent); out.push(s); });
  return out;
}
function shXlsxSheetList(z){
  const wbx=shXlsxDoc(z['xl/workbook.xml']);
  if(!wbx) throw new Error('В книге нет списка листов (workbook.xml).');
  const rels=shXlsxDoc(z['xl/_rels/workbook.xml.rels']);
  const map={};
  if(rels) shEls(rels,'Relationship').forEach(r=>{
    map[r.getAttribute('Id')]=String(r.getAttribute('Target')||'').replace(/^[\\/]?xl[\\/]/i,'').replace(/^[\\/]/,'');
  });
  const out=[];
  shEls(wbx,'sheet').forEach(sh=>{
    const rid=sh.getAttribute('r:id')||'';
    let path=map[rid]||'';
    if(path&&path.indexOf('xl/')!==0) path='xl/'+path;
    if(path) out.push({name:String(sh.getAttribute('name')||''),path:path});
  });
  if(!out.length) throw new Error('В книге не найдено ни одного листа.');
  return out;
}
function shXlsxColIdx(ref){
  const m=/^\$?([A-Za-z]+)/.exec(String(ref||''));
  if(!m) return -1;
  const s=m[1].toUpperCase(); let n=0;
  for(let i=0;i<s.length;i++) n=n*26+(s.charCodeAt(i)-64);
  return n-1;
}
function shXlsxCellText(c,ss){
  const t=c.getAttribute('t')||'n';
  if(t==='s'){
    const v=c.getElementsByTagName('v')[0];
    const i=v?+v.textContent:-1;
    return (i>=0&&i<ss.length)?String(ss[i]):'';
  }
  if(t==='inlineStr'){
    const is=c.getElementsByTagName('is')[0];
    if(!is) return '';
    let s=''; shEls(is,'t').forEach(x=>s+=x.textContent);
    return s;
  }
  const v=c.getElementsByTagName('v')[0];
  return v?v.textContent:'';
}
function _xlsxGrid(bytes,ss,limit){
  const d=shXlsxDoc(bytes);
  if(!d) return [];
  const rows=[];
  shEls(d,'row').forEach(r=>{
    const rn=+r.getAttribute('r')||(rows.length+1);
    const arr=[];
    shEls(r,'c').forEach(c=>{
      const ci=shXlsxColIdx(c.getAttribute('r'));
      arr[ci<0?arr.length:ci]=shXlsxCellText(c,ss);
    });
    for(let i=0;i<arr.length;i++) if(arr[i]==null) arr[i]='';
    rows[rn-1]=arr;
  });
  const out=[];
  for(let i=0;i<rows.length;i++){
    const r=rows[i];
    if(!r||!r.join('').trim()) continue;
    out.push({n:i+1,cells:r});
    if(limit&&out.length>=limit) break;
  }
  return out;
}
const SH_XLSX_ORDER_RE=/^заказ|заказ/i;
function shXlsxIsOrderSheet(name){
  const n=String(name||'').toLowerCase().replace(/\s+/g,' ').trim();
  return n.indexOf('заказ')>=0||/^№/.test(n);
}
function shXlsxFindSummary(sheets,maxScan){
  const list=sheets||[];
  for(let i=0;i<list.length;i++){
    if(/сводк|сводн|итог|все магазины|список/i.test(String(list[i].name||''))) return list[i];
  }
  let best=null,bestScore=0;
  for(let i=0;i<list.length;i++){
    if(shXlsxIsOrderSheet(list[i].name)) continue;
    const rows=_xlsxGrid(list[i].bytes,list[i].ss,(maxScan||12));
    for(let r=0;r<rows.length;r++){
      const line=rows[r].cells.join(' ').toLowerCase();
      if(line.indexOf('90')<0) continue;
      let sc=1;
      if(/200/.test(line)) sc+=2;
      if(/адрес|магазин|точк|объект|наимен|клиент/.test(line)) sc+=2;
      if(sc>bestScore){ bestScore=sc; best={name:list[i].name,row:rows[r].n-1,path:list[i].path,bytes:list[i].bytes,ss:list[i].ss,score:sc}; }
    }

}
function shXlsxIsDateCell(v){
  const s=String(v==null?'':v).replace(/\s+/g,'');

}
function shXlsxIsSeqCell(v){ return /^\d{1,5}$/.test(String(v==null?'':v).replace(/\s+/g,'')); }
/* Список без подписей: <дата или №> <адрес…> <90 г> <200 г>. Адрес — все колонки
   между № и 90 г; при подписях («Адрес») ничего не меняется. */
function shXlsxInferCols(head,c){
  if(c.addr>=0) return c;
  const qs=[];
  if(c.q90>=0) qs.push(c.q90);
  if(c.q200>=0) qs.push(c.q200);
  if(!qs.length) return c;
  const end=Math.min.apply(null,qs);
  if(end<1) return c;
  let from=0;
  if(c.num>=0) from=c.num+1;
  else if(shXlsxIsDateCell(head[0])||shXlsxIsSeqCell(head[0])) from=1;
  else if(String(head[0]==null?'':head[0]).trim()==''&&(shXlsxIsDateCell(head[1])||shXlsxIsSeqCell(head[1]))){ c.num=0; from=1; }
  if(from>=end) return c;
  c.addr=from; c.addrTo=end-1;
  if(c.num<0&&from>0) c.num=0;
  return c;
}
function shXlsxCols(head){
  const row=head||[];
  const c={num:-1,addr:-1,addrTo:-1,name:-1,q90:-1,q200:-1,price90:-1,price200:-1};
  for(let i=0;i<row.length;i++){
    const s=String(row[i]==null?'':row[i]).toLowerCase().replace(/\s+/g,' ').replace(/ё/g,'е').trim();
    if(!s) continue;
    const w90=/90\s*(г|гр|грамм|\x28\s*г)/.test(s)||/\b90\b/.test(s);
    const w200=/200\s*(г|гр|грамм)/.test(s)||/\b200\b/.test(s);
    const isPrice=/цена|стоимость|цена\s*продаж|руб|₽/.test(s);
    if(c.addr<0&&/адрес|адр\b|место доставки|наимен|магазин|точк|объект|клиент|получател/.test(s)) c.addr=i;
    if(c.name<0&&/^(магазин|наименование|название|точка|объект|клиент)/.test(s)) c.name=i;
    if(c.q90<0&&w90&&!isPrice) c.q90=i;
    if(c.q200<0&&w200&&!isPrice) c.q200=i;
    if(c.price90<0&&w90&&isPrice) c.price90=i;
    if(c.price200<0&&w200&&isPrice) c.price200=i;
    if(c.num<0&&/^\s*(№|n|no|номер|объект|адрес|магазин)/.test(s)&&!(/90/.test(s)||/200/.test(s))) c.num=i;
  }
  return shXlsxInferCols(row,c);
}
const SH_IMP_STOP=/^(альмак|канты|итого|итогое|всего|все|ящик[\wа-яё]*|ящики|коробк[\wа-яё]*|коробки|разница|итог|итоговая|проверка|проверки|договор[\wа-яё]*|служебн[\wа-яё]*|доставка|печать|отчет|отчёт|служ[\wа-яё]*|промежуточн[\wа-яё]*|общий[\wа-яё]*)(?![\wа-яё])/;
function shXlsxJunk(addr,q90,q200){
  const a=String(addr==null?'':addr).replace(/\s+/g,' ').trim();
  if(!a) return 'нет адреса';
  if(/^[\d\s.,/—-]+$/.test(a)) return 'вместо адреса номер';
  if(SH_IMP_STOP.test(a.toLowerCase().replace(/ё/g,'е'))) return 'служебная строка';
  if(typeof shAddrIsJunk==='function'&&shAddrIsJunk(a)) return 'мусор в адресе';
  if((+q90||0)+(+q200||0)<=0) return 'без количества';

}
function shXlsxNum(v){
  if(v==null) return 0;

function shXlsxBoxes(v){
  if(v==null||v==='') return 0;

  const n=parseFloat(s);

/* П41: разбор даты из ячейки/фрагмента. Года нет — берём из yearRef («2026-09-27» или «2026»). */
function shXlsxDateParts(v,yearRef){
  const s=String(v==null?'':v).replace(/\s+/g,'');
  const m=/^(\d{1,2})[.,\-\/](\d{1,2})(?:[.,\-\/](\d{2,4}))?$/.exec(s);
  if(!m) return '';
  let dd=+m[1], mm=+m[2], yy=m[3]?+m[3]:0;
  if(!yy){ const y=/^(\d{4})/.exec(String(yearRef||'')); if(!y) return ''; yy=+y[1]; }
  else if(yy<100) yy=(yy>70)?1900+yy:2000+yy;
  if(!(dd>=1&&dd<=31&&mm>=1&&mm<=12)) return '';
  return yy+'-'+(mm<10?'0':'')+mm+'-'+(dd<10?'0':'')+dd;
}
function shXlsxDateFromName(name){

  let dd=+m[1], mm=+m[2], yy=+m[3];
  if(yy<100) yy=(yy>70)?1900+yy:2000+yy;
  if(!(dd>=1&&dd<=31&&mm>=1&&mm<=12)) return '';
